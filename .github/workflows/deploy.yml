name: Deploy wiki to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Social cards and other CI-only plugins key off this (mkdocs.yml: !ENV [CI, false]).
      CI: "true"
      NO_MKDOCS_2_WARNING: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git-revision-date-localized and sitemap lastmod need full history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # Cairo renders the social cards (cairosvg); pngquant lets the optimize plugin shrink PNGs.
      - name: Install image libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libcairo2 libfreetype6 libffi8 libjpeg-turbo8 libpng16-16 zlib1g pngquant

      - run: pip install -r requirements.txt

      # Social cards, their Google Fonts downloads and optimized images live in .cache.
      # The social plugin does not notice edits to the card's SVG/favicon art, so the
      # key includes them and never falls back to a cache built from other art.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: mkdocs-cache-${{ hashFiles('layouts/**', 'docs/assets/favicon.svg', 'requirements.txt') }}-${{ github.sha }}
          restore-keys: |
            mkdocs-cache-${{ hashFiles('layouts/**', 'docs/assets/favicon.svg', 'requirements.txt') }}-

      - run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
