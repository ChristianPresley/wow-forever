name: Quality gates

# Accessibility (axe-core, both colour schemes), HTML validation, internal + external
# links, and Lighthouse budgets against a fresh strict build. Every check job is
# non-blocking (continue-on-error) while the baseline is brought to zero; flip a job to
# blocking by deleting its `continue-on-error` line. Reports land in the job summary and
# as artifacts. Local equivalents: see tests/README.md.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # weekly external link-rot sweep
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  NO_MKDOCS_2_WARNING: "1"
  NODE_VERSION: "22"

jobs:
  build:
    name: Build site (strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git-revision-date-localized needs history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: mkdocs build --strict
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site
          retention-days: 3

  html:
    name: HTML validation
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      - run: npm run test:html
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-html
          path: tests/reports/

  a11y:
    name: Accessibility (axe, light + dark)
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      # ubuntu-latest ships Google Chrome; playwright-core drives it via the "chrome" channel.
      - run: npm run test:a11y
        env:
          A11Y_MAX_VIOLATIONS: "0"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-a11y
          path: tests/reports/

  links:
    name: Links (internal offline + external)
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      # Internal links and #anchors, no network. Also writes tests/reports/external-urls.txt.
      - id: internal
        run: node tests/links.mjs
      - name: Restore lychee cache
        if: always()
        uses: actions/cache@v4
        with:
          path: .lycheecache
          key: lychee-${{ github.sha }}
          restore-keys: lychee-
      - name: External links (lychee)
        if: always()
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config tests/lychee.toml --no-progress tests/reports/external-urls.txt
          fail: true
          jobSummary: true
          output: tests/reports/lychee.md
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-links
          path: tests/reports/

  lighthouse:
    name: Lighthouse budgets
    needs: build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      - name: Lighthouse CI (3 runs per URL, median)
        run: |
          export CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable)"
          npx lhci autorun --config=tests/lighthouserc.json --collect.numberOfRuns=3
      - if: always()
        run: |
          npm run --silent test:lhci:summary
          cat tests/reports/lhci.md >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-lighthouse
          path: tests/reports/
