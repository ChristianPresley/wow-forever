site_name: Forever Codex
site_description: An unofficial, community-style wiki cataloguing World of Warcraft — Forever.
site_url: https://christianpresley.github.io/wow-forever/
repo_url: https://github.com/ChristianPresley/wow-forever
repo_name: ChristianPresley/wow-forever
edit_uri: edit/main/docs/

# Never publish patch and merge leftovers. The first two lines keep MkDocs' defaults.
exclude_docs: |
  .*
  /templates/
  *.orig
  *.rej
copyright: Unofficial fan wiki. World of Warcraft and Blizzard Entertainment are trademarks of Blizzard Entertainment, Inc. Not affiliated with or endorsed by Blizzard.

theme:
  name: material
  custom_dir: overrides
  language: en
  font: false
  icon:
    logo: codex/crest
    repo: fontawesome/brands/github
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - announce.dismiss
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.path
    - navigation.prune
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.tabs.link
    - content.action.edit
    - content.tooltips
    - content.footnote.tooltips
    - content.code.copy
    - toc.follow

extra_css:
  - stylesheets/extra.css
  - stylesheets/identity.css
  - stylesheets/interactive.css
  - stylesheets/guides.css
  - stylesheets/reference.css
  - stylesheets/components.css

extra_javascript:
  - javascripts/codex.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ChristianPresley/wow-forever
      name: Source on GitHub

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - abbr
  - toc:
      permalink: true
      title: On this page
      toc_depth: 3
  - pymdownx.details
  - pymdownx.keys
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - overrides/.icons

plugins:
  - search:
      separator: '[\s\-_,:!=\[\]()"`/'']+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - tags
  - git-revision-date-localized:
      type: date
      enable_creation_date: false
      fallback_to_build_date: true
  - social:
      enabled: !ENV [CI, false]
      cards_layout_dir: layouts
      cards_layout: codex
  - optimize:
      enabled: !ENV [CI, false]
  - privacy
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
      cache_safe: true
      htmlmin_opts:
        remove_comments: true
      js_files:
        - javascripts/codex.js
      css_files:
        - stylesheets/extra.css
        - stylesheets/identity.css
        - stylesheets/interactive.css
        - stylesheets/guides.css
        - stylesheets/reference.css
        - stylesheets/components.css

