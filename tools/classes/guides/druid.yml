faq:
  - q: "Is powershifting still necessary?"
    a: "No. Furor 5/5 gives back your Energy when you return to Cat Form, and Shifting Power changes mana into 40 Energy."
  - q: "Must I leave my form to drink a potion?"
    a: "No. Potions, Rage potions, Thistle Tea and most consumables work in form."
  - q: "Is the Bear a real tank in Forever?"
    a: "Yes, for dungeons and for the 10-player raid. Threat is +115% and Growl works like Taunt. Beta tier lists put the Bear below Warrior and Paladin. Launch hotfixes changed threat again, and no raid data exists."
  - q: "Where are Mangle, Berserk and Tiger's Fury?"
    a: "Primal Bite replaced Mangle. Shifting Power replaced Tiger's Fury. Blizzard removed Berserk before launch."
  - q: "At which level do I get Shifting Power, Lacerate and Primal Bite?"
    a: "In the launch client, Shifting Power and Primal Bite need 30 Feral points. The leveling build takes Shifting Power at 40, Lacerate at 41 and Primal Bite at 42. Beta-era guides give lower levels."
  - q: "Can I use Feral Charge in Cat Form?"
    a: "This is not confirmed. Beta-era guides gave Feral Charge a Cat version. The tooltip in the launch client lists only Bear Form and Dire Bear Form."
  - q: "Why can I not use Ravage from Shadowmeld?"
    a: "A hotfix on 6 November stopped Ravage and Pounce from Shadowmeld for Night Elf Druids. Use Prowl."
  - q: "Feral Swiftness or Feline Swiftness?"
    a: "The launch client calls the talent Feral Swiftness. Feline Swiftness is the Classic name, and some guides still use it."
  - q: "Moonkin Form or Leader of the Pack?"
    a: "Each aura gives 3% crit to the raid. Reportedly, they do not stack, so a raid needs only 1 of them."
  - q: "Which race is best?"
    a: "The differences are marginal. Tauren is the best Bear. Night Elf has the best burst for Cat. The 2 Skyborne races have haste for Balance and Cat. Read the Race add-ons: [Night Elf](night-elf.md), [High Order Skyborne](skyborne-high-order.md), [Tauren](tauren.md) and [Windshaper Skyborne](skyborne-windshaper.md)."

