equipment:
  intro: |
    A Druid uses 3 different sets of items. Feral needs leather with Strength and Agility and a strong two-hand weapon. Balance needs spell damage, and Restoration needs healing power. With dual spec at level 40, you carry 2 of these sets.

    About 40% of the items of Forever had hidden stats at launch. The stats of an item become visible when a player first finds it. Thus, no source has a tested list for level 60. The item names on this page come from Timesaver.gg (data of 6 November 2026), Method.gg, wowtbc.gg and Warcraft Tavern. The Codex did not verify the stats.

    The crafted leather items have families with a name, for example Brawler's, Totemic, Wisdom's, Skulker's, Skycaller's, Mender's and Warden's. The client data gives no stats. The role of each family on this page comes from the fan lists that use it.
  proficiencies:
    - ["Leather and cloth armor", "Level 1", "No mail, no plate and no shields. A lower armor type has no penalty in Forever"]
    - ["Staves", "Level 1", "A default weapon skill for the 2 factions"]
    - ["Daggers", "Level 1 (Alliance) or weapon master", "Horde trainers: Sayoc in Orgrimmar and Archibald in the Undercity"]
    - ["One-hand maces", "Level 1 (Horde) or weapon master", "Alliance trainer: Buliwyf Stonehand in Ironforge"]
    - ["Two-hand maces", "Weapon master, 10 silver", "Buliwyf Stonehand in Ironforge and Ansekhwa in Thunder Bluff"]
    - ["Fist weapons", "Weapon master, 10 silver", "Ilyenia Moonfire in Darnassus, Buliwyf Stonehand in Ironforge and Sayoc in Orgrimmar"]
    - ["Polearms", "Weapon master, level 20, 1g", "New for Druids. Woo Ping in Stormwind and Archibald in the Undercity"]
    - ["Off-hand items", "Level 1", "Use them with a one-hand mace or a dagger. They can have an enchant in Forever"]
    - ["Idols (relic slot)", "Level 16", "For Druids only. The first idol comes from the Aquatic Form quest"]
  rules:
    - "In form, your auto-attack uses the DPS of your weapon. Shred, Claw, Ravage, Primal Bite and Lacerate do a percentage of weapon damage."
    - "Weightstones, sharpening stones, weapon enchants and Windfury Totem work in form."
    - "Potions and most consumables work in form. Potions still have 1 shared cooldown."
    - "Hit is 1 stat for melee, ranged attacks and spells. A melee attack needs 9% hit against a raid boss (Warcraft Tavern)."
    - "Nature's Reach gives 4% hit. Its tooltip does not limit the hit to spells, and Warcraft Tavern uses it for Cat."
    - "Expertise is a new stat. It replaces weapon skill, and it decreases the chance that an enemy dodges or parries. No source gives a confirmed cap."
    - "A tank needs 440 Defense against raid bosses (Warcraft Tavern)."
    - "Weapons have spell damage and healing from about level 10. Healing items also have spell power."
    - "HoTs can crit in Forever. Haste does not make DoTs or HoTs tick faster (Warcraft Tavern)."
    - "Method.gg says that the Embrace of the Viper set and the Blackened Leather set have new bonuses."
    - "Many of the best patterns cost Merchant's Favor at Three Corners in Redridge Mountains."
    - "Each profession gives a camp feature in place of a passive stat."
  enchants:
    - ["Two-hand weapon (Feral)", "Crusader, or Agility or Strength (+25)", "Enchant 2H Weapon - Strength is new. The values are from Method.gg (beta data)"]
    - ["Two-hand weapon (caster)", "Spellblasting (+65 spell power)", "New. Mighty Spell Power gives up to +55. The values are from Method.gg (beta data). The level 300 recipes need Nexus Crystal, Fel Crystal or Torbernite, and no source says where they come from"]
    - ["Two-hand weapon (healer)", "Mighty Healing Power", "New. Up to 100 healing and 34 spell damage (Method.gg, beta data). It needs the same reagents"]
    - ["Off-hand item", "Excellent Spirit (+12) or Superior Intellect (+9)", "New slot"]
    - ["Necklace", "Agility, Strength, Deflection, Spell Power or Healing Power", "New slot. Enchanting skill 210"]
    - ["Chest", "Greater Stats (+4)", "Value from Method.gg (beta data)"]
    - ["Bracers", "Superior Strength or Agility (+9), or Greater Spellpower (+16)", "Greater Spellpower is new. The values are from Method.gg (beta data)"]
    - ["Gloves", "Superior Agility or Strength (+15)", "Value from Method.gg (beta data)"]
    - ["Boots", "Greater Agility (+7) or Greater Stamina (+7)", "Value from Method.gg (beta data)"]
    - ["Cloak", "Agility, or Armor (+70)", "Enchant Cloak - Agility is new. The armor value is from Method.gg (beta data). Use Greater Resistance for Onyxia's Lair"]
    - ["Head, legs, hands, feet", "Forceful Armor Kit or Mystic Armor Kit", "New. Forceful gives Attack Power and armor. Mystic gives spell power and armor. The Rugged kits need Fel Hide, and no source says where it comes from"]
  consumables:
    - ["Leveling, Feral", "Coarse to Dense Weightstone", "A weightstone is for a mace or a staff. A polearm uses a sharpening stone (Classic rule)"]
    - ["Leveling, Feral", "Rage Potion, Great Rage Potion, Thistle Tea", "Rage for Bear and Energy for Cat. They work in form"]
    - ["Leveling, caster", "Minor Wizard Oil, Minor Mana Oil", "Enchanting skill 5 and 150"]
    - ["All levels", "Healing potions", "First Aid now makes them, from Minor Healing Potion to Major Healing Potion"]
    - ["Level 60, Cat", "Elixir of the Mongoose, Major Frenzy Potion", "Major Frenzy Potion is new: +80 Attack Power for 30 seconds (Method.gg, beta data)"]
    - ["Level 60, Cat", "Major Mana Potion", "Mana for Shifting Power"]
    - ["Level 60, Bear", "Mighty Rage Potion, Greater Stoneshield Potion, Flask of the Titans", "The Kami-labs simulation uses about 1.5 Mighty Rage Potions for each fight"]
    - ["Level 60, Balance", "Greater Arcane Elixir, Major Spellblasting Potion, Brilliant Wizard Oil", "Major Spellblasting Potion is new: +47 spell damage for 30 seconds (Method.gg, beta data)"]
    - ["Level 60, Restoration", "Greater Mageblood Elixir, Brilliant Mana Oil, Sage's Tea", "Sage's Tea is new food: +44 healing power (Method.gg, beta data)"]
    - ["Raids", "Flask of Natural Accuracy and the 3 other Natural flasks", "New. 60 Stamina and 4% to 5% of 1 stat (Method.gg, beta data). They work only in Mount Hyjal, Hyjal Summit and the Barrow Deeps"]
    - ["Raids", "Greater Fire Protection Potion", "For Onyxia's Lair"]
