equipment:
  intro: |
    A Hunter wears leather to level 39 and can wear mail from level 40. The most important slot is the ranged weapon, because it sets the damage of Auto Shot and of all shots. For Beast Mastery and Marksmanship, the melee weapon gives stats only. For Survival, the melee weapon does damage.

    About 40% of the items of Forever had hidden stats at launch. The stats of an item become visible when a player first finds it. Thus, no source has a tested list for level 60. The item names on this page come from Timesaver.gg (data of 6 November 2026), Warcraft Tavern, Method.gg, wowtbc.gg, Kami Labs and ConquestCapped. Only the Drowned City items have public stats.
  proficiencies:
    - ["Cloth and leather armor", "Level 1", "No shields"]
    - ["Mail armor", "Level 40", "From the class trainer. Leather and mail are both good at level 60 (Warcraft Tavern)"]
    - ["Bows", "Weapon master", "Darnassus and Orgrimmar. Bows use arrows from a quiver"]
    - ["Guns", "Weapon master", "Ironforge and Thunder Bluff. Guns use bullets from an ammo pouch"]
    - ["Crossbows", "Weapon master", "Ironforge, Stormwind and the Undercity. No source says which ammunition they use in Forever"]
    - ["Axes and swords, one-hand and two-hand", "Weapon master", "Axes: Ironforge and Orgrimmar. Swords: Stormwind and the Undercity"]
    - ["Staves, daggers, fist weapons, thrown weapons", "Weapon master", "Warcraft Tavern says that all Hunters start with daggers"]
    - ["Polearms", "Level 20", "Stormwind (Woo Ping) and the Undercity (Archibald)"]
    - ["Maces", "Not available", "A Hunter cannot use maces"]
  rules:
    - "The starting weapon of each race is a Classic-era fact: guns for Dwarves and Tauren, bows for Night Elves, Orcs and Trolls. No source gives it for Humans and Skyborne."
    - "No race has a weapon skill bonus in Forever. Weapon skill on items is much lower than in Classic."
    - "Method.gg says that Expertise replaces weapon skill on items. Warcraft Tavern says that the skill itself did not change. The exact rule is not clear."
    - "Method.gg says that hit is 1 stat for melee, ranged attacks and spells. Crit is 1 stat (Warcraft Tavern)."
    - "Against a level 63 boss you need 9% hit at 300 weapon skill, or 6% at 305 (Warcraft Tavern)."
    - "1 Agility gives 2 ranged Attack Power and 1 melee Attack Power. 53 Agility gives 1% crit at level 60."
    - "14 Attack Power gives 1 damage per second. The pet gets 10% of your Attack Power and 100% of your crit."
    - "1 Intellect gives 15 mana. With Careful Aim 5/5, it also gives 1 Attack Power."
    - "Haste is a stat in Forever. Warcraft Tavern did not see it on items in the beta."
    - "A quiver or an ammo pouch uses 1 bag slot. Warcraft Tavern says that it often gives ranged attack speed, but gives no values."
    - "Necklaces can have an enchant in Forever."
    - "Healing potions come from First Aid, not from Alchemy."
    - "Each profession gives a camp feature in place of a passive stat. The Camp Chair of Skinning gives 2% crit."
  enchants:
    - ["Bracers", "Lesser Agility, Agility, Greater Agility, Superior Agility", "New. Enchanting skill 140, 190, 240 and 295"]
    - ["Gloves", "Agility, Greater Agility, Superior Agility", "Superior Agility needs skill 300"]
    - ["Boots", "Minor Speed, then Greater Agility", "Run speed while you level"]
    - ["Cloak", "Minor Agility, Lesser Agility, Agility", "Cloak - Agility is new and is a Merchant's Favor recipe"]
    - ["Chest", "Stats, then Greater Stats", "Classic-era enchants"]
    - ["Necklace", "Agility", "New slot. Enchanting skill 210"]
    - ["Melee weapon", "Weapon - Agility or 2H Weapon - Agility", "2H Weapon - Lesser Agility is new at skill 210"]
    - ["Ranged weapon", "Scopes from Engineering", "Crude, Standard, Accurate, Deadly and Sniper Scope. The SAF-T Ultra Precision Scope is new"]
    - ["Armor", "Forceful armor kits from Leatherworking", "New kits for physical damage dealers. No source gives the values"]
  consumables:
    - ["Leveling", "Elixir of Minor Agility, Lesser Agility, Agility, Greater Agility", "Alchemy. The first 2 elixirs need skill 50 and 140"]
    - ["Leveling", "Pet food", "A Happy pet does 125% damage. An Unhappy pet does 75%"]
    - ["Leveling", "Healing potions and bandages", "First Aid makes both. Freezing Trap gives you time to use a bandage"]
    - ["All levels", "The best ammunition", "Buy it in each town. Engineering makes bullets from Crafted Light Shot to Thorium Shells"]
    - ["Level 60", "Elixir of the Mongoose", "Alchemy skill 280. Classic-era Agility and crit elixir"]
    - ["Level 60", "Swiftstrike Steak, Flank au Poivre", "New Agility food, Cooking skill 275. No source gives the values"]
    - ["Level 60", "Swiftfeather Arrow, Swiftstrike Shot", "New epic ammunition, Engineering skill 300. No source gives the stats"]
    - ["Level 60", "Flask of Natural Precision and 3 more new flasks", "Alchemy skill 300. They need Death Lotus. No source gives the effects"]
    - ["Raids", "Greater Fire Protection Potion", "For Onyxia's Lair"]
    - ["Raids", "Mana potions", "Long fights use all your mana"]
