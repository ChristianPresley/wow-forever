# ------------------------------------------------------------------ other sections
professions: |
  All sources recommend **Tailoring** for a Mage. Method.gg says that gathering professions are not necessary.

  | Rank | Professions | Use them for | Camp features |
  |---|---|---|---|
  | **S**{ .tier .tier-s } | [Tailoring](../../professions/tailoring.md) + [Enchanting](../../professions/enchanting.md) | Cloth with spell power from level 10, bags and wands. You disenchant the cloth that you do not use | Faction Banner (Spirit), Enchanted Lute |
  | **A**{ .tier .tier-a } | [Herbalism](../../professions/herbalism.md) + [Alchemy](../../professions/alchemy.md) | Mana potions and elixirs for raids | Incense Candle (Intellect), Mana Well (mana regeneration) |
  | **B**{ .tier .tier-b } | [Tailoring](../../professions/tailoring.md) + [Engineering](../../professions/engineering.md) | PvP gadgets. Gnomes have 20% fewer device failures | Faction Banner (Spirit), Reagent Bot |

  In Forever, a profession gives no passive stats. Each profession adds a [camp feature](../../systems/camping.md). A crafting profession gives [Legacy Points](../../characters/legacy.md) at skill 150, 225 and 300.

  [First Aid](../../professions/first-aid.md) now makes healing potions. [Cooking](../../professions/cooking.md) and [Fishing](../../professions/fishing.md) are also useful. Compare all classes in [Best professions by class](../../characters/professions.md#best-professions-by-class).

  A Skyborne has Read Ley Line for the time between fights, so Tailoring helps it more than early Alchemy. A Gnome is the best race for Engineering.

  **Comprehension** is a minor tradeskill for Mages only. You loot scrolls from creatures, and *Comprehend Scroll* changes them into temporary buffs or better items. Warcraft Tavern says that a failed decipher can change you into a sheep.

  Reportedly, the book quests gave a *Research* spell that made a Bundle of Scrolls once each hour. A hotfix of 6 November says that Mages no longer learn this spell. It is not known if the spell will return.

legacy: |
  You can spend a maximum of 16 [Legacy](../../characters/legacy.md) points on 1 character.

  | Tree | Picks for a Mage |
  |---|---|
  | Adventure | **Well Rested** 5/5, then **Talented** 5/5. Talented gives your first talent point up to 5 levels earlier. *Thrill of Adventure* decreases the time that you drink |
  | Resourcefulness | **Reagent Economy** removes the reagent cost of teleports, portals and Arcane Brilliance. **Permanence** is for long buffs |
  | Professions | *Working Overtime* helps skill-ups in Tailoring and Comprehension |

