faq:
  - q: "Which path is best for leveling: Frost, Arcane or Fire?"
    a: "Frost is the safest, and most guides recommend it. Arcane is strong solo when you have Arcane Blast and Missile Barrage. Fire is the weakest at low levels because it needs crit."
  - q: "Why does Arcane Blast use so much mana?"
    a: "Each stack increases its mana cost by 100%. Cast other spells between 2 casts, and let the stacks expire outside a burst phase."
  - q: "Why do guides give different numbers for Arcane Blast?"
    a: "Blizzard's deep dive from the beta gave +175% mana cost and 15% of Intellect for each stack. The launch client gives +100% mana cost and 12% of Intellect, with a maximum of 4 stacks for 18 seconds."
  - q: "Why does Ice Lance not cast?"
    a: "Ice Lance has the same 8 second cooldown as Fire Blast."
  - q: "Is Hot Streak a different talent from Heating Up?"
    a: "No. The BlizzCon demo and some guides call the proc Hot Streak. Blizzard's deep dive and the client call it Heating Up. It is 1 talent."
  - q: "Can Horde Mages go to Dalaran?"
    a: "NPCs in Dalaran attack Horde characters on sight, and Horde characters cannot get Kirin Tor reputation. They can go into the City of Dalaran dungeon through the sewer."
  - q: "Is AoE farming still possible?"
    a: "Yes, but it is weaker. Improved Blizzard slows by a maximum of 40%, and Cone of Cold is shorter."

