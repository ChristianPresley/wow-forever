equipment:
  intro: |
    A Paladin wears mail to level 39 and plate from level 40. The weapon decides the role: a slow two-hand weapon for Retribution, a one-hand weapon and a shield for Protection and Holy. After dual spec at level 40 you carry 2 sets.

    About 12,600 items of Forever had hidden stats at launch. The stats of an item become visible when a player first finds it. Thus, no source has a tested list for level 60. The item names on this page come from Timesaver.gg (data of 6 November 2026), wowtbc.gg, Method.gg, Warcraft Tavern and ConquestCapped. The Codex did not verify the stats.

    The 3 Timesaver.gg lists give different items for each spec. The tool computes them from stat weights. It leaves out world drops, reputation items and raid items.
  proficiencies:
    - ["Mail armor", "Level 1", "Cloth and leather are also possible. Healers sometimes use them for caster stats"]
    - ["Plate armor", "Level 40", "Plate appearances for transmog also need level 40"]
    - ["Shields", "Not published", "The Timesaver.gg tables show shields from quests at level 5 to 10"]
    - ["One-hand maces", "Level 1", "Default weapon skill. No trainer is necessary"]
    - ["One-hand and two-hand axes, two-hand maces", "Weapon master", "Buliwyf Stonehand in Ironforge. Hanashi and Sayoc in Orgrimmar. Ansekhwa in Thunder Bluff for two-hand maces"]
    - ["One-hand and two-hand swords", "Weapon master", "Woo Ping in Stormwind. Archibald in the Undercity"]
    - ["Polearms", "Weapon master, level 20", "Woo Ping in Stormwind. Archibald in the Undercity"]
    - ["Relic (Libram)", "Ranged slot", "Small passive bonuses for 1 class. No source gives the effect of a Libram"]
    - ["Staves, daggers, wands, ranged weapons", "Never", "Warcraft Tavern says that Paladins cannot use staves"]
  rules:
    - "Hit is 1 stat for melee, ranged attacks and spells. Crit is also 1 stat (Method.gg)."
    - "No source confirms a hit cap for Forever. Leprestore says that no exact value is confirmed. The Classic caps assume Weapon Skill, and Expertise replaces it in Forever. Thus, do not use a Classic cap."
    - "Hit comes from Precision (3%), from Divine Precision (8%, Holy spells only) and from the Dwarf racial Artisan's Precision (1%)."
    - "Blizzard has not published a Defense target for Forever. The Classic target of 440 Defense is not confirmed."
    - "Healing items also give spell power (Method.gg). Weapons can have spell power or healing power from about level 10."
    - "Champion of the Light changes Intellect into spell damage. Thus, Intellect is a damage stat for Retribution from level 35."
    - "Seal of Command needs a slow weapon. ConquestCapped says 3.2 seconds or slower. Warcraft Tavern recommends a faster weapon for Seal of Fury."
    - "You can use a weapon stone or an oil together with a Seal (Classic rule)."
    - "For leveling, ConquestCapped puts Stamina, Spirit and Intellect before Strength, because most damage comes from abilities. Leprestore puts weapon damage, Strength and crit first. The 2 sources agree that the weapon is the most important item."
    - "Transmog is account-wide, and it works only for the same armor type."
    - "Necklaces and off-hand items can have enchants. These slots are new."
    - "Professions give no passive stats. Camp buffs do not stack with the equivalent class buff: the Lodestone does not stack with Blessing of Might."
    - "The rare crafted items of Blacksmithing have 5 versions for each slot. The client data gives no stats for them, so read the tooltip."
  enchants:
    - ["Two-hand weapon", "Crusader", "The Classic standard for Retribution. Its value in Forever is not tested"]
    - ["Two-hand weapon", "Strength (2H) or Superior Impact (2H)", "Enchant 2H Weapon - Strength is new, at Enchanting skill 290"]
    - ["One-hand weapon (healer)", "Healing Power", "Changed in Forever. Read the tooltip"]
    - ["One-hand weapon (tank)", "Spell Power or Crusader", "Warcraft Tavern names spell power as the main damage stat of Protection"]
    - ["Shield", "Excellent Stamina or Critical Strike", "The 2 enchants are new, at Enchanting skill 300"]
    - ["Shield", "Iron, Mithril or Thorium Shield Spike", "Blacksmithing"]
    - ["Necklace", "Strength, Deflection, Healing Power or Spell Power", "New slot. Enchanting skill 210, with Merchant's Favor"]
    - ["Gloves", "Superior Strength or Holy Power", "New. Enchanting skill 300, with Merchant's Favor"]
    - ["Bracers", "Superior Deflection, Superior Intellect or Greater Spellpower", "New. Enchanting skill 300, with Merchant's Favor"]
    - ["Cloak", "Greater Fire Resistance", "For Onyxia's Lair. Fire resistance is recommended, but no source gives a number"]
  consumables:
    - ["Leveling", "Rough to Dense Weightstone or Sharpening Stone", "Blacksmithing. Weightstones are for maces. Sharpening stones are for swords, axes and polearms (Classic rule)"]
    - ["Leveling", "Minor Mana Oil, Lesser Mana Oil", "Enchanting. For healers"]
    - ["Leveling", "Elixir of Minor Strength, Elixir of Ogre Strength", "Alchemy. The client marks the 2 elixirs as changed"]
    - ["Leveling", "Beer Basted Boar Ribs and other Strength food", "Cooking. Method.gg says that most stat food also gives +5% XP"]
    - ["All levels", "Healing potions", "First Aid makes them in Forever, not Alchemy"]
    - ["Level 60", "Major Mana Potion", "Alchemy. For all 3 specs"]
    - ["Level 60", "Elixir of the Mongoose, Flask of the Titans, Flask of Distilled Wisdom", "The client marks them as not changed from Classic"]
    - ["Level 60", "Brilliant Mana Oil, Brilliant Wizard Oil", "Enchanting. For healers and for tanks with spell power"]
    - ["Level 60", "Greater Fire Protection Potion", "For Onyxia's Lair (Classic advice)"]
    - ["Level 60", "Symbol of Kings, Symbol of Divinity", "Reagents for Greater Blessings and Divine Intervention. The Legacy talent Reagent Economy removes them"]
