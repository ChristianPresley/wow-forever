    pitch: "The Holy and Discipline set from quests and dungeons. You look for healing power, Intellect, mana regeneration and Spirit. You need no hit. Most item names come from the Holy list of Timesaver.gg."
    stats: "Leveling: Intellect and spell power > Stamina and Spirit > Armor. Level 60: Healing power > Intellect > MP5 (mana each 5 seconds) > Spirit > Crit"
    chapters:
      l1:
        text: "Your first important item is a wand, because you also kill enemies alone. Night Elves and Undead get a robe from their class quest at about level 5."
        items:
          - {slot: "Wand", name: "Lesser Magic Wand", from: craft, profession: enchanting, where: "usable at level 5"}
          - {slot: "Staff", name: "Apprentice's Spellstaff", from: quest, where: "*Rare Books*, Elwynn Forest (Alliance)", basis: forever}
          - {slot: "Chest", name: "Moon Robes of Elune", from: class, where: "*Garments of the Moon* (Night Elf)", basis: forever}
          - {slot: "Chest", name: "Acolyte's Sacrificial Robes", from: class, where: "*Garments of Darkness* (Undead)", basis: forever}
      l10:
        text: "Bonus healing on an item also gives one third of its value as spell damage. Thus a healer weapon is also good for quests. Hall of Thanes and Ragefire Chasm give the first healer items."
        items:
          - {slot: "Wand", name: "Greater Magic Wand", from: craft, profession: enchanting, where: "usable at level 13"}
          - {slot: "Main hand", name: "Thornroot Club", from: quest, where: "*Ursal the Mauler*, Teldrassil (Alliance)", basis: forever}
          - {slot: "Main hand", name: "Makeshift Stormcaller", from: quest, where: "*Stormy Potential*, Durotar (Horde)", basis: forever}
          - {slot: "Dagger", name: "Fang of Magmatus", from: dungeon, dungeon: hall-of-thanes, basis: forever}
          - {slot: "Off-hand", name: "Dwarven Tome", from: quest, where: "*Important Heirlooms*, Hall of Thanes (Alliance)", basis: forever}
          - {slot: "Neck", name: "Ephemeral Choker", from: dungeon, dungeon: hall-of-thanes, basis: forever}
          - {slot: "Main hand", name: "Trogg Scepter", from: dungeon, where: "Ragefire Chasm", basis: forever}
