equipment:
  intro: |
    A Priest wears cloth for all 60 levels and cannot use shields or relics. The wand is the main weapon until Penance at level 30 or Shadowform at level 40. From level 40, dual spec lets you play 2 roles, so carry a healer set and a damage set.

    About 40% of the items of Forever had hidden stats at launch. The stats of an item become visible when a player first finds it. Most item names for each level come from 1 tool, Timesaver.gg (data of 6 November 2026). It shows no stats and no levels. The level 60 lists come from the Kami-Labs tool of 9 November. Use each list as candidates, not as tested lists. The Codex did not verify the stats.

    No source compares a staff with a one-hand weapon and an off-hand item in numbers.
  proficiencies:
    - ["Cloth armor", "Level 1", "The only armor type of the Priest. No shields and no relics"]
    - ["Wands", "Level 1", "A default skill. The wand goes in the ranged slot"]
    - ["One-hand maces", "Level 1", "A default skill (Warcraft Tavern). Not tested in the game"]
    - ["Daggers", "Weapon trainer, 10 silver", "Darnassus, Ironforge, Stormwind, Orgrimmar and the Undercity"]
    - ["Staves", "Weapon trainer, 10 silver", "Darnassus, Stormwind, Orgrimmar and Thunder Bluff"]
    - ["Off-hand items", "Level 1", "Use them with a mace or a dagger. They can have an enchant in Forever"]
  rules:
    - "Bonus healing on an item also gives one third of its value as spell damage. Caster weapons give spell damage and healing."
    - "Early wands have spell power as a stat, from about level 5 (Warcraft Tavern)."
    - "In the beta, wand damage increased with your spell power. RankedBoost reports that Blizzard removed this on 24 September 2026. No source tested it after launch."
    - "Hit is 1 stat for melee, ranged attacks and spells. Heals cannot miss, so a healer needs no hit."
    - "A spell misses a raid boss 16% of the time (Warcraft Tavern). A search result from Icy Veins gives 17%. Blizzard has published no cap."
    - "Shadow Focus gives 5% Shadow hit. Thus a Shadow Priest needs 11% to 12% hit from items at level 60."
    - "Holy Precision gives 18% Holy hit with 3 points. This is more than the boss miss chance of 16% or 17% that the sources give. Thus a Smite build probably needs no hit on items."
    - "Intellect gives mana and spell crit. Mental Strength increases your total Intellect by a maximum of 10%."
    - "Spirit is a real healer stat. Meditation keeps 50% of the regeneration while you cast, and Spiritual Guidance changes Spirit into healing."
    - "The Warcraft Tavern Priest guide says that Forever has haste as a stat. Its stats guide says that no known item has haste."
    - "Necklaces and off-hand items can have enchants. These slots are new."
    - "Each profession gives a camp feature in place of a passive stat. The Faction Banner of Tailoring gives Spirit and does not stack with Divine Spirit."
    - "The 20 library books give the Philanthropist's Ring with 10 spell power (Warcraft Tavern)."
  enchants:
    - ["Staff", "Enchant 2H Weapon - Mighty Healing Power, Mighty Spell Power or Spellblasting", "New. Enchanting 300. Each formula costs 240 Merchant's Favor. The 2 Mighty enchants need Fel Crystal, and no source gives where it comes from"]
    - ["One-hand weapon", "Enchant Weapon - Healing Power or Spell Power", "Enchanting 300. Kami-Labs uses Mighty Intellect on its healer dagger"]
    - ["Off-hand item", "Enchant Off-Hand - Superior Intellect, Excellent Spirit or Wisdom", "New slot. Enchanting 300"]
    - ["Necklace", "Enchant Necklace - Healing Power or Spell Power", "New slot. Enchanting 210. The formula costs 120 Merchant's Favor"]
    - ["Chest", "Enchant Chest - Major Intellect", "Enchanting 290"]
    - ["Bracers", "Enchant Bracer - Healing Power, Superior Intellect or Greater Spellpower", "Superior Intellect and Greater Spellpower are new"]
    - ["Gloves", "Enchant Gloves - Healing Power, Shadow Power or Holy Power", "Holy Power is new. It is for a Smite build"]
    - ["Boots", "Enchant Boots - Spirit or Speed", "Speed is new"]
    - ["Cloak", "Enchant Cloak - Greater Fire Resistance", "For Onyxia's Lair. Blizzard recommends fire resistance but gives no number"]
    - ["Leveling", "Enchant Bracer - Minor Healing Power, Enchant Chest - Lesser Intellect", "Cheap enchants at Enchanting 90 and 80. Minor Healing Power is new"]
  consumables:
    - ["Leveling", "Minor Wizard Oil", "Enchanting skill 5 in Forever. In Classic it needed skill 45"]
    - ["Leveling", "Water and crafted food", "Cooked food gives an XP buff while you level (Warcraft Tavern)"]
    - ["Level 60, healer", "Brilliant Mana Oil, Flask of Distilled Wisdom", "Classic-era effects. Enchanting 300 and Alchemy 300"]
    - ["Level 60, Shadow", "Brilliant Wizard Oil, Flask of Supreme Power, Elixir of Shadow Power", "Classic-era effects. The recipes are not changed"]
    - ["Level 60, Shadow", "Major Spellblasting Potion", "New. Alchemy 285. The Kami-Labs simulation uses it. The exact effect is not known"]
    - ["Level 60", "Major Mana Potion", "Alchemy 295"]
    - ["Level 60", "Major Healing Potion", "Healing potions come from First Aid in Forever. First Aid 275"]
    - ["Raids", "Greater Fire Protection Potion", "For Onyxia's Lair. Alchemy 290"]
    - ["New, effect not known", "Mender's Potions, Cleric's Elixirs, Mageblood Elixirs", "New Alchemy recipes. No source gives the effects"]
  sources:
    - {title: "Timesaver.gg: Priest leveling gear, Shadow", url: "https://timesaver.gg/tools/wow-forever/leveling-gear/priest/shadow"}
    - {title: "Timesaver.gg: Priest leveling gear, Holy", url: "https://timesaver.gg/tools/wow-forever/leveling-gear/priest/holy"}
    - {title: "Kami-Labs: BiS lists for level 60 (tool in beta)", url: "https://kami-labs.fr/en/bis-list-wow-forever/"}
    - {title: "Kami-Labs: Shadow Priest build and simulation", url: "https://kami-labs.fr/en/wow-forever/build-pretre-ombre-shadow-magic-wow-forever/"}
    - {title: "Warcraft Tavern: Priest guide", url: "https://www.warcrafttavern.com/forever/guides/priest/"}
    - {title: "Warcraft Tavern: Priest leveling guide", url: "https://www.warcrafttavern.com/forever/guides/priest-leveling/"}
    - {title: "Warcraft Tavern: Shadow Priest guide", url: "https://www.warcrafttavern.com/forever/guides/shadow-priest/"}
    - {title: "Warcraft Tavern: Holy Priest guide", url: "https://www.warcrafttavern.com/forever/guides/holy-priest/"}
    - {title: "Warcraft Tavern: weapon trainers", url: "https://www.warcrafttavern.com/forever/guides/weapon-trainers/"}
    - {title: "Warcraft Tavern: stats", url: "https://www.warcrafttavern.com/forever/guides/stats/"}
    - {title: "Method.gg: Priest leveling guide and talents", url: "https://www.method.gg/wow-forever/wow-forever-priest-leveling-guide-and-talents"}
    - {title: "wowtbc.gg: Shadow Priest item lists for level 60", url: "https://wowtbc.gg/warcraftforever/bis-list/shadow-priest/"}
    - {title: "wowtbc.gg: Holy Priest item lists for level 60", url: "https://wowtbc.gg/warcraftforever/bis-list/holy-priest/"}
    - {title: "LFCarry: sets and crafted tier items", url: "https://lfcarry.com/guides/wow-forever-bis-lists"}
    - {title: "RankedBoost: hit and spell power", url: "https://rankedboost.com/world-of-warcraft/forever/stats/hit/"}
    - {title: "Blizzard: raid overview", url: "https://news.blizzard.com/en-us/article/24303009/"}

