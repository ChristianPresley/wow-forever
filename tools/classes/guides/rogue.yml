faq:
  - q: "Which path is best for leveling: Combat, Assassination or Subtlety?"
    a: "Combat. It works with each weapon type, and it needs no position behind the target. Assassination is good if you have 2 good daggers. Subtlety is best in a group."
  - q: "Which race is best?"
    a: "All races are good. For Alliance PvP, guides recommend Human or Gnome. For Alliance PvE, they recommend Night Elf or Human. For the Horde, they recommend Orc for PvE and PvP. Undead is the usual Horde PvP selection."
  - q: "Is Venom a finishing move?"
    a: "No. In the launch client, Venom is a passive talent that starts when you use Shank. The deep dive of Blizzard from October described a finishing move for 25 Energy."
  - q: "Must I still time my abilities to the Energy tick?"
    a: "No. Energy regenerates smoothly in Forever."
  - q: "Do I lose my Combo Points when I change targets?"
    a: "No. They stay on the first target, and you can go back and use them."
  - q: "Why does Mutilate not work?"
    a: "It needs a dagger in each hand."
  - q: "Does a poison replace my sharpening stone?"
    a: "No. In Forever, a poison and a stone work on the same weapon."
  - q: "Is Shank useful?"
    a: "Yes. It costs 5 Energy and gives 15 Energy back, or 25 at rank 2. Each tree also has a talent that makes it stronger."
  - q: "Can I Sap an enemy and stay in Stealth?"
    a: "Yes. This is new in Forever."
  - q: "Is Expose Armor useful?"
    a: "Only if your group has no Warrior who applies Sunder Armor. It is equal to 5 Sunder Armors, so it is good for groups without a Warrior."
  - q: "Is the last Subtlety talent Thousand Cuts or Death Mark?"
    a: "It is Death Mark. The launch client has no Thousand Cuts. The deep dive of Blizzard from October described Thousand Cuts, and older guides still name it."

