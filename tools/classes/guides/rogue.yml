class: Rogue
badges: [dps]
description: "Rogue progression for WoW: Forever: a narrated route from character creation to the raids, with add-ons for your race, your talents and your equipment."
aka: "Rog · Sin or Assa (Assassination) · Combat rogue · Sub (Subtlety)"

intro: |
  The Rogue is a melee damage class that wears leather. It uses Energy and Combo Points, and it starts most fights from Stealth. This page follows 1 Rogue from character creation to the raids, level by level. It tells you what changes in each level range: the abilities that you train, the way that you fight, the dungeons and the decisions.

  Warcraft Tavern reports a class tuning pass for 10 November 2026, so the numbers on this page can change.

glance:
  - ["Role", "Melee damage only. Crowd control with Sap, stuns and interrupts"]
  - ["Armor", "**Leather**{ .pill .pill--leather }"]
  - ["Weapons", "Daggers, one-hand swords, maces, fist weapons and one-hand axes (new). Thrown weapons, bows, crossbows and guns"]
  - ["Resource", "**Energy**{ .pill .pill--energy } and 5 Combo Points"]
  - ["Races", "9 combinations. All races but Tauren"]
  - ["Leveling", "Easy. Method names the Rogue one of the most approachable classes"]

strengths:
  - "High damage on 1 target"
  - "Stealth, Sap and stuns let you decide when and where a fight starts"
  - "Vanish, Sprint and Evasion stop a bad pull"
  - "Kick is the fastest interrupt in a group"
  - "Very strong in world PvP"

weaknesses:
  - "No healing. You need bandages, food and potions"
  - "No ranged pull other than a thrown weapon or a bow"
  - "Weak when 3 or more enemies attack you"
  - "Needs good weapons at each level"
  - "Wants the same weapons and rings as Warriors and Hunters"

changes:
  added: ["Shank", "Poised", "One-hand axes", "Mutilate", "Venom", "Flawless Execution", "Composure", "Flash of Steel", "Puncturing Wounds", "Blood Splatter", "Dirty Tricks", "Quick Getaway", "Boot Knife", "Death Mark"]
  removed: ["Dagger, Sword, Mace and Fist Weapon Specialization", "Sleight of Hand", "Deadliness", "Murder"]
  notes:
    - "**Energy** now regenerates smoothly. The 2 second Energy tick of Classic is gone."
    - "**Combo Points** stay on the first target when you change targets. You can go back and use them."
    - "**Shank** (level 24) costs 5 Energy and gives 15 Energy back. Rank 2 at level 44 gives 25. Each tree has a talent for it."
    - "**Poised** (level 18) makes your next Energy ability cost 10 less."
    - "**Hack and Slash** replaces the 4 weapon specializations. Swords and axes get extra attacks, daggers and fist weapons get crit, and maces ignore armor."
    - "**Poisons** have more charges, and they stay on the weapon together with a sharpening stone or a weightstone. Deadly Poison and Instant Poison get 2 times the benefit from Attack Power."
    - "**Sap** does not end Stealth. Feint decreases 2 times as much threat. Expose Armor is equal to 5 Sunder Armors."
    - "**Distract** decreases the Stealth detection of enemies for 10 seconds."
    - "The launch client has no Thousand Cuts, Quietus, Cutthroat or Improved Distract. Older guides from the beta still name them."
    - "The BlizzCon demo named a talent Restless Blades. It is not confirmed at launch."

# ------------------------------------------------------------------ chapters
chapters:
  - id: start
    title: "Make your Rogue"
    story: |
      A Rogue fights with 2 resources. Attacks such as Sinister Strike use Energy and add Combo Points to the target. A finishing move such as Eviscerate uses all the Combo Points. More Combo Points make the finishing move stronger.

      The second part of the class is control. Stealth lets you select the enemy and the moment. Sap, Gouge, Kick and the stuns stop enemies. Vanish, Sprint and Evasion end a fight that goes wrong. No other class decides the start of a fight as well as a Rogue.

      In Forever, each of the 3 talent trees is a damage spec. Combat gives constant damage with each weapon type. Assassination uses daggers, crit and poisons. Subtlety uses openers from Stealth and bleeds. The new ability Shank has a talent in each tree.

      You make 3 decisions before level 1: your race, your talent path and your equipment set. The add-ons below describe each option. You can change the talents and the equipment later. You cannot change the race.
    goals:
      - "Select a race. Read its Race add-on."
      - "Select a talent path. Combat is the safe selection for a first Rogue."
      - "Select an equipment set. Your talent path decides the weapon type."
      - "Read the [Professions](#professions) section. Skinning and Leatherworking are the usual selection."

  - id: l1
    title: "Sinister Strike, Stealth and Gouge"
    story: |
      You start with Sinister Strike, Eviscerate and Stealth. The fight is simple at first. Use Sinister Strike until the enemy has 3 or more Combo Points, then use Eviscerate.

      At level 4 you train Backstab and Pick Pocket. Backstab needs a dagger, and you must be behind the target. Use Pick Pocket on each humanoid from Stealth before you attack. The coins and the lockboxes pay for your training.

      Gouge at level 6 is your first control ability. It stops the enemy for a few seconds. Use that time to get behind the enemy, or to use a bandage. Evasion at level 8 is your first emergency ability. It lets you dodge most melee attacks for a short time.

      You have no healing ability. Learn First Aid in your first town and eat between pulls. Fight 1 enemy at a time.

      Replace the starting dagger as soon as a quest gives you a better weapon. The Equipment add-on gives the first weapon for your set.
    train:
      - [1, "Sinister Strike, Eviscerate, Stealth", "Your first attack, your first finishing move and the base of each opener"]
      - [4, "Backstab, Pick Pocket", "Backstab needs a dagger and a position behind the target. Pick Pocket gives coins"]
      - [6, "Gouge", "Stops the enemy for a few seconds. It ends when the enemy takes damage"]
      - [8, "Evasion", "A large dodge bonus for a short time. Use it when 2 enemies attack you"]
    tip: |
      Thieves, cultists and other humanoids carry coins. Open each fight against a humanoid with Stealth and Pick Pocket.
    hardcore: |
      Do not fight 2 enemies before you have Gouge and Evasion. In Stealth, do not go into caves that you do not know.
    goals:
      - "Do the class letter quest from your first trainer (Classic-era quest)."
      - "Learn First Aid. You have no other healing."
      - "Replace the starting dagger."
      - "Train Gouge at level 6 and Evasion at level 8."

  - id: l10
    title: "Sap, Slice and Dice and Dual Wield"
    story: |
      Level 10 changes the class more than any level before it. You train Slice and Dice, Sap and Sprint, and you get your first talent point. Method says that you also learn Dual Wield at level 10. From here, you get 1 talent point at each level.

      Slice and Dice is a finishing move that increases your attack speed. Use it early in each fight, with 1 or 2 Combo Points. Then use the next Combo Points for Eviscerate.

      Sap makes pulls of 2 enemies safe. Sap the second humanoid from Stealth, kill the first enemy, then fight the Sapped enemy. Sap does not end Stealth in Forever, so you can also Sap an enemy and go past it.

      The next abilities give you more ways to start and control a fight. Kick at 12 stops a cast, and Gouge also stops one. Garrote at 14 and Ambush at 18 are openers from Stealth. Feint at 16 decreases your threat in a group. Level 18 also gives you **Poised**, a new ability of Forever. Use it before your most expensive ability, because it makes that ability cost 10 less.

      Your first dungeons open at level 13. Quests give much more XP than dungeon enemies, so do each dungeon for its quests. In a group, your job is damage, Sap on the target that the tank marks, and Kick on casters. Sap first, then let the tank pull.

      The developers say that levels 1 to 20 take about 20 hours. At level 14, start the scavenger hunt for the Cozy Sleeping Bag. It gives an XP buff and rested XP. See [Leveling](../../characters/leveling.md) and [Camping](../../systems/camping.md).
    train:
      - [10, "Slice and Dice, Sap, Sprint", "More attack speed, your crowd control and your escape"]
      - [10, "Dual Wield", "A weapon in each hand. Method gives level 10"]
      - [12, "Kick", "Stops a cast. The fastest interrupt in a group"]
      - [14, "Garrote, Expose Armor", "A bleed opener. Expose Armor is equal to 5 Sunder Armors in Forever"]
      - [16, "Feint, Lockpicking", "Feint decreases your threat. Lockpicking opens lockboxes, chests and some doors"]
      - [18, "Ambush", "A large opener from Stealth. It needs a dagger"]
      - [18, "Poised", "New. Your next Energy ability costs 10 less"]
    dungeons:
      - {id: hall-of-thanes, levels: "13–20", note: "New. It is in Ironforge"}
      - {name: "Ragefire Chasm", levels: "13–18", note: "It is in Orgrimmar"}
      - {id: ruins-of-lordaeron, levels: "15–22", note: "New. It is in Tirisfal Glades"}
      - {name: "Wailing Caverns", levels: "15–24"}
      - {name: "The Deadmines", levels: "17–26", note: "Many humanoids for Sap and Pick Pocket"}
    extra: |
      ??? example "Macros for Sap, Kick and Ambush"

          ```
          #showtooltip Sap
          /cleartarget
          /targetenemy
          /cast Sap
          ```

          ```
          #showtooltip Kick
          /cast [@focus,exists,harm] Kick; Kick
          ```

          ```
          #showtooltip Ambush
          /cast Pick Pocket
          /cast Ambush
          ```

          The third macro uses Pick Pocket on the target and then opens the fight. Sap does not end Stealth. Thus you can Sap 1 enemy, then use Pick Pocket and Ambush on a different enemy. Forever uses a modern client, so conditions such as `@focus` probably work. Blizzard has not published a list of macro limits.
    warn: |
      In a dungeon, do not attack before the tank. Use Feint before your threat becomes a problem, not after.
    tip: |
      Lockpicking starts at level 16. Practice it on the lockboxes from Pick Pocket. Warcraft Tavern recommends 80 Lockpicking for the poison quest at level 20.
    goals:
      - "Train Slice and Dice, Sap and Sprint, and spend your first talent point at level 10."
      - "Put a weapon in your off hand."
      - "Do your first dungeon for its quests."
      - "Start the Cozy Sleeping Bag scavenger hunt at level 14."

  - id: l20
    title: "Poisons, Vanish and Shank"
    story: |
      Level 20 starts the **poison quest**. It teaches the Poisons skill and the recipe for Thistle Tea. The steps for each faction are below. Warcraft Tavern recommends that you wait until level 22 and have 80 Lockpicking. At 22 you have Vanish and Distract, and the quest is much easier with them.

      Poisons change your equipment more than your rotation. You put 1 poison on each weapon. In Forever, a poison stays on the weapon together with a sharpening stone or a weightstone. Instant Poison comes from the quest. Crippling Poison comes at 20 and Mind-numbing Poison at 24. Buy the reagents from a Shady Dealer.

      Rupture at level 20 is a bleed finishing move for enemies that live a long time. Vanish at level 22 is your best escape. It puts you back in Stealth in the middle of a fight. Carry Flash Powder for it (Classic-era reagent). Cheap Shot at level 26 is a stun opener. It gives you some seconds of free damage at the start of each fight.

      At level 24 you train **Shank**, the second new ability of Forever. Shank costs 5 Energy, hits with your off-hand weapon and gives 15 Energy back. Its cooldown is 10 seconds. It gives more Energy than it costs, so use it each time it is ready, in each spec.

      2 rewards start in these levels. Give your library books to the book collector of your faction. The Leveling page says that 10 books open a quest at level 20. Level 25 gives the *Rogue: Novice* Legacy Point. Only the first Rogue on your account gets it. See [Legacy](../../characters/legacy.md).
    train:
      - [20, "Rupture", "A bleed finishing move. Use it on enemies that live longer than 15 seconds"]
      - [20, "Poisons: Instant Poison, Crippling Poison", "Instant Poison comes from the poison quest. Crippling Poison slows the target"]
      - [22, "Vanish, Distract", "Vanish puts you back in Stealth. Distract turns enemies away from you"]
      - [24, "Shank", "New. 5 Energy, a 10 second cooldown, and 15 Energy back"]
      - [24, "Mind-numbing Poison", "Makes the casts of the target slower"]
      - [26, "Cheap Shot", "A stun opener from Stealth"]
    dungeons:
      - {name: "Shadowfang Keep", levels: "20–30"}
      - {name: "Blackfathom Deeps", levels: "24–32"}
      - {name: "The Stockade", levels: "25–29", note: "All enemies are humanoids. Sap works on each pull"}
      - {id: excavation-site, levels: "26–33", note: "New. It is short, with 3 bosses"}
      - {id: city-of-dalaran, levels: "28–35", note: "New. NPCs in the city attack Horde characters on sight"}
    extra: |
      **The poison quest**

      === "Alliance"

          1. Speak to **Master Mathias Shaw** at SI:7 in Old Town, Stormwind. He gives *Mathias and the Defias*.
          2. Go to Agent Kearnen in Westfall for *Klaven's Tower*. Go into the tower in Stealth and open the chest of Klaven Mortwake.
          3. Turn in the quest. You learn **Poisons** and the recipe for **Thistle Tea**.
          4. The chest gives you a debuff. The quest *The Touch of Zanzil* removes it. Anti-Venom also removes it.

      === "Horde"

          1. Speak to **Shenthul** in the Cleft of Shadow in Orgrimmar. He gives *The Shattered Salute* and then *Deep Cover*.
          2. Go to Taskmaster Fizzule in the Barrens for *Mission: Possible But Not Probable*.
          3. Go to Serge Hinott in Hillsbrad Foothills for *Hinott's Assistance*. You learn **Poisons** and the recipe for **Thistle Tea**.
          4. Warcraft Tavern says that the Horde quest is much more difficult than the Alliance quest.

      Your Poisons skill increases by 1 for each poison that you make. The maximum is 5 times your level. All Rogue trainers teach the new poison recipes.

      !!! conflict "Conflict: the library book quests"
          The [Leveling](../../characters/leveling.md) page says that 10, 20 and 25 books open quests at levels 20, 35 and 45. Warcraft Tavern gives levels 1, 20 and 30 for the same numbers of books. The collectors are Garion Wendell in the Mage Quarter of Stormwind and Owen Thadd in the Magic Quarter of the Undercity. No source reports a book for Rogues only.
    tip: |
      Thistle Tea gives Energy immediately. Make some after the poison quest and keep it for emergencies.
    hardcore: |
      Do the poison quest at level 22 or later, with Vanish ready. Do not open on an elite enemy when Vanish and Sprint are on cooldown.
    goals:
      - "Do the poison quest. Put a poison on each weapon."
      - "Train Vanish at level 22 and buy Flash Powder."
      - "Train Shank at level 24. Put it on a key that you can reach quickly."

  - id: l30
    title: "Kidney Shot, Blind and Deadly Poison"
    story: |
      These levels complete your control. Kidney Shot at level 30 is a stun that uses Combo Points. It also stops a cast when Kick is on cooldown. Blind at level 34 removes 1 enemy from the fight for some seconds. With Sap, Gouge, Kidney Shot and Blind, a pull of 3 enemies is possible but not easy.

      Deadly Poison comes at level 30 and Wound Poison at level 32. The usual setup is Instant Poison on the main hand and Deadly Poison on the off hand. Warcraft Tavern says that Deadly Poison has a 30% chance to apply at each rank. Put new poisons on your weapons before each dungeon.

      Your 21st talent point comes at level 30. It gives Blade Flurry, Venom or Hemorrhage on the 3 leveling paths. The Talents add-on tells you how the fight changes on your path.

      The new battleground Battle for the Darkspear Islands opens at level 30. A Rogue takes bases that have no defender and stops enemy flag carriers.

      Start to save gold now. At level 40 you need 100g for riding, and dual spec costs 50g. All ranks of your abilities from level 1 to 60 cost about 206g. Lockpicking and Pick Pocket help you pay for them. The Leveling page says that 20 library books open the second book quest at level 35.
    train:
      - [30, "Kidney Shot", "A stun that uses Combo Points"]
      - [30, "Deadly Poison", "Damage over time that stacks. The usual poison for the off hand"]
      - [32, "Wound Poison", "Decreases the healing that the target gets. For PvP"]
      - [34, "Blind", "Removes 1 enemy from the fight. It needs Blinding Powder (Classic-era reagent)"]
    dungeons:
      - {name: "Razorfen Kraul and Gnomeregan", levels: "29–38"}
      - {name: "Scarlet Monastery", levels: "30–46", note: "4 wings. Many enemies are humanoids"}
      - {id: drowned-city, levels: "35–42", note: "New. It is on the coast of Stranglethorn Vale"}
    warn: |
      Do not use Blade Flurry or other attacks that hit 2 targets near a Sapped or Polymorphed enemy.
    goals:
      - "Train Kidney Shot and Deadly Poison at level 30."
      - "Train Blind at level 34."
      - "Save 150g before level 40."

  - id: l40
    title: "Adrenaline Rush, Mutilate or Death Mark"
    story: |
      Level 40 gives few new abilities, but it changes how you play. You can buy riding for 100g, and the price includes your first mount. You can buy dual spec for 50g from your class trainer. You train Safe Fall, which decreases fall damage.

      Level 40 is also your 31st talent point. Each leveling build takes the last talent of its tree here: Adrenaline Rush, Mutilate or Death Mark. The Talents add-on describes the change for your path.

      With dual spec, keep your solo build in 1 spec. The usual second spec is Subtlety for PvP, or Combat for dungeons if you level with a different tree. You can change the spec outside of combat at no cost. To respec, go to a class trainer in a capital. The Leveling page says that respec fees decrease to 1g over time.

      Shank rank 2 comes at level 44. It gives 25 Energy back in place of 15. From this level, Shank is a large part of your Energy.

      The new zone Riverglades is for levels 35 to 45. Both factions quest there, so expect world PvP. Level 45 gives the *Rogue: Experienced* Legacy Point. The Leveling page says that 25 library books open the third book quest at level 45.
    train:
      - [40, "Safe Fall", "Decreases fall damage"]
      - [44, "Shank (rank 2)", "25 Energy back in place of 15"]
    dungeons:
      - {name: "Razorfen Downs", levels: "37–46"}
      - {id: kroldok-stronghold, levels: "40–47", note: "New. It is in Riverglades. It drops a fist weapon with Agility"}
      - {name: "Uldaman", levels: "41–51"}
      - {name: "Zul'Farrak", levels: "44–54"}
    warn: |
      Buy riding before dual spec if you do not have 150g. A mount saves more time than a second spec.
    goals:
      - "Buy riding (100g), then dual spec (50g)."
      - "Take the last talent of your tree at level 40."
      - "Train Shank rank 2 at level 44."

  - id: l50
    title: "Hit, Lockpicking and the last dungeons"
    story: |
      The last 10 levels have the most dungeons. Items from the new dungeons have stats for a specific class and spec. Reportedly, each boss in the new dungeons drops a blue item. Start to collect your level 60 equipment here.

      You have the last talent of your main tree. Most of the points from 50 to 60 go into a second or a third tree. The Combat and Subtlety builds take Ruthlessness and Lethality from Assassination. The Assassination build takes Puncturing Wounds and Precision from Combat.

      Hit becomes important, because dungeon bosses are 2 or 3 levels above you. A miss costs Energy and Combo Points. Keep items with hit from this level.

      Lockpicking is useful in Blackrock Depths and Dire Maul. You can open boxes and some doors for your group. Keep your skill near the maximum for your level.

      No source lists new abilities for these levels. You train higher ranks of the abilities that you have.
    dungeons:
      - {id: alcaz-prison, levels: "48–55", note: "New. It is in Dustwallow Marsh"}
      - {name: "Maraudon", levels: "46–55", note: "Its quest gives Thrash Blade"}
      - {name: "Sunken Temple", levels: "50–60"}
      - {name: "Blackrock Depths", levels: "52–60"}
      - {id: blackmaw-hold, levels: "55–60", note: "New. It is in Azshara. It has an entrance to the Barrow Deeps"}
      - {name: "Dire Maul", levels: "54–60", note: "East is 54 to 60. West and North are 56 to 60"}
      - {name: "Lower Blackrock Spire", levels: "55–60"}
      - {id: shapers-terrace, levels: "58–60", note: "New. It is in Un'Goro Crater"}
    tip: |
      Use Pick Pocket on elite humanoids before the pull. Sap does not end Stealth, so you can Sap 1 enemy and use Pick Pocket on the others.
    goals:
      - "Do Alcaz Prison, Blackmaw Hold and Shaper's Terrace for their quests."
      - "Keep items with hit for dungeons at level 55 and above."
      - "Increase Lockpicking for Blackrock Depths and Dire Maul."

  - id: l60
    title: "Hit, weapons and the Onyxia attunement"
    story: |
      At level 60 you get the *Rogue: Master* Legacy Point. The riding skill for a fast mount costs 1,000g. Mount Hyjal opens through Darkwhisper Gorge in Winterspring. Get reputation there, because it gives the patterns for the crafted Tier 1 items. Fan sources name the faction Guardians of Hyjal, and the name is not confirmed.

      All 3 launch raids open on 9 December 2026. Use the time before that date for 4 tasks. Decide your spec and get the weapons for it. Get hit on your items. Collect poisons and consumables. Do the attunement for Onyxia's Lair.

      No source has a tested hit value for Forever. Warcraft Tavern gives a 9% miss chance against a raid boss. A search result from Icy Veins gives 8% for special attacks, but the Codex was not able to read the page. Precision gives 3%, so a build with Precision needs 5% to 6% from items.

      The attunement gives the Drakefire Amulet. Start the chain at level 58 to 60. It is not account-wide, so each character must do it. The chain needs the blood of General Drakkisath in Upper Blackrock Spire.

      Respec to a level 60 build now. The Talents add-on gives the builds of your path. Tier lists from before the launch put Assassination and Combat in the highest damage tier. No player has tested the specs in the raids.

      The Equipment add-on gives the items to look for. The lists of level 60 items are not final, because many items still have hidden stats. Dungeons also drop a currency, Tarnished Undermine Real. Pix Xizzix in Stranglethorn Vale sells level 60 items for it. Honor buys blue PvP items.
    dungeons:
      - {id: blackmaw-hold, levels: "55–60"}
      - {id: shapers-terrace, levels: "58–60"}
      - {name: "Scholomance and Stratholme", levels: "58–60", note: "They drop parts of the Shadowcraft set"}
      - {name: "Dire Maul", levels: "54–60", note: "The Rogue book quest gives the trinket Royal Seal of Eldre'Thalas"}
      - {name: "Upper Blackrock Spire", levels: "59–60", note: "10 players. Necessary for the Onyxia attunement"}
    goals:
      - "Respec to a level 60 build."
      - "Do the attunement for Onyxia's Lair."
      - "Collect Tarnished Undermine Real in dungeons for the items of Pix Xizzix."
      - "Collect poisons, sharpening stones and consumables before 9 December."

  - id: raid
    title: "The 3 launch raids and battlegrounds"
    story: |
      **The Barrow Deeps** has 10 players. It is the old prison of Illidan. A small raid needs your Kick and your stuns on the enemies before the bosses. Many enemies are night elves and Druids of the Claw. See [The Barrow Deeps](../../content/raids/barrow-deeps.md).

      **Hyjal Summit** has 20 players and 13 bosses on routes that branch. Expect many groups of enemies between the bosses. Blade Flurry is very strong there. See [Hyjal Summit](../../content/raids/hyjal-summit.md).

      **Onyxia's Lair** has 40 players. Stay behind her, and move away from the tail and from Deep Breath. Fire resistance helps. See [Onyxia's Lair](../../content/raids/onyxias-lair.md).

      In each raid, your jobs are damage and threat control. Use Feint before you need it. Use Expose Armor only if no Warrior applies Sunder Armor, and agree on it with your raid. Put new poisons on your weapons after each wipe. World buffs do not work in raids. The Chronoboon Displacer removes them in instances.

      In PvP, each other class prepares for a fight against a Rogue. Subtlety is the usual spec. Sap a defender from Stealth and take the base, or prepare a full opener. Distract tells players that a Rogue is near. Human Perception lets players see you earlier. The Legacy talent High Alert does the same, but not in battlegrounds.
    extra: |
      See [PvP](../../content/pvp/index.md) and [Battlegrounds](../../content/pvp/battlegrounds.md) for the rules and the rewards.

      | Battleground | Your job |
      |---|---|
      | Warsong Gulch (10 against 10) | Kill the enemy flag carrier and defend your flag. Sap the escort and use Kidney Shot on the carrier |
      | Arathi Basin (15 against 15) | Take bases that have no defender. Sap a defender who is alone and click the flag |
      | [Darkspear Islands](../../content/pvp/battlegrounds.md#darkspear-islands) (15 against 15, levels 30 to 60) | The same job on 4 bases. Also stop the carrier of the central flag |
      | Alterac Valley (40 against 40) | Kill reinforcements and take towers from Stealth |

      | Enemy in PvP | What you do |
      |---|---|
      | Warrior | Kite with Crippling Poison. Keep Evasion and Gouge for the time when the Warrior has Rage |
      | Mage | Open with Cheap Shot, then Kidney Shot. Kick Polymorph or Frostbolt. Use a trinket or a racial against Frost Nova |
      | Priest | Use Mind-numbing Poison. Keep Vanish or Will of the Forsaken for Psychic Scream |
      | Warlock | Open on the Warlock, not on the pet. Kick the Fear |
      | Hunter | Get to the Hunter quickly. Use Vanish to get away from a Freezing Trap |
      | Paladin | Use Wound Poison against heals. Do burst damage when Divine Shield is on cooldown. Paladins can tank in Forever, so look at the spec first |
      | Druid | Kick heals and Entangling Roots. Use Crippling Poison when the Druid changes to Cat Form or Travel Form |
      | Shaman | Continue to attack through Grounding Totem. Kick heals |
      | Rogue | The Rogue who opens first usually wins. Use Distract to find the enemy |
    hardcore: |
      [Hardcore](../../about/hardcore.md) comes in winter 2026/27. The Rogue is one of the safest classes there, because Vanish, Sprint, Evasion, Gouge and Blind stop a bad pull. Do not fight 2 enemies if you cannot use Sap or Gouge on one of them. Use Stealth to go past enemies that you do not need to kill.

      Always carry bandages and Healing Potions. Carry Flash Powder and Blinding Powder also, unless you have the Legacy talent Reagent Economy. The Legacy talents Thrill of Adventure and Field Medicine give more healing. Stoneform of the Dwarf and Escape Artist of the Gnome are strong racials for Hardcore.

# ------------------------------------------------------------------ races
races:
  - id: human
    name: Human
    faction: alliance
    status: Classic
    pitch: "The safe Alliance selection. Will to Survive removes stuns, Ruthless gives 1% crit, and the poison quest starts in your capital."
    start: |
      You start in Northshire Valley in Elwynn Forest. Your first trainer is Jorik Kerridan, near the stables behind the abbey (Classic location). At level 6, go to Goldshire. Keryn Sylvius trains Rogues in the Lion's Pride Inn. The trainers of Stormwind are in Old Town, near SI:7.
    notes:
      l1: "The Defias thieves and the kobolds of Elwynn Forest are good Pick Pocket targets. Their coins pay for your training at level 10."
      l10: "At level 10, complete Elwynn Forest. Then go to Westfall. The Deeprun Tram takes you to Ironforge for the Hall of Thanes."
      l20: "The poison quest starts at SI:7 in Old Town, in your capital. The second step is in Westfall."
      raid: "Will to Survive is the best PvP racial for a Rogue. Use it against Cheap Shot or Kidney Shot. Use Perception to find a Rogue in Stealth."
  - id: dwarf
    name: Dwarf
    faction: alliance
    status: Classic
    pitch: "The hit selection. Artisan's Precision gives 1% hit, and Stoneform removes bleeds and poisons and decreases physical damage by 10%."
    start: |
      You start in Coldridge Valley in Dun Morogh. Your first trainer is Solm Hargrin in Anvilmar (Classic location). At level 6, go through the tunnel to Kharanos. Hogral Bakkan trains Rogues in the Thunderbrew Distillery. The trainers of Ironforge are in the Forlorn Cavern.
    notes:
      l1: "The troggs in Coldridge Valley come in pairs. From level 6, use Gouge on one of them. Big Game Hunter gives 5% more damage against the Beasts of Dun Morogh."
      l10: "The new dungeon Hall of Thanes is in Ironforge. It is the easiest first dungeon for a Dwarf. At level 12, go east to Loch Modan."
      l20: "The poison quest starts in Stormwind, not in Ironforge. Take the Deeprun Tram."
      l60: "Artisan's Precision gives 1% hit. You need 1% less hit from items than other races."
      raid: "Keep Stoneform for Rupture, Garrote and poisons of an enemy Rogue, or for the Rend of a Warrior. Do not use it against the opener."
  - id: gnome
    name: Gnome
    faction: alliance
    status: Classic
    pitch: "The burst selection, and the selection of Method. Eureka! gives 8 seconds of cheaper and stronger attacks, and Escape Artist removes roots and slows."
    start: |
      You start in Coldridge Valley in Dun Morogh, with the Dwarves. Your first trainer is Solm Hargrin in Anvilmar (Classic location). At level 6, go through the tunnel to Kharanos. Hogral Bakkan trains Rogues in the Thunderbrew Distillery. The trainers of Ironforge are in the Forlorn Cavern.
    notes:
      l1: "Expansive Mind gives 5% more maximum Energy. With full Energy, start each fight with 2 Sinister Strikes."
      l10: "The new dungeon Hall of Thanes is in Ironforge. If you want Engineering, learn it early in Kharanos or in Tinker Town."
      l20: "The poison quest starts with Master Mathias Shaw in Old Town, Stormwind. Take the Deeprun Tram."
      l60: "Use Eureka! together with Cold Blood, Adrenaline Rush or an opener from Stealth. It does not increase Rupture or Garrote."
      raid: "Escape Artist removes Frost Nova, Hamstring, Crippling Poison and Entangling Roots. Then go back to your target."
  - id: night-elf
    name: Night Elf
    faction: alliance
    status: Classic
    pitch: "The Alliance selection for short fights. Elune's Light gives 10% crit for 15 seconds, and Shadowmeld is a second way to hide."
    start: |
      You start in Shadowglen in Teldrassil. Blizzard changed this start zone for Forever. Your first trainer is Frahun Shadewhisper, in the large tree of Aldrassil (Classic location). At level 6, go to Dolanaar, where Jannok Breezesong trains Rogues. The capital trainers are in Darnassus.
    notes:
      l1: "Teldrassil has few humanoids, so Pick Pocket gives little at first. The Gnarlpine furbolgs are your best targets. Shadowmeld lets you eat safely near patrols."
      l10: "At level 10, go to Darnassus. Then take the boat from Rut'theran Village to Auberdine and quest in Darkshore."
      l20: "The poison quest starts in Stormwind, not in Darnassus. The new boat from Auberdine to Stormwind Harbor makes the trip short."
      l60: "Use Elune's Light together with Adrenaline Rush or Cold Blood. With Seal Fate, more crit gives more Combo Points."
      raid: "Blackmaw Hold and the raids of Mount Hyjal are near the night elf zones. Shadowmeld works when Stealth is on cooldown."
  - id: skyborne-high-order
    name: Skyborne (High Order)
    faction: alliance
    status: New
    pitch: "New in Forever, and a paid race. Wind Blessed gives permanent haste, and Walk on Air is a glide of 10 seconds."
    start: |
      You start at Thendal Village on [Zephras Isle](../../world/zephras-isle.md). The quest *Reading the Leylines* teaches Read Ley Line. The class trainers are in Valanaar, which you get to at about level 8. Reportedly, the island quests take you to level 12 to 14. To play a Skyborne, you must have the Skyborne Heroic Pack or a higher edition.
    notes:
      l1: "Many Al'Aketh cultists are humanoids, so use Pick Pocket on them. In the quest *Secret Agent Elf*, you go into the cult in disguise."
      l10: "Leave the island on the airship from the east Skydock to Dalaran. Walk south to Southshore. Then take the new boat to Auberdine or to Menethil Harbor."
      l20: "The poison quest starts with Master Mathias Shaw at SI:7 in Stormwind. It is not confirmed that Dalaran has a Rogue trainer. Train in Old Town."
      l40: "Galestriders are the Skyborne mounts. Fairweather Stables on Zephras Isle sells them. High Order reputation gives a discount of 5% to 20%."
      l60: "Wind Blessed gives more attacks, thus more poison hits and more Hack and Slash procs. Elemental Insight gives 5% more damage against Elementals."
  - id: orc
    name: Orc
    faction: horde
    status: Classic
    pitch: "The best Horde Rogue according to Method and Warcraft Tavern. Blood Fury gives 10% Attack Power for 15 seconds, and Hardiness makes stuns 20% shorter."
    start: |
      You start in the Valley of Trials in Durotar. Blizzard changed this start zone for Forever. Your first trainer is Rwag, in the Den (Classic location). At level 6, go to Razor Hill, where Kaplak trains Rogues in the barracks. The trainers of Orgrimmar are in the Cleft of Shadow.
    notes:
      l1: "Use Blood Fury on each pull from level 1. The humans at Tiragarde Keep are good Pick Pocket targets."
      l10: "At level 10, go to the Cleft of Shadow in Orgrimmar. Then go west to the Crossroads in the Barrens. Ragefire Chasm is in Orgrimmar."
      l20: "The poison quest starts with Shenthul in the Cleft of Shadow, in your capital."
      l60: "Use Blood Fury together with Blade Flurry, Adrenaline Rush or Cold Blood. The cooldown is 2 minutes."
      raid: "Hardiness makes Cheap Shot and Kidney Shot shorter, which helps against other Rogues. Shatter Curse removes curses and Warlock Banes."
  - id: troll
    name: Troll
    faction: horde
    status: Classic
    pitch: "The comfortable selection. Berserking gives 10% attack speed for 15 seconds, and Rapid Regeneration heals you between fights."
    start: |
      You start in the Valley of Trials in Durotar, with the Orcs. Your first trainer is Rwag, in the Den (Classic location). At level 6, go to Sen'jin Village for the Darkspear quests. Kaplak trains Rogues in the barracks of Razor Hill. The trainers of Orgrimmar are in the Cleft of Shadow.
    notes:
      l1: "Rapid Regeneration heals 50% of your health during 6 seconds, but an action stops it. Use it after a kill in place of food."
      l10: "At level 10, go to the Cleft of Shadow in Orgrimmar. Then go west to the Crossroads in the Barrens. Ragefire Chasm is in Orgrimmar."
      l20: "The poison quest starts with Shenthul in the Cleft of Shadow in Orgrimmar."
      l30: "The Battle for the Darkspear Islands opens at level 30. The Horde faction there is the Darkspear Raiders."
      l60: "Use Berserking together with Adrenaline Rush and Blade Flurry. More attacks give more poison hits and more Hack and Slash procs."
  - id: undead
    name: Undead
    faction: horde
    status: Classic
    pitch: "The Horde PvP selection. Will of the Forsaken removes Fear, charm and sleep, and Touch of the Grave and Cannibalize heal you."
    start: |
      You start in the crypt of Deathknell in Tirisfal Glades. Your first trainer is David Trias in the church (Classic location). At level 6, go to Brill. Marion Call trains Rogues in the Gallows' End Tavern. The trainers of the Undercity are in the Rogues' Quarter.
    notes:
      l1: "The Scarlet Crusade humans in Tirisfal Glades are good Pick Pocket targets. Use Cannibalize on them after the fight in place of food."
      l10: "The new dungeon Ruins of Lordaeron is in Tirisfal Glades. At level 12, go south to Silverpine Forest, or take the zeppelin to Orgrimmar."
      l20: "The poison quest starts with Shenthul in Orgrimmar, not in the Undercity. Take the zeppelin. The last step is in Hillsbrad Foothills, near your capital."
      raid: "Will of the Forsaken removes the Fear of Warlocks, Priests and Warriors. Some dungeon and raid bosses also use Fear."
  - id: skyborne-windshaper
    name: Skyborne (Windshaper)
    faction: horde
    status: New
    pitch: "New in Forever, and a paid race. Skysight gives 15% movement speed for 15 seconds, and Wind Blessed gives permanent haste."
    start: |
      You start at Thendal Village on [Zephras Isle](../../world/zephras-isle.md). The quest *The Gift of Skysight* teaches Skysight. The class trainers are in Valanaar, which you get to at about level 8. Reportedly, the island quests take you to level 12 to 14. To play a Skyborne, you must have the Skyborne Heroic Pack or a higher edition.
    notes:
      l1: "Use Pick Pocket on the Al'Aketh cultists and bandits. Skysight and the tornadoes of the island let you travel quickly."
      l10: "Leave the island on the airship from the west Skydock to Skywatcher Plateau in Mulgore. Get the flight path in Thunder Bluff. Then quest in the Barrens."
      l20: "The poison quest starts with Shenthul in Orgrimmar. Thunder Bluff had no Rogue trainer in Classic. Train in the Cleft of Shadow or in the Undercity."
      l40: "Galestriders are the Skyborne mounts. Fairweather Stables on Zephras Isle sells them. Windshaper reputation gives a discount of 5% to 20%."
      raid: "Use Skysight together with Sprint to catch a class that kites you, or to carry a flag."

factions:
  alliance:
    l10: "Quest in Westfall, Loch Modan or Darkshore. Go to Redridge Mountains at level 15. The Deadmines in Westfall has many humanoids for Sap."
    l20: "Quest in Redridge Mountains, Duskwood, the Wetlands, Ashenvale and Hillsbrad Foothills. The Wetlands has new quests. Emissary Jacques in Southshore starts the Kirin Tor quests at about level 26."
    l30: "Quest in Arathi Highlands, the Alterac Mountains, Stranglethorn Vale, Desolace and Thousand Needles. Dustwallow Marsh opens at 35. The centaur quests in Desolace now need level 35."
    l40: "The Alliance town in Riverglades is Farholde Keep. New passes go to Riverglades from the Badlands and the Swamp of Sorrows. Then quest in the Badlands, Swamp of Sorrows, Tanaris, Feralas and the Hinterlands. A ferry goes from Steamwheedle Port in Tanaris to Powderfuse Port."
    l50: "Quest in Searing Gorge, Burning Steppes, Azshara, Un'Goro Crater, Felwood, the Plaguelands, Winterspring and Silithus. Azshara has many new quests."
    l60: "The Onyxia attunement starts with Helendis Riverhorn in Burning Steppes. The Champion's Hall in Stormwind sells the Honor items. Your battleground faction for the Darkspear Islands is the Theramore Expeditionary Force."
  horde:
    l10: "Quest in the Barrens or Silverpine Forest. Go to Stonetalon Mountains at level 15. Ragefire Chasm in Orgrimmar is your first dungeon."
    l20: "Quest in Stonetalon Mountains, Ashenvale, Hillsbrad Foothills and Thousand Needles. NPCs in Dalaran attack Horde characters on sight."
    l30: "Quest in Arathi Highlands, Stranglethorn Vale, Desolace and Dustwallow Marsh. The centaur quests in Desolace now need level 35."
    l40: "The Horde town in Riverglades is Rog'mar. New passes go to Riverglades from the Badlands and the Swamp of Sorrows. Then quest in the Badlands, Swamp of Sorrows, Tanaris, Feralas and the Hinterlands. A ferry goes from Steamwheedle Port in Tanaris to Powderfuse Port."
    l50: "Quest in Searing Gorge, Burning Steppes, Azshara, Un'Goro Crater, Felwood, the Plaguelands, Winterspring and Silithus. Azshara has many new quests."
    l60: "The Onyxia attunement starts with Warlord Goretooth in the Badlands. The Hall of Legends in Orgrimmar sells the Honor items. Your battleground faction for the Darkspear Islands is the Darkspear Raiders."

# ------------------------------------------------------------------ talent paths
paths:
  - id: combat
    name: "Combat"
    pitch: "The safe path for a first Rogue. You use Sinister Strike with a slow sword, mace or axe, and no position behind the target is necessary. Method, Mobalytics and Warcraft Tavern name Combat the smoothest solo spec."
    leveling: combat-leveling
    endgame: [combat-raid]
    gear: slow
    play:
      l1: "You have no talent points before level 10. Use Sinister Strike to add Combo Points and Eviscerate to use them."
      l10: "Open with Sinister Strike. Use Slice and Dice at 1 or 2 Combo Points, then Sinister Strike to 5 and Eviscerate. Efficient Strikes makes Sinister Strike cheaper, and Coup de Grace makes Eviscerate stronger. Deflection adds parry, because enemies attack you while you level."
      l20: "Riposte at level 20 costs 10 Energy and disarms the enemy. Use it after each parry. From 23, Composure makes Poised a discount of 20 Energy. From 24, use Shank each time it is ready. Flawless Execution at 25 makes Eviscerate cost 15 less Energy."
      l30: "Blade Flurry at level 30 gives 20% attack speed, and your attacks also hit a second enemy. Use it on each pull of 2 enemies, or for burst on 1 enemy. Hack and Slash gives the bonus of your weapon type. Dual Wield Specialization makes the off-hand weapon and Shank stronger."
      l40: "Adrenaline Rush at level 40 doubles your Energy regeneration for 15 seconds. Use it with Blade Flurry on a dangerous pull. Flash of Steel then makes Shank your Energy source. At 5 ranks with Shank rank 2, Shank gives 40 Energy each 8 seconds. Malice adds crit from level 45, to 5% at level 49."
      l50: "The last points go into Assassination. Ruthlessness gives free Combo Points after finishing moves. Lethality makes Sinister Strike crits larger. Keep Slice and Dice active for the full fight. Cold Blood comes with the last point at level 60."
      l60: "The raid build moves the points from Deflection and Riposte, because a boss does not attack you. It takes 5 ranks of Flash of Steel and 16 points in Assassination. For dungeons, you can keep Deflection and Riposte."
      raid: "Combat is the default raid spec, and it works with swords, axes, maces and fist weapons. No source has tested which weapon type is best with Hack and Slash. Blade Flurry is very strong on the groups of enemies in Hyjal Summit."
    priority:
      - "Open from Stealth with **Cheap Shot** or **Garrote**. On a boss, open with **Sinister Strike**."
      - "Use **Slice and Dice** at 1 or 2 Combo Points. Keep it active."
      - "Use **Shank** each time it is ready. With Flash of Steel, it is a large source of Energy."
      - "Use **Sinister Strike** to add Combo Points. Use **Poised** before an ability with a high cost."
      - "Use **Eviscerate** at 5 Combo Points."
      - "Use **Blade Flurry** when 2 or more targets are near you. Use **Adrenaline Rush** for burst."
  - id: assassination
    name: "Assassination (daggers)"
    pitch: "The dagger path with crit and poisons. You use Backstab until level 40, then Mutilate. It needs 2 good daggers and a position behind the target, so it is more difficult solo."
    leveling: assassination-leveling
    endgame: [mutilate-raid]
    gear: daggers
    play:
      l1: "You have no talent points before level 10. Use Sinister Strike from the front. From level 6, use Gouge and then Backstab from behind."
      l10: "Malice gives 5% crit. Open with Backstab from Stealth, or with Ambush from level 18. Then use Gouge, go behind the enemy and use Backstab again. After a kill, Remorseless Attacks gives 40% more crit chance to your next Sinister Strike, Backstab or Ambush. Ruthlessness gives free Combo Points after finishing moves."
      l20: "Lethality at 20 makes Backstab crits larger, and Vigor gives 10 more Energy for the opener. Cold Blood at level 25 makes 1 attack a sure crit each 3 minutes. Use it on Ambush or on an Eviscerate with 5 Combo Points. Method says not to depend on poisons at these levels."
      l30: "Venom at level 30 changes Shank. Each Shank gives 30% more poison damage and 20% more chance to apply poisons for 6 seconds. Put Instant Poison on the main hand and Deadly Poison on the off hand. With 3 ranks of Seal Fate at level 37, each crit of Backstab gives 1 more Combo Point. Relentless Strikes gives Energy back from finishing moves."
      l40: "Mutilate at level 40 is your new main attack. It costs 60 Energy, hits with the 2 daggers and gives 2 Combo Points. It does 20% more damage to a Poisoned target. The client data gives no position rule for Mutilate. Use Poised before Mutilate. Opportunity then adds 20% damage to Mutilate, Ambush and Garrote."
      l50: "Puncturing Wounds gives 15% more crit to Mutilate, thus more Seal Fate procs. Precision gives 3% hit for dungeons at level 55 and above. Vile Poisons increases poison damage in the last levels."
      l60: "The raid build moves the points from Remorseless Attacks and Blood Splatter into Improved Poisons. It keeps Seal Fate, Venom, Opportunity, Puncturing Wounds and Precision. You need a dagger in each hand for Mutilate."
      raid: "A Mutilate crit gives 3 Combo Points with Seal Fate. Use Shank each time it is ready, because it starts Venom. The build has no cooldown for 2 targets, so Combat is better in dungeons."
    priority:
      - "Open with **Garrote** if the target lives a long time. If not, open with **Ambush**."
      - "Use **Slice and Dice** and keep it active."
      - "Use **Shank** each time it is ready. It starts **Venom**."
      - "Use **Mutilate** to add Combo Points. A Sinister Strike can add the last point for less Energy."
      - "Use **Eviscerate** at 4 or 5 Combo Points. Use **Cold Blood** on an Eviscerate with 5 Combo Points."
      - "On a boss, use **Expose Armor** first if no Warrior applies Sunder Armor."
  - id: subtlety
    name: "Subtlety (openers and PvP)"
    pitch: "The path for Stealth, openers and PvP. Method recommends it for group play. It is weaker solo before Hemorrhage at level 30, because Backstab needs a position behind the target. Use daggers."
    leveling: subtlety-leveling
    endgame: [subtlety-pvp, subtlety-raid]
    gear: daggers
    play:
      l1: "You have no talent points before level 10. Use Sinister Strike from the front. From level 6, use Gouge and then Backstab from behind."
      l10: "Opportunity adds 20% damage to Backstab, Garrote and Ambush. Open each fight from Stealth, with Garrote from 14 and with Ambush from 18. Camouflage makes you faster in Stealth. In a group, stay behind the target and use Backstab."
      l20: "Ghostly Strike at level 25 changes the fight. After it, your next Ambush or Garrote in 7 seconds needs no Stealth. Thus you can use Ambush again each 20 seconds. From 26, Initiative gives 1 more Combo Point for each opener. Premeditation at 27 gives 2 Combo Points before the fight, for an early Slice and Dice."
      l30: "Hemorrhage at level 30 becomes your main attack. It needs no position behind the target, so solo play is now easy. It also increases your Rupture and Garrote damage by 15%. Preparation at 31 gives you a second Vanish, Sprint and Evasion. Boot Knife starts at 35. With 5 ranks at level 39, each Shank adds 2 Combo Points."
      l40: "Death Mark at level 40 is a finishing move with a range of 20 yards. It stores a part of your damage for 6 seconds and then does that damage to the target. Use it at 5 Combo Points, then do as much damage as you can. Malice adds crit from level 41, to 5% at level 45."
      l50: "The last points go into Assassination and Combat. Lethality makes Hemorrhage crits larger. Cold Blood at 56 gives a sure crit for Ambush. Efficient Strikes makes Hemorrhage cheaper, and Coup de Grace makes Death Mark stronger."
      l60: "For PvP, respec to the PvP build. It takes Master of Deception, Improved Gouge and Heightened Senses, and it has no Combat points. The bleed build for raids keeps Dirty Deeds and Blood Splatter. No source has tested Subtlety in a raid."
      raid: "In PvP, the opener decides the fight. Preparation gives a second Vanish, Blind and Cold Blood. In raids, Icy Veins says that Subtlety can possibly become the strongest spec. It is not confirmed that each boss can bleed."
    priority:
      - "Use **Premeditation**, then open with **Ambush**. With Dirty Deeds, you can open with **Garrote** from the front."
      - "Use **Slice and Dice**. In a long fight, also keep **Rupture** active."
      - "Use **Hemorrhage** to add Combo Points. It increases your Rupture and Garrote damage."
      - "Use **Ghostly Strike** each time it is ready, then **Ambush** or **Garrote**."
      - "Use **Shank** each time it is ready. With Boot Knife, it adds 2 Combo Points."
      - "Use **Death Mark** for burst while Slice and Dice is active."
      - "For more burst in PvP: Gouge, then Vanish, then Ambush. Then use **Preparation**."

# ------------------------------------------------------------------ equipment sets
gear:
  - id: slow
    name: "Slow main hand"
    pitch: "The standard set for Combat. You use a slow sword, mace, axe or fist weapon in the main hand, with quest rewards and dungeon drops. The item names come from Timesaver.gg, Method.gg and Kami-Labs."
    stats: "Leveling: Crit > Agility > Attack Power > Strength > Stamina (Warcraft Tavern). Level 60: hit, then Agility and crit"
    chapters:
      l1:
        text: "Replace the starting dagger with the first sword or mace from a quest. Sinister Strike uses weapon damage, so a slow weapon with high damage is best. Zephras Isle gives the Skyborne an almost full leather set before level 12."
        items:
          - {slot: "Main hand", name: "Militia Sword", from: quest, where: "*Rare Books*, Elwynn Forest (Alliance)", basis: forever}
          - {slot: "Main hand", name: "Primitive Club", from: quest, where: "*Vile Familiars*, Durotar (Horde)", basis: forever}
          - {slot: "Ranged", name: "Militia Bow", from: quest, where: "*Rare Books*, Elwynn Forest (Alliance)", basis: forever}
          - {slot: "Chest", name: "Martyr's Armor", from: quest, where: "*Avenged Tenfold*, Zephras Isle", basis: forever}
          - {slot: "Waist and feet", name: "Belt of Blades, Empyrean Treads", from: quest, where: "*Confront Lorthuna*, Zephras Isle", basis: forever}
