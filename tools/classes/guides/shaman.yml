    name: "Two-hand weapon (Enhancement)"
    pitch: "A slow two-hand mace or axe with Strength and attack power armor. It is the only melee damage set, because the launch client has no dual wield. The item names come from Timesaver.gg and Method.gg."
    stats: "Leveling: weapon damage > Strength > Intellect > Agility and crit > Stamina. Level 60: weapon damage > hit > Strength and attack power > Intellect > crit > Agility"
    chapters:
      l1:
        text: "Use the best two-hand weapon that a quest gives you. A staff is acceptable. Dwarves and Tauren get a better mace from a zone quest at about level 10."
