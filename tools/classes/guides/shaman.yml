equipment:
  intro: |
    A Shaman wears leather to level 39 and can wear mail from level 40. Mixed armor types have no penalty, so take each item for its stats. Each spec uses a different weapon type, and dual spec at level 40 means that you carry 2 sets.

    About 40% of the items of Forever had hidden stats at launch. No person has published a tested level 60 list for a Shaman. The item names on this page come from Timesaver.gg (an algorithm, data of 6 November 2026), Method.gg, wowtbc.gg and Kami-Labs. The Codex did not verify the stats.
  proficiencies:
    - ["Cloth and leather armor", "Level 1", "No penalty for mixed armor types"]
    - ["Mail armor", "Level 40", "Train it at the class trainer (Warcraft Tavern)"]
    - ["Shields", "Level 1", "You get 1 block value for each 20 Strength. Shield Specialization is not in the game"]
    - ["One-hand maces, staves", "Level 1", "Default weapon skills"]
    - ["Two-hand maces, two-hand axes", "No talent necessary", "Blizzard says that they are baseline. Warcraft Tavern still lists weapon trainers for them: Ironforge, Orgrimmar (axes) and Thunder Bluff (two-hand maces)"]
    - ["One-hand axes, fist weapons", "Weapon master", "Ironforge for the Alliance, and Darnassus for fist weapons only. Orgrimmar for the Horde (Warcraft Tavern)"]
    - ["Daggers", "Weapon master", "Ironforge, Darnassus and Stormwind for the Alliance. Orgrimmar and the Undercity for the Horde (Warcraft Tavern)"]
    - ["Relic slot", "Level 1", "Totem relics go there. Enchanting makes 4 of them"]
    - ["Dual wield", "Not available", "None of the 51 talents in the launch client gives dual wield"]
  rules:
    - "Hit is 1 stat for melee, ranged attacks and spells (Method.gg). Crit is also 1 stat."
    - "Tidal Focus gives 5% hit, and the tooltip does not limit it to spells or to melee. All damage builds take it."
    - "A raid boss needs 16% spell hit (Warcraft Tavern stats guide) or 17% (Warcraft Tavern Shaman guide). Elemental thus needs about 11% to 12% from items."
    - "Warcraft Tavern gives 8% hit and 6.5% Expertise as the Enhancement targets. Only 1 source gives the Expertise value. Expertise replaces weapon skill."
    - "Strength gives a Shaman 2 attack power for each point. Mental Dexterity gives attack power equal to 150% of your Intellect at 3/3."
    - "In launch week, Intellect and spell power gave Enhancement more than Strength. Blizzard planned tuning for 10 November to make Strength the best stat. Keep your Strength items."
    - "Weapon imbues last 60 minutes, and they stack with sharpening stones, weightstones and oils."
    - "No source found haste on items in the beta. The stat lists of Warcraft Tavern still name haste, so read that entry as theory."
    - "Healing items also give spell damage (Method.gg)."
    - "World buffs do not work in dungeons and raids. Consumables are thus more important than in Classic."
    - "For an emergency tank role, Method.gg says that you need a one-hand weapon and a shield. Spirit Weapons gives +30% threat while Rockbiter Weapon is active."
    - "Resistance totems cover the full raid. A resistance of 315 gives the maximum of 75% (Warcraft Tavern)."
  enchants:
    - ["Two-hand weapon (leveling)", "Lesser Impact, Impact, Greater Impact", "Trainer recipes. The client data marks them as changed, and no source gives the new values"]
    - ["Two-hand weapon (level 60)", "Strength, Agility, Superior Impact or Crusader", "Enchanting skill 290 to 300. No source says which is best in Forever. Crusader first is a Classic-era habit"]
    - ["One-hand weapon (Elemental)", "Spell Power", "Enchanting skill 300. For a staff: Mighty Spell Power or Spellblasting"]
    - ["One-hand weapon (Restoration)", "Healing Power", "Enchanting skill 300. For a staff: Mighty Healing Power"]
    - ["Shield", "Critical Strike, Excellent Stamina or Superior Spirit", "The first 2 are new. No source gives the values"]
    - ["Necklace", "Strength, Agility, Spell Power or Healing Power", "New slot. Enchanting skill 210"]
    - ["Armor", "Forceful or Mystic armor kits", "New Leatherworking kits. Forceful is probably for physical specs and Mystic for casters. No source gives the effects"]
  consumables:
    - ["Leveling", "Cooked food", "Well Fed gives +5% XP for 15 minutes"]
    - ["Leveling", "Healing potions from First Aid, mana potions from Alchemy", "First Aid makes healing potions in Forever"]
    - ["Leveling", "Rough Weightstone or Minor Wizard Oil", "They stack with your imbue. Weightstones are for maces and sharpening stones are for axes"]
    - ["Level 60, Enhancement", "Weightstone or sharpening stone, Elixir of Greater Strength, Elixir of the Mongoose, Strength food, mana potions, Juju items", "The selection is Classic-era guidance. No Forever source has a tested list"]
    - ["Level 60, Elemental", "Brilliant Wizard Oil, Greater Arcane Elixir, Elixir of Nature Power, spell damage food, mana potions", "Elixir of Nature Power is new. Lightning is Nature damage"]
    - ["Level 60, Restoration", "Brilliant Mana Oil, Mageblood Elixir, Flask of Distilled Wisdom, mana potions, Dark Runes", "Classic-era guidance. The new Cleric's Elixir and Mender's Potion have no known effects"]
    - ["Onyxia's Lair", "Greater Fire Protection Potion", "Alchemy skill 290. Fire Resistance Totem covers the raid"]
    - ["All levels", "Ankh, Shiny Fish Scales, Fish Oil", "Reagents for Reincarnation, Water Breathing and Water Walking. Reagent Economy removes the need"]
  sources:
