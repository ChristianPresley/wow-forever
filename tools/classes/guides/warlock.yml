equipment:
  intro: |
    A Warlock wears cloth for all 60 levels. To about level 30 the wand is your most important slot, because you use it while your DoTs do damage. After that, spell power for your school is the most important stat.

    About 40% of the items of Forever had hidden stats at launch. The stats of an item become visible when a player first finds it. Thus, no source has a tested list for level 60. The item names on this page come from Method.gg, Warcraft Tavern, Timesaver.gg, Kami-Labs, wowtbc.gg and the Warcraft Wiki. The Codex did not verify the stats.
  proficiencies:
    - ["Cloth armor", "Level 1", "The only armor type of the Warlock. No shields"]
    - ["Daggers, wands", "Level 1", "Default weapon skills. No trainer is necessary"]
    - ["Staves", "Weapon master, 10 silver", "Woo Ping in Stormwind. Hanashi or Sayoc in Orgrimmar. Ansekhwa in Thunder Bluff. Ironforge has no staff trainer"]
    - ["One-hand swords", "Weapon master, 10 silver", "Woo Ping in Stormwind. Archibald in the Undercity"]
    - ["Off-hand items", "Level 1", "Use them with a dagger or a sword. They can have an enchant in Forever"]
    - ["Firestone, Spellstone", "Level 28, level 36", "Weapon imbues in Forever. They do not use the off-hand slot"]
  rules:
    - "Hit is 1 stat for melee, ranged attacks and spells. Your demon uses your hit."
    - "A raid boss needs 17% spell hit (Warcraft Tavern spec guides). The Warcraft Tavern stats guide says 16%. Suppression gives 5%."
    - "DoTs can crit, so crit is also a stat for Affliction."
    - "Life Tap increases with Spirit. Warcraft Tavern says that the maximum rank changes 424 health plus your Spirit into mana. Thus, Spirit is more important than in Classic."
    - "Demons get stats from your stats. Pre-launch notes give 2 demon health for each point of your Stamina."
    - "Spell Pierce is a new stat on items. It decreases the resistance of the target. It is weak for DoTs."
    - "Haste makes only casts and the global cooldown faster. Thus, it is weak for Wrack. Warcraft Tavern saw no haste on items in the beta."
    - "A beta report says that wand damage increases with spell power. No source gives the formula."
    - "One report says that Firestone and Spellstone stack with Wizard Oil. Warcraft Tavern names the stones a weapon oil. Test this in the game."
    - "Sources disagree on staff against one-hand weapon with off-hand item. Method.gg prefers the staff, and Timesaver.gg uses a dagger from level 30."
    - "Warcraft Tavern says that only the crafter can wear the rare Tailoring lines and the Enchanting staves and off-hand items."
    - "Necklaces and off-hand items can have enchants. These slots are new."
    - "No guide publishes an enchant list for Warlocks. The enchants in the table come from the Kami-Labs tool or from the recipe names."
    - "Each profession gives a camp feature in place of a passive stat. The Faction Banner of Tailoring gives Spirit."
  enchants:
    - ["Staff", "Enchant 2H Weapon - Spellblasting or Mighty Spell Power", "New. Enchanting skill 300. No source gives the values for Warlocks"]
    - ["One-hand weapon", "Enchant Weapon - Spell Power", "Enchanting skill 300. Kami-Labs uses it"]
    - ["Off-hand item", "Enchant Off-Hand - Superior Intellect", "New slot. Enchanting skill 300"]
    - ["Necklace", "Enchant Necklace - Spell Power", "New slot. Enchanting skill 210. Kami-Labs uses it"]
    - ["Bracers", "Enchant Bracer - Greater Spellpower", "New. Enchanting skill 300"]
    - ["Gloves", "Enchant Gloves - Shadow Power or Fire Power", "Enchanting skill 300. Select the school of your build"]
    - ["Chest", "Enchant Chest - Major Intellect", "Enchanting skill 290. Kami-Labs uses it"]
    - ["Boots", "Enchant Boots - Greater Stamina", "Enchanting skill 260. Kami-Labs uses it"]
    - ["Cloak", "Enchant Cloak - Greater Fire Resistance", "For Onyxia's Lair. No source gives a resistance number"]
  consumables:
    - ["Leveling", "Minor Arcane Elixir, Elixir of Minor Spirit", "Alchemy skill 1 and 15. Method.gg and Warcraft Tavern recommend elixirs while you level"]
    - ["Leveling", "Lesser Arcane Elixir, Lesser Mageblood Elixir", "From about level 25. Alchemy skill 120 and 75"]
    - ["Leveling", "Minor Spellblasting Potion", "New. Method.gg says that it increases damage for 30 seconds"]
    - ["All levels", "Healthstone", "Its cooldown is separate from potions. Healing potions now come from First Aid"]
    - ["All levels", "Firestone or Spellstone", "Your weapon imbue. Firestone for Fire builds, Spellstone for Shadow builds"]
    - ["Level 60", "Greater Arcane Elixir, Elixir of Shadow Power", "Warcraft Tavern names them as Alchemy products for Affliction and Demonology"]
    - ["Level 60", "Flask of Supreme Power", "Alchemy skill 300. The recipe is the same as in Classic"]
    - ["Level 60", "Brilliant Wizard Oil", "Enchanting skill 300. The client data does not give its effect"]
    - ["Level 60", "Major Mana Potion, Limited Invulnerability Potion", "Warcraft Tavern recommends the second potion for emergencies in dungeons"]
    - ["Level 60", "Nightfin Soup, Baked Salmon", "Food from the Spell Damage Food group. A Well Fed buff also gives +5% XP from kills"]
    - ["Onyxia's Lair", "Greater Fire Protection Potion", "Alchemy skill 290"]
