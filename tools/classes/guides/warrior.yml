          - {slot: "Main hand", name: "Militia Shortblade", from: quest, where: "*Rare Books*, Elwynn Forest (Alliance)", basis: forever}
          - {slot: "Main hand", name: "Stone Tomahawk", from: quest, where: "*Rite of Strength*, Mulgore (Horde)", basis: forever}
