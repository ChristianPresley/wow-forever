# ------------------------------------------------------------------ other sections
professions: |
  A Warrior depends on equipment more than other classes. Thus a profession pair that makes weapons and plate is a good selection. Professions give no passive stats in Forever. Each profession gives a [camp feature](../../systems/camping.md).

  | Rank | Professions | Use them for |
  |---|---|---|
  | **S**{ .tier .tier-s } | [Mining](../../professions/mining.md) + [Blacksmithing](../../professions/blacksmithing.md) | Weapon stones, mail, plate and many new recipes. The camp features Lodestone and Sharpening Wheel give attack power and Strength |
  | **A**{ .tier .tier-a } | [Mining](../../professions/mining.md) + [Engineering](../../professions/engineering.md) | Bombs and gadgets for PvP. Warcraft Tavern gives Engineering a high rating. Gnomes have 20% fewer device failures. The camp features are Lodestone and Reagent Bot |
  | **B**{ .tier .tier-b } | [Skinning](../../professions/skinning.md) + [Mining](../../professions/mining.md) | Gold for your mount at level 40. The camp feature Camp Chair gives 2% crit. Replace 1 of them with a crafting profession later |

  [First Aid](../../professions/first-aid.md) is necessary, because it now makes healing potions and bandages. [Cooking](../../professions/cooking.md) and [Fishing](../../professions/fishing.md) give materials for camping. Compare all classes in [Best professions by class](../../characters/professions.md#best-professions-by-class).

legacy: |
  You can spend a maximum of 16 [Legacy](../../characters/legacy.md) points on 1 character. Crafting professions give Legacy Points at skill 150, 225 and 300.

  | Tree | Picks for a Warrior |
  |---|---|
  | Adventure | **Well Rested** 5/5, then **Talented** 5/5. Warriors level slowly, so rested XP and earlier talents help most. Talented gives your first talent point 1 level earlier for each rank, down to level 5. The 2 talents cost 10 points, so they are an extra for a second character |
  | Adventure | **Thrill of Adventure** restores health after a kill in the open world. **Field Medicine** lets you use bandages more frequently |
  | Resourcefulness | **Reinforce** decreases the durability loss on death, which helps tanks and Hardcore players. **Gourmand** makes food buffs last longer. **For Great Honor** is for PvP |

mistakes:
  - "You keep a quest weapon for too long. Look at the Auction House at each level."
  - "You use Heroic Strike when you do not have extra rage."
  - "You do not learn First Aid. It now makes the healing potions."
  - "You forget the stance quests at level 10 and level 30."
  - "You tank without a shield. Defiance, Bastion and Master of Defense need a shield."
  - "You use 2 weapons at a low level. Each miss gives no rage."
  - "You forget that the game no longer adds new abilities to your action bars."

faq:
  - q: "Why do I have no rage?"
    a: "At low levels, the cause is usually your weapon. A slow weapon with high damage gives more rage for each swing. Use Bloodrage, and take Shield Specialization or Improved Overpower. Do not use rage on enemies that are almost dead."
  - q: "Is Protection good for leveling?"
    a: "In Forever, yes. Shield Specialization gives rage, Revenge does damage, Thunder Clap works in Defensive Stance, and Vanguard permits Charge in Defensive Stance. Method recommends it for solo play. It is slow before level 25."
  - q: "Must I still change stances?"
    a: "Less than in Classic. Tactical Mastery is baseline and keeps 10 rage. Arms changes to Battle Stance for Overpower. Protection with Vanguard almost never changes stance."
  - q: "Bloodthrill or Weaponmaster?"
    a: "You can take the 2 talents. Warcraft Tavern takes Bloodthrill for more Overpower uses, and Method takes the 2 talents. A full Arms build has the points for 2/2 Bloodthrill and 5/5 Weaponmaster. When you level, take Bloodthrill first."
  - q: "What does Reckless Swings do?"
    a: "In the launch client, your next 4 melee attacks give 5 more rage, with a 15 second cooldown. The heal that some sources describe is a different talent, Gore Drinker. The client does not show a clear cost."
  - q: "Do the Arms guides agree on the leveling build?"
    a: "No. Warcraft Tavern stays in the Arms tree. Method puts points into Fury for Unbridled Wrath and Enrage after Mortal Strike. The Arms path on this page follows Method."
  - q: "Do the Protection guides agree on the leveling build?"
    a: "Almost. Warcraft Tavern takes Anticipation and Defiance earlier than Method. The 2 builds agree on the order Shield Specialization, Master of Defense, Vanguard. The Protection path on this page follows Method."
  - q: "Is Skyborne a good Warrior race?"
    a: "It is good for leveling, because of haste, a glide and a speed or regeneration cooldown. Warcraft Tavern rates it weak for Warriors in comparison with Orc, Human, Troll and Tauren. Select it for its appearance and its story."

