  - id: twohand
    name: "Two-hander"
    pitch: "The Arms set, and the Fury set before you have 2 good weapons. You look for the slowest two-hand weapon with the highest damage. Weaponmaster decides the weapon type."
    stats: "Leveling: weapon damage > Strength > Stamina > Agility > armor. Level 60: hit (8%), crit and Strength. No source ranks them"
    chapters:
      l1:
        text: "Take the two-hand weapon from your first quests. A slow weapon gives more rage for each swing. The quests on Zephras Isle give the best known mail for levels 5 to 10."
        items:
          - {slot: "Two-hand", name: "Northshire Hammer", from: quest, where: "*Rare Books*, Elwynn Forest (Alliance)", basis: forever}
          - {slot: "Two-hand", name: "Brave's Axe", from: quest, where: "*Rite of Strength*, Mulgore (Horde)", basis: forever}
          - {slot: "Legs", name: "Highlands Mail Legguards", from: quest, where: "*The Criminal Element*, Zephras Isle", basis: forever}
