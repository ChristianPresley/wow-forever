equipment:
  intro: |
    A Warrior wears mail to level 39 and plate from level 40. The weapon is the most important slot at each level. Method estimates that 95% to 100% of your leveling damage comes from the weapon.

    About 40% of the items of Forever had hidden stats at launch. The stats of an item become visible when a player first finds it. Thus no source has a tested list for level 60. Most item names on this page come from Timesaver.gg (data of 6 November 2026). Timesaver.gg calculates its lists from stat weights and shows no stats. The Codex did not verify the stats.
  proficiencies:
    - ["Cloth, leather, mail", "Level 1", "Lower armor types have no penalty for a damage dealer. A tank loses mitigation"]
    - ["Plate", "Level 40", "From your class trainer"]
    - ["Shields", "Level 1", "Shield Specialization, Master of Defense, Defiance, Bastion and Shield Slam need a shield"]
    - ["Axes, maces, swords, daggers, fist weapons, staves", "Weapon master", "All weapon types but wands. The first weapon skills are different for each race"]
    - ["Polearms", "Level 20, weapon master", "Woo Ping in Stormwind. Archibald in the Undercity"]
    - ["Dual Wield", "Level 20, class trainer", "Warcraft Tavern gives this level. No second source confirms it"]
    - ["Bows, crossbows, guns, thrown weapons", "Weapon master", "You know thrown weapons at level 1. The ranged slot is only for stats"]
  rules:
    - "Rage from your hits depends on weapon speed. A slow weapon gives more rage for each swing."
    - "A crit gives 75% more rage, so crit has more value than in Classic."
    - "Armor does not decrease the rage from hits on you. A tank does not lose rage with better armor."
    - "Method.gg says that hit is 1 stat for melee, ranged attacks and spells. A miss gives no damage and no rage."
    - "Against a raid boss you need 8% hit with 1 weapon and 29% with 2 weapons (Method.gg). Warcraft Tavern gives 9% for 1 weapon."
    - "Furious Precision gives 10% hit only to off-hand attacks. The launch client has no general hit talent for Warriors."
    - "Weapon skills are still in the game. A weapon with low skill misses much more frequently."
    - "The old weapon racials of Humans, Orcs and Trolls are gone. Weaponmaster decides your weapon type."
    - "Weaponmaster: axes and polearms get crit, maces and staves ignore armor, swords get extra attacks."
    - "440 Defense makes you immune to crits from raid bosses (Warcraft Tavern)."
    - "Strength gives 2 attack power for each point, and 1 Block Value for each 20 points. Shield Slam scales with Block Value."
    - "Warcraft Tavern found no haste on items in the beta."
    - "Dungeon items have stats with a theme of class, spec, biome or enemy type. When you loot an item, you unlock its transmog."
    - "Sharpening stones and weightstones now work together with Shaman imbues and Rogue poisons."
    - "Many Blacksmithing recipes are Bind on Pickup. No source says if the crafted items are also Bind on Pickup."
  enchants:
    - ["Weapon", "Crusader", "Classic-era advice for damage dealers. The recipe is the same as in Classic"]
    - ["Two-hand weapon", "Enchant 2H Weapon - Strength", "New. Enchanting skill 290. The effect is not known"]
    - ["Weapon", "Sharpening stones and weightstones", "From Blacksmithing. A cheap damage increase at each level"]
    - ["Shield", "Iron, Mithril or Thorium Shield Spike", "From Blacksmithing. Damage on each block in Classic. The recipes are changed in Forever"]
    - ["Shield", "Enchant Shield - Excellent Stamina", "New. Enchanting skill 300. The effect is not known"]
    - ["Necklace", "Enchant Necklace - Strength or Deflection", "New slot. Enchanting skill 210. The effects are not known"]
    - ["Armor", "Stamina, Agility and Defense enchants", "Classic-era advice for tanks"]
    - ["Cloak", "Fire resistance", "For Onyxia's Lair. The sources recommend fire resistance but give no number"]
  consumables:
    - ["All levels", "Healing potions and bandages", "First Aid now makes the healing potions, from Minor to Major Healing Potion"]
    - ["All levels", "Sharpening stones", "Rough at skill 1, Coarse at 75, Heavy at 125, then Solid and Dense"]
    - ["Leveling", "Rage Potion, Great Rage Potion", "Rage for the start of a hard pull. Alchemy skill 60 and 175"]
    - ["Leveling", "Food with Strength", "Roasted Boar Meat and Smoked Bear Meat at low levels. Savory Stag Sliders is new at Cooking 225"]
    - ["Level 60", "Elixir of the Mongoose, Elixir of Brute Force", "Classic-era elixirs. The recipes are the same as in Classic"]
    - ["Level 60", "Flask of the Titans, Greater Stoneshield Potion", "Classic-era consumables for tanks"]
    - ["Level 60", "Mighty Rage Potion, Major Frenzy Potion", "The Frenzy potions are new. Their effect is not known"]
    - ["Level 60", "Elemental Sharpening Stone, Dense Sharpening Stone", "Blacksmithing skill 300 for the Elemental stone"]
    - ["Level 60", "Greater Fire Protection Potion", "For Onyxia's Lair"]
    - ["Level 60", "Steaming Stag Steak, Bear Bruscitti, Savory Turtle Stew", "New food. Strength for damage, Stamina for tanks. The values are not known"]
