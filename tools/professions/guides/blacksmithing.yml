sources_note: |
  A trainer teaches 83 of the 441 recipes. For 66 of them, the client does not hold the skill that the trainer asks for. Plans teach the other 358 recipes, and 262 of these plans bind when you pick them up. The client does not say where the plans come from. On the beta, Stondry Darkhammer sold 61 plans for Merchant's Favor at Three Corners in Redridge Mountains. This is the Alliance camp of the Azeroth Commerce Authority. The Horde camp of Durotar Supply and Logistics is west of the Crossroads in the Barrens. The data does not name the Horde merchant. You get Merchant's Favor when you turn in crates. The wiki says that high-end recipes need Favor and reputation. The data does not give the reputation rank for each plan. The Favor prices in this guide come from the beta, not from the launch client.

  The Blacksmithing data does not show where the new reagents come from. The data of other professions shows some sources. Sulfuric Acid is an Alchemy trainer recipe. Sandpaper is an Engineering trainer recipe. Mining has the recipes Smelt Heavy Thorium and Smelt Azerothium. Alchemy has the recipe Transmute: Legionite. The data does not show the source of Pristine Leather, Malleable Essence of Nature, Torbernite, Death Lotus or Golem Heart.

specializations_intro: |
  The client holds 5 specialization abilities. It does not say which recipes need a specialization, or how you get one. In Classic, you select Armorsmith or Weaponsmith at skill 200 and level 40 with a quest. A Weaponsmith can then select 1 master specialization at skill 250 and level 50. These rules are not confirmed for Forever.

specializations:
  - name: "Armorsmith"
    text: "The client says that an Armorsmith can make special armors. In Classic, Lionheart Helm and Stronghold Gauntlets need Armorsmith."
  - name: "Weaponsmith"
    text: "The client says that a Weaponsmith can make special weapons. In Classic, you need it before you can select a master specialization."
  - name: "Master Axesmith"
    text: "The client says that a Master Axesmith can make special axes. In Classic, Arcanite Reaper needs it."
  - name: "Master Hammersmith"
    text: "The client says that a Master Hammersmith can make special maces and hammers. In Classic, Hammer of the Titans and Masterwork Stormhammer need it."
  - name: "Master Swordsmith"
    text: "The client says that a Master Swordsmith can make special swords. In Classic, Arcanite Champion and Frostguard need it."

camp_note: |
  A trainer teaches the Sharpening Wheel. The client does not hold the trainer skill. The wiki says that utility features start at skill 20. The Sharpening Wheel gives a Strength buff at a camp, and the buff does not stack with Strength of Earth. A blueprint from Gilnid in The Deadmines teaches the Anvil at skill 140. A blueprint teaches the Master Forge at skill 300, and it needs 1 Golem Heart. The wiki does not give the source of this blueprint. It also does not give the effects of the Anvil and the Master Forge. Higher tiers include the features of the lower tiers.

tips:
  - "Learn Mining with Blacksmithing. The path needs many bars and stones, and a Miner gets them without the auction house."
  - "Make Copper Rod for the first 10 points if you have Copper Bars. It is orange until 10."
  - "Keep all stones when you mine. Grinding stones are reagents for many recipes."
  - "Make the Sharpening Wheel when the trainer teaches it. It turns yellow at 20 and grey at 25."
  - "Offer Inert Enchanting Rods and skeleton keys to other players. Most need only 1 bar and 1 or 2 grinding stones. Arcanite Rod needs 3 Arcanite Bars."
  - "Do not use Coarse Sharpening Stone or Heavy Sharpening Stone for skill points. Each is grey at the skill where you learn it."
  - "The client shows 88 recipes that turn yellow above skill 300. Make them for the item, not for skill points."
  - "Before you buy a Favor plan, read the tooltip of the item. The client data does not give the stats."
  - "Before you buy a Favor set plan, make sure that you can get Sandpaper, Sulfuric Acid and Pristine Leather."
  - "Blacksmithing gives 1 Legacy Point each at skill 150, 225 and 300."

faq:
  - q: "Which specialization is best?"
    a: "The client does not say which recipes need a specialization. In Classic, Armorsmith makes special armor and Weaponsmith makes special weapons. Read the recipes at your trainer first."
  - q: "Can I level with sharpening stones and grinding stones as in Classic?"
    a: "Only at the start. In Forever, most stones turn grey much earlier. Dense Sharpening Stone is grey at 235."
  - q: "At what skill does the trainer teach each recipe?"
    a: "The client does not hold the trainer skill for 66 recipes. The path uses Classic-era values or estimates, and it marks them."
  - q: "Where do the new plans come from?"
    a: "The client does not say. It shows only that 262 plans bind when you pick them up. On the beta, Stondry Darkhammer sold 61 plans for Merchant's Favor at the Alliance camp."
  - q: "Which Merchant's Favor plans do I buy first?"
    a: "For a mail character that levels, buy the Chain Belt and Gloves of 1 low-level set. At level 60, compare the Enriched Thorium pieces and the weapons in the game. The wiki says that high-end recipes also need reputation."
  - q: "Are the Season of Discovery recipes in Forever?"
    a: "The client holds 65 Blacksmithing recipes from Season of Discovery under a separate heading. No merchant sells them, and the client does not say if a trainer teaches them. This guide does not include them."
  - q: "How many bars do I need for 1 to 300?"
    a: "The materials table gives the estimate for each bracket. The real number changes, because yellow and green recipes do not always give a point."

