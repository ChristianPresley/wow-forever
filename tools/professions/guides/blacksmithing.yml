profession: Blacksmithing
kind: crafting
icon: material-anvil
description: "Blacksmithing guide for WoW: Forever: a path from skill 1 to 300, Merchant's Favor plans, specializations and all 441 recipes."

intro: |
  Blacksmithing changes metal bars and stones into mail armor, plate armor, weapons and weapon stones. It also makes the Inert Enchanting Rods that Enchanters need. In Forever, Copper Rod is a new recipe in this group. The launch client holds 441 recipes, and 197 of them are new. Most new plans bind when you pick them up, so you must find them yourself.

card:
  use: "Mail and plate armor, weapons, weapon stones, skeleton keys and rods for Enchanters."
  pairs: "Mining. It supplies the bars and the stones for almost all recipes."

glance:
  - ["Best for", "Warriors and Paladins. Shamans and Hunters can use the mail armor"]
  - ["Main materials", "Copper, Bronze, Iron, Steel, Mithril and Thorium Bars, and stones"]
  - ["Skill cap", "300"]
  - ["Specializations", "Armorsmith, Weaponsmith, Master Axesmith, Master Hammersmith, Master Swordsmith"]
  - ["Merchant's Favor", "61 plans. On the beta, Stondry Darkhammer sold them at Three Corners, Redridge Mountains. This is the Alliance camp of the Azeroth Commerce Authority"]
  - ["Camp features", "Sharpening Wheel, Anvil, Master Forge"]

new:
  - "**197 new recipes.** 193 of them come from plans that bind when you pick them up."
  - "**The skill colours moved down.** 186 Classic recipes have different values. Most recipes turn yellow and grey at a lower skill than in Classic."
  - "**61 Merchant's Favor plans.** They include 5 low-level mail sets, 5 high-level sets, 3 Enriched Thorium pieces, Thorium Cestus, Thorium Greatmace and Legionite Glaive."
  - "**New reagents:** Heavy Thorium Bar, Legionite Bar, Azerothium Bar, Malleable Essence of Nature, Pristine Leather, Sandpaper and Sulfuric Acid. Most new recipes at skill 300 and the Favor sets use them."
  - "**New armor lines:** Skyforged, Sterling Silver, Hard Gold, Shining Mithril and Blessed Plate, and the Justice and Glory epics."
  - "**2 Rare plate lines near skill 290:** Clutchlord's and Goregasher. Each line has gloves, a belt and boots. The plans bind when you pick them up."
  - "**3 Rare copper boots at skill 35:** Gemmed Copper Boots, Glowing Copper Boots and Strange Copper Boots."
  - "**More fist weapons, polearms and thrown weapons.** There are 5 new fist weapons and 4 new polearms. The 3 thrown Blacksmith Hammers are a new weapon type for the profession."
  - "**Copper Rod is a Blacksmithing recipe.** The 5 Inert Enchanting Rods have their own heading."
  - "**3 camp features:** Sharpening Wheel, Anvil and Master Forge."
  - "**6 Classic plans moved to Leatherworking:** Wildthorn Mail, Heavy Timbermaw Belt, Storm Gauntlets, Heavy Timbermaw Boots, Helm of the Great Chief and Invulnerable Mail. They are not Blacksmithing recipes in Forever."

path_intro: |
  This path uses trainer recipes to skill 240. The client does not hold the skill that the trainer asks for. The path uses the Classic-era value when that value is not above the yellow skill. For 5 mithril and steel recipes it uses the yellow skill as an estimate. Because the colours moved down, it is possible that the trainer teaches these recipes earlier. Go to the trainer each time you get 5 points. A recipe that you learn earlier stays orange longer. If the trainer does not teach a recipe at the skill in the table, continue with the recipe from the step before. Steel Breastplate and Heavy Mithril Axe are other trainer options. Their Classic trainer skills are 200 and 210.

path:
  - bracket: "Apprentice (1–75)"
    intro: |
      You need Rough Stone and Copper Bars. Miners get Rough Stone from copper veins. You need Journeyman Blacksmithing to continue above skill 75.
    steps:
      - {from: 1, to: 25, craft: "Rough Sharpening Stone", note: "1 Rough Stone for each craft. Yellow from 15"}
      - {from: 25, to: 45, craft: "Rough Grinding Stone", learn: 25, learn_basis: classic, note: "Orange for the full step. The path does not use these stones later. Sell them, or keep them for other recipes"}
      - {from: 45, to: 75, craft: "Copper Chain Belt", learn: 35, learn_basis: classic, note: "Orange until 70"}
    notes:
      - "At skill 50, train Journeyman at a Blacksmithing trainer. This is the Classic-era value."
  - bracket: "Journeyman (75–150)"
    intro: |
      You change from copper to bronze in this bracket. A Miner makes Bronze Bars from Copper Bars and Tin Bars. Bronze Warhammer also needs Strong Flux from a vendor and Medium Leather.
    steps:
      - {from: 75, to: 80, craft: "Copper Chain Belt", learn: 35, learn_basis: classic, note: "Yellow"}
      - {from: 80, to: 95, craft: "Runed Copper Belt", note: "Orange until 85, then yellow"}
      - {from: 95, to: 125, craft: "Rough Bronze Leggings", note: "Orange until 120. It needs only Bronze Bars"}
      - {from: 125, to: 150, craft: "Bronze Warhammer", learn: 125, learn_basis: classic, note: "Orange for the full step. This recipe is not changed from Classic"}
    notes:
      - "In Classic, a trainer teaches Expert Blacksmithing at skill 125 and level 20. It is not confirmed for Forever."
      - "Bronze Mace is a trainer recipe that is orange from 75 to 115. Use it in place of Runed Copper Belt if you have Bronze Bars, Weak Flux and Medium Leather."
      - "Coarse Grinding Stone and Heavy Grinding Stone are not good for skill points in Forever. They are grey at 75 and at 125."
      - "Keep 5 Bronze Bars, 2 Coarse Grinding Stones and 2 Medium Leather for the Anvil at skill 140. A blueprint teaches the Anvil."
  - bracket: "Expert (150–225)"
    intro: |
      You use Iron Bars, then Steel Bars and Mithril Bars. The last step uses Steel Bars again. Green Dye comes from a vendor. Each Heavy Grinding Stone needs 3 Heavy Stone, and each Solid Grinding Stone needs 4 Solid Stone. A Miner makes Steel Bars from Iron Bars and Coal. In Classic, Coal comes from a vendor. Heavy Mithril Gauntlet needs Mageweave Cloth. In Classic, Mageweave Cloth comes from humanoids of level 41 to 50.
    steps:
      - {from: 150, to: 155, craft: "Bronze Warhammer", learn: 125, learn_basis: classic, note: "The last orange points"}
      - {from: 155, to: 165, craft: "Green Iron Leggings", learn: 155, learn_basis: classic, note: "Yellow from the start"}
      - {from: 165, to: 178, craft: "Green Iron Bracers", learn: 165, learn_basis: classic, note: "Yellow for the full step"}
      - {from: 178, to: 185, craft: "Green Iron Helm", learn: 170, learn_basis: classic, note: "Yellow until 183. Each craft needs 1 Citrine. If you have no Citrine, continue with Green Iron Bracers, which are green"}
      - {from: 185, to: 200, craft: "Golden Scale Bracers", learn: 185, learn_basis: classic, note: "Yellow until 198"}
      - {from: 200, to: 210, craft: "Heavy Mithril Gauntlet", learn: 200, learn_basis: estimate, note: "The Classic trainer skill is 205, which is above the yellow skill in Forever. The guide uses 200. If the trainer does not teach it at 200, make Steel Breastplate to 205. Steel Breastplate is yellow until 213"}
      - {from: 210, to: 215, craft: "Mithril Plate Pants", learn: 205, learn_basis: estimate, note: "Yellow. It needs only Mithril Bars. The Classic trainer skill of 210 is above the yellow skill"}
      - {from: 215, to: 225, craft: "Steel Plate Helm", learn: 210, learn_basis: estimate, note: "The Classic trainer skill is 215. Yellow until 220, then green. If the trainer teaches Mithril Coif before 225, make that"}
    notes:
      - "In Classic, a trainer teaches Artisan Blacksmithing at skill 200 and level 35. It is not confirmed for Forever."
      - "Go to the trainer at 178. If the trainer teaches Golden Scale Bracers before 185, make them. They are orange until 185."
      - "The trainer recipes from 165 to 225 are yellow or green in this path. Plans such as Golden Scale Leggings, Steel Weapon Chain and Mithril Spurs stay orange longer. The client does not say where these plans come from."
  - bracket: "Artisan (225–300)"
    intro: |
      The trainer has no cheap recipe above skill 240. The last 3 steps use plans that do not bind when you pick them up. The client does not say where these plans come from. In Classic they are world drops, so look in the auction house. You need Mithril Bars, then Thorium Bars. Mithril Coif needs Mageweave Cloth, and Heavy Mithril Boots need Thick Leather. Thorium Greatsword needs Rugged Leather and Dense Grinding Stones. Each Dense Grinding Stone needs 4 Dense Stone. In Classic, a Skinner gets Thick Leather and Rugged Leather.
    steps:
      - {from: 225, to: 235, craft: "Mithril Coif", learn: 225, learn_basis: estimate, note: "The Classic trainer skill is 230, which is above the yellow skill in Forever. The guide uses 225. Yellow. If the trainer does not teach it at 225, make Mithril Spurs from a plan, or Heavy Mithril Axe, which is green"}
      - {from: 235, to: 240, craft: "Heavy Mithril Boots", learn: 230, learn_basis: estimate, note: "The Classic trainer skill is 235. Yellow"}
      - {from: 240, to: 260, craft: "Thorium Bracers", note: "A plan teaches it. There is no cheap trainer recipe here. Orange until 250, then yellow. It needs 4 Blue Power Crystal"}
      - {from: 260, to: 275, craft: "Thorium Greatsword", note: "A plan teaches it. Yellow until 273. It needs Dense Grinding Stones and Rugged Leather, but no crystals"}
      - {from: 275, to: 300, craft: "Thorium Leggings", note: "A plan teaches it. Orange until 295. It needs 4 Red Power Crystal"}
    notes:
      - "If you have the plan for Thorium Bracers at skill 230, start it then. It is orange from 230 to 250."
      - "If you do not have the plan for Thorium Bracers, make Heavy Mithril Boots to 245. The boots are green from 240. Thorium Belt is a second option. A plan teaches it, and it is orange from 225 to 245."
      - "Go to the trainer at 225. If the trainer teaches Dense Sharpening Stone or Dense Grinding Stone, make them to 230. They are orange until 230. The client does not hold the trainer skill. Keep the Dense Grinding Stones for Thorium Greatsword."
      - "Thorium Boots and Thorium Helm are orange from 255 to 275. Use one of them if you do not have the plan for Thorium Greatsword."
      - "If you do not have the plan for Thorium Leggings, use Radiant Circlet and then Radiant Leggings. Radiant Circlet is orange from 270 to 290. Radiant Leggings are orange from 280 to 300. Plans teach these recipes also, and each craft needs 4 Heart of Fire."
      - "In Classic, Power Crystals come from Un'Goro Crater. It is not confirmed for Forever."

picks_intro: |
  These recipes are not necessary for the path, but they are useful. The client data does not give item stats. Read the tooltip in the game before you buy materials.

picks:
  - title: "Weapon stones"
    intro: |
      In Classic, a sharpening stone increases the damage of a sharp weapon for a time. A weightstone does the same for a blunt weapon. These effects are not confirmed for Forever.
    items:
      - {recipe: "Rough Sharpening Stone", why: "The first stone. It is not changed from Classic"}
      - {recipe: "Heavy Sharpening Stone", why: "In Classic, a stone for mid-level weapons. Make it for use, not for skill points"}
      - {recipe: "Solid Sharpening Stone", why: "In Classic, the stone for the level 35 to 45 range"}
      - {recipe: "Dense Sharpening Stone", why: "In Classic, the standard stone at level 60. It is not confirmed for Forever"}
      - {recipe: "Dense Weightstone", why: "In Classic, the standard stone for maces at level 60. It is not confirmed for Forever"}
      - {recipe: "Elemental Sharpening Stone", why: "In Classic, the best stone. It is not confirmed for Forever. It turns yellow at 275, but you learn it at 300"}
  - title: "Inert Enchanting Rods"
    intro: |
      The Enchanting recipes for runed rods use these rods as a reagent.
    items:
      - {recipe: "Copper Rod", why: "New as a Blacksmithing recipe. It gives fast points from 1 to 10"}
      - {recipe: "Silver Rod", why: "The reagent for Runed Silver Rod"}
      - {recipe: "Golden Rod", why: "The reagent for Runed Golden Rod"}
      - {recipe: "Truesilver Rod", why: "The reagent for Runed Truesilver Rod"}
      - {recipe: "Arcanite Rod", why: "The last rod. It is the reagent for Runed Arcanite Rod"}
  - title: "Keys, buckles and weapon parts"
    intro: |
      In Classic, a skeleton key opens a locked chest or door. The client data does not give the effects of the other items. The 4 skeleton keys and Iron Buckle make 2 for each craft. The client data does not show if this is new in Forever.
    items:
      - {recipe: "Silver Skeleton Key", why: "Makes 2 for each craft"}
      - {recipe: "Golden Skeleton Key", why: "Makes 2 for each craft"}
      - {recipe: "Truesilver Skeleton Key", why: "Makes 2 for each craft"}
      - {recipe: "Arcanite Skeleton Key", why: "Makes 2 for each craft"}
      - {recipe: "Iron Buckle", why: "Makes 2. Blessed Plate Belt uses 1"}
      - {recipe: "Inlaid Mithril Cylinder", why: "A reagent for Engineering recipes such as Gnomish Death Ray and Mithril Mechanical Dragonling. No Blacksmithing recipe uses it"}
      - {recipe: "Mithril Spurs", why: "Orange from 210 to 230 with only Mithril Bars and Solid Grinding Stones. Good for skill points"}
      - {recipe: "Thorium Shield Spike", why: "The last shield spike. Read the tooltip for its effect"}
      - {recipe: "Steel Weapon Chain", why: "The name suggests an item that you attach to a weapon. Read the tooltip"}
  - title: "Mail and plate for leveling"
    intro: |
      These recipes make armor for your character during leveling. The plans for the Skyforged, Sterling Silver, Hard Gold, Shining Mithril and Blessed Plate lines bind when you pick them up. The 3 Rare copper boots turn grey 5 points after you learn them, so each gives only 5 points.
    items:
      - {recipe: "Rough Copper Vest", why: "A chest piece at skill 1. It is not changed from Classic"}
      - {recipe: "Glowing Copper Boots", why: "New. One of 3 Rare mail boots at skill 35. The plan binds when you pick it up"}
      - {recipe: "Copper Chain Pants", why: "Cheap trainer legs. The recipe is not changed from Classic"}
      - {recipe: "Azure Skyforged Chainmail", why: "New. One of 16 Skyforged recipes. The first group starts at skill 50"}
      - {recipe: "Rough Bronze Cuirass", why: "A trainer chest piece that needs only Bronze Bars"}
      - {recipe: "Sterling Silver Breastplate", why: "New. The Sterling Silver line uses Silver Bars as the main material"}
      - {recipe: "Green Iron Hauberk", why: "A Rare chest piece from the trainer"}
      - {recipe: "Hard Gold Cuirass", why: "New. The Hard Gold line uses Gold Bars as the main material"}
      - {recipe: "Steel Breastplate", why: "A trainer chest piece from Steel Bars"}
      - {recipe: "Heavy Mithril Breastplate", why: "A trainer plate chest piece that needs only Mithril Bars"}
      - {recipe: "Shining Mithril Breastplate", why: "New. The Shining Mithril line uses Truesilver Bars"}
      - {recipe: "Blessed Plate Chest", why: "New. The Blessed Plate line uses Thorium Bars and Blue Sapphires"}
      - {recipe: "Clutchlord's Grips", why: "New. One of 6 Rare plate recipes in the Clutchlord's and Goregasher lines. The client data does not give the stats"}
  - title: "Merchant's Favor: low-level mail sets"
    intro: |
      On the beta, Stondry Darkhammer sold 6 plans for each of 5 Rare mail sets. Each plan cost 30 Merchant's Favor. 1 material is different in each set: Shadowgem (Guard's), Tigerseye (Protector's), Strange Dust (Acolyte's), Lesser Magic Essence (Crusader's) or Small Lustrous Pearl (Veteran's). Choose the set by the stats in the tooltip. Each set also has a Chain Shirt, Chain Leggings and a Chain Helm that are not Favor plans. These plans bind when you pick them up, and the client does not say where they come from. Each of these recipes turns grey 5 points after you learn it, so it gives only 5 points.
    items:
      - {recipe: "Guard's Chain Belt", why: "The first piece of each set. Buy this plan first if you level a mail character"}
      - {recipe: "Guard's Gloves", why: "The same recipe is in each of the 5 sets"}
      - {recipe: "Guard's Boots", why: "The third Favor piece of the set"}
      - {recipe: "Guard's Silvered Chain Helm", why: "Item level 25"}
      - {recipe: "Guard's Silvered Chain Shirt", why: "Item level 27"}
      - {recipe: "Guard's Silvered Chain Leggings", why: "Item level 30. The last piece of the set"}
      - {recipe: "Guard's Chain Shirt", why: "Not a Favor plan. The plan binds when you pick it up"}
      - {recipe: "Guard's Chain Leggings", why: "Not a Favor plan. The plan binds when you pick it up"}
      - {recipe: "Guard's Chain Helm", why: "Not a Favor plan. The plan binds when you pick it up"}
  - title: "Merchant's Favor: high-level sets"
    intro: |
      The Justicar's, Officer's, Prefect's, Sentinel's and Warder's sets have 5 Favor plans each. On the beta, the plans cost 60 or 90 Merchant's Favor. 1 material is different in each set: Globe of Water, Jade, Golden Pearl, Purple Lotus or Black Pearl. Each set also has a Belt, Boots and Gloves that are not Favor plans. These plans bind when you pick them up. Each of these recipes also turns grey 5 points after you learn it.
    items:
