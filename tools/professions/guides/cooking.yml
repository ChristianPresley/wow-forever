profession: Cooking
kind: secondary
icon: material-pot-steam
description: "Cooking guide for WoW: Forever: a path from skill 1 to 300, the campfires, the new teas and smoothies, and all 125 recipes."

intro: |
  Cooking is a secondary skill, so each character can learn it with 2 primary professions. It changes meat, eggs and fish into food. In Forever it also makes the **campfires** of the camping system, and 2 new groups of drinks. The client sorts most food below a heading that names a stat, for example Stamina Food and Strength Food.

card:
  use: "Stat food, campfires for the camping system, and new teas and smoothies. Useful for each class."
  pairs: "Fishing gives the fish for more than 20 recipes. Herbalism gives the herbs for the teas."

glance:
  - ["Best for", "All classes. Cooking makes the campfires of the camping system"]
  - ["Main materials", "Meat, eggs, clam meat, fish and vendor spices"]
  - ["Skill cap", "300"]
  - ["Camp features", "Basic Campfire, Journeyman Campfire, Cookie's Feast, Expert Campfire, Iron Oven"]
  - ["Pairs with", "Fishing"]

new:
  - "**Campfires are Cooking recipes.** The Camping heading has 5 new recipes: Basic Campfire, Journeyman Campfire, Cookie's Feast, Expert Campfire and Iron Oven. The 3 campfires use wood. Cookie's Feast and Iron Oven use food reagents."
  - "**Headings by stat.** The client puts most food below a heading such as Stamina Food, Strength Food, Agility Food, Intellect Food or Spell Damage Food."
  - "**New drinks:** 6 teas (Soothing Drinks) and 6 smoothies (Delightful Drinks). The client data does not give their effects. Read the tooltip in the game."
  - "**44 new recipes in total.** A recipe item teaches 42 of them, and 33 of these recipe items bind when you pick them up. A trainer teaches the other 2: Basic Campfire and Spinefin Halibut."
  - "**Spinefin Halibut** is a new trainer recipe below the Fisherman's Delights heading. It uses 1 Raw Spinefin Halibut. The client does not hold its trainer skill, and it is grey at 220."
  - "**New food at skill 275:** 10 recipes, for example Bear Bruscitti, Swiftstrike Steak and Bat Hachee. Each uses 3 pieces of 1 main reagent and Soothing Spices."
  - "**21 Classic recipes changed.** The client data does not say what changed in each recipe. 13 of them make more than 1 food for each craft. Goldthorn Tea makes 4."
  - "**Simple Flour** is a new reagent. Skywall Souffle, Pincer Bites, Critter Cookie and Iron Oven use it."
  - "**Removed:** Crystal Throat Lozenge is not in Forever."
  - "60 Classic recipes are not changed."

path_intro: |
  This path uses trainer recipes for most skill points. Only skill 240 to 285 uses recipe items, because no trainer recipe is orange there. In Classic, vendors sell spices and Refreshing Spring Water. The meat comes from beasts, so collect it when you level.

path:
  - bracket: "Apprentice (1–75)"
    intro: |
      Chunk of Boar Meat and Stringy Wolf Meat drop from boars and wolves in the first zones. These are Classic-era drops. In Classic, you need Journeyman Cooking to continue above skill 75.
    steps:
      - {from: 1, to: 40, craft: "Roasted Boar Meat", note: "Charred Wolf Meat has the same skill values. Use the meat that you have"}
      - {from: 40, to: 50, craft: "Spiced Wolf Meat", learn: 10, learn_basis: classic, note: "Needs Mild Spices from a vendor"}
      - {from: 50, to: 75, craft: "Coyote Steak", learn: 50, learn_basis: classic, note: "Boiled Clams is the alternative. It has the same skill values"}
    notes:
      - "Make 1 Basic Campfire for the camping quest *The Great Outdoors*. It is grey at skill 5, so it is not a step of the path."
      - "The Camping page calls the item Basic Campfire Kit."
      - "At skill 50, train Journeyman at a Cooking trainer. This is the Classic-era value."
  - bracket: "Journeyman (75–150)"
    intro: |
      In Classic, Coyote Meat drops in Westfall and Mulgore, and Boar Ribs drop from boars of level 15 to 30. Tangy Clam Meat comes from Thick-shelled Clams. These locations are not confirmed for Forever.
    steps:
      - {from: 75, to: 90, craft: "Coyote Steak", learn: 50, learn_basis: classic}
      - {from: 90, to: 125, craft: "Dry Pork Ribs", learn: 80, learn_basis: classic, note: "Yellow from 120. Crab Cake is the alternative from 90 to 115"}
      - {from: 125, to: 150, craft: "Goblin Deviled Clams", learn: 125, learn_basis: classic, note: "Needs Hot Spices from a vendor"}
    notes:
      - "At skill 90, you can learn Journeyman Campfire from its recipe item."
      - "In Classic, a vendor book teaches Expert Cooking at skill 125. It is not confirmed that Forever uses the same book."
  - bracket: "Expert (150–225)"
    intro: |
      Goldthorn is a herb. In Classic, it grows in zones of level 30 to 45, and White Spider Meat drops from spiders of level 40 to 55. Buy Goldthorn if you are not a Herbalist.
    steps:
      - {from: 150, to: 175, craft: "Goblin Deviled Clams", learn: 125, learn_basis: classic, note: "Yellow from 165"}
      - {from: 175, to: 200, craft: "Goldthorn Tea", learn: 175, learn_basis: classic, note: "Makes 4 for each craft. In Classic, an NPC in Razorfen Downs teaches it"}
      - {from: 200, to: 225, craft: "Spider Sausage", learn: 200, learn_basis: classic, note: "2 White Spider Meat for each craft"}
    notes:
      - "If you cannot learn Goldthorn Tea, use a recipe item for skill 175 to 200. Soothing Turtle Bisque, Giant Clam Scorcho and Mithril Headed Trout are orange in this range."
      - "Goblin Deviled Clams is green from 185 to 205. It gives points slowly, so do not use it to 200."
      - "In Classic, a quest in Tanaris at skill 225 gives Artisan Cooking. It is not confirmed for Forever."
      - "In Classic, this quest needs Giant Egg, Zesty Clam Meat and Alterac Swiss. Keep Giant Egg, because Monster Omelet also uses it."
  - bracket: "Artisan (225–300)"
    intro: |
      No trainer recipe is orange from skill 240 to 285, so this bracket uses 2 recipe items. In Classic, vendors sell these 2 recipe items. The client data does not say where they come from in Forever.

      In Classic, vendors sell Soothing Spices, and Giant Egg drops from large birds in zones of level 40 to 60. Raw Sunscale Salmon comes from Fishing, and Sandworm Meat drops from sandworms in Silithus. These locations are not confirmed for Forever.
    steps:
      - {from: 225, to: 240, craft: "Spider Sausage", learn: 200, learn_basis: classic}
      - {from: 240, to: 265, craft: "Monster Omelet", note: "A recipe item teaches it. No trainer recipe is orange in this range. Tender Wolf Steak has the same skill values"}
      - {from: 265, to: 285, craft: "Poached Sunscale Salmon", note: "A recipe item teaches it. It needs fish only. Without fish, continue Monster Omelet, which is yellow"}
      - {from: 285, to: 300, craft: "Smoked Desert Dumplings", learn: 285, learn_basis: classic, note: "Orange to 300. In Classic, a quest in Silithus teaches it. Not confirmed for Forever"}
    notes:
      - "Smoked Desert Dumplings is yellow at 325 in the client data, which is above the skill cap. As a result, each craft gives a point."
      - "Nightfin Soup has the same skill values as Poached Sunscale Salmon. Use the fish that you have."
      - "Without a recipe item, Spider Sausage is yellow to 260 and green to 280. This is slow."
      - "Spotted Yellowtail has the same skill values as Monster Omelet. It needs 1 fish and no spices."
      - "If you cannot learn Smoked Desert Dumplings, continue Poached Sunscale Salmon or Nightfin Soup to 300. They are yellow from 290."
      - "Baked Salmon, Lobster Stew and Mightfish Steak are orange from 275 to 300, but they need recipe items."

picks_intro: |
  These recipes are not necessary for the path, but they are useful. Most client headings name a stat, for example Stamina Food. The client data does not give the effect or its quantity, so read the tooltip in the game.

