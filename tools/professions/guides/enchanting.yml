profession: Enchanting
kind: crafting
icon: material-auto-fix
description: "Enchanting guide for WoW: Forever: a path from skill 1 to 300, the necklace and off-hand enchants, the Merchant's Favor recipes, and all 225 recipes."

intro: |
  Enchanting puts permanent enchants on armor and weapons. Its **Disenchant** ability destroys an item of green quality or better and gives dusts, essences and shards. In Forever it also makes wands, staves, off-hand items, relics, weapon oils and 3 camp features. Most recipes are enchants that make no item, so the recipe name is the only data on the effect.

card:
  use: "Enchants for each gear slot, wands, staves, relics and weapon oils. Disenchant changes unwanted gear into materials."
  pairs: "Tailoring makes cheap items to disenchant. Blacksmithing makes the inert rods."

glance:
  - ["Best for", "Mages, Priests and Warlocks. All classes use the enchants"]
  - ["Main materials", "Dusts, essences and shards from Disenchant"]
  - ["Tools", "A runed rod. Blacksmithing makes the inert rod for it"]
  - ["Skill cap", "300"]
  - ["Camp features", "Enchanted Lute, Arcane Salvager, Arcane Forge"]

new:
  - "**Copper Rod is now a Blacksmithing recipe.** Each Runed rod needs an inert rod: Copper Rod, Silver Rod, Golden Rod, Truesilver Rod or Arcanite Rod. Blacksmithing makes all 5 under the heading *Inert Enchanting Rods*. Only Copper Rod is new there."
  - "**Dust to Motes** is a new trainer recipe. It changes 1 Strange Dust into 3 Mote of Magic. The first rod, the first bracer enchant and the first wand use motes."
  - "**Cheaper early enchants.** 116 of the 225 recipes are changed from Classic Era. Many early enchants now use 1 or 2 dusts or essences."
  - "**Stamina and Intellect names.** The list has no enchants with Health or Mana in the name. The Stamina and Intellect chest enchants have the skill colours of the Classic Health and Mana chest enchants. The client data thus shows a rename. The names suggest Stamina and Intellect in place of Health and Mana."
  - "**New enchant slots:** 5 necklace enchants and 3 off-hand enchants. The bracer, glove, boots, shield, cloak and weapon lists also have new enchants."
  - "**New item lines:** 4 staves, 4 off-hand items, 14 relics, 7 new wands and 3 new Heart of the Mountain curios."
  - "**39 recipes cost Merchant's Favor.** The Alliance merchant Alynsia at Three Corners in Redridge Mountains sells them. The Horde camp is west of the Crossroads in the Barrens."
  - "**3 camp features:** Enchanted Lute, Arcane Salvager and Arcane Forge."
  - "The client lists 1 Classic recipe as removed: Charged Scale of Onyxia."

path_intro: |
  This path uses trainer recipes until skill 270. Each step uses 1 or 2 materials from Disenchant, so the enchants of the path use no shards. The materials table does not include the rods. You put the enchants on your own gear, and a new enchant replaces the old one.

  The client does not hold the skill that a trainer asks for. For a recipe with the same name as in Classic Era, the path uses the Classic-era value. For a renamed recipe, the path gives an estimate. The estimate is the Classic-era value of the recipe with the same skill colours.

path:
  - bracket: "Apprentice (1–75)"
    intro: |
      You need Strange Dust. In Classic, Strange Dust comes from green armor and weapons of item level 5 to 20. This is a Classic-era value. It is not confirmed for Forever.
    steps:
      - {from: 1, to: 10, craft: "Dust to Motes", note: "Each craft makes 3 Mote of Magic. Keep these for the rod and the next step"}
      - {from: 10, to: 20, craft: "Enchant Bracer - Inferior Stamina", note: "Uses the motes from the first step"}
      - {from: 20, to: 70, craft: "Enchant Chest - Inferior Stamina", learn: 15, learn_basis: estimate, note: "Orange for the full step. The name is new in Forever"}
      - {from: 70, to: 75, craft: "Enchant Bracer - Minor Stamina", learn: 50, learn_basis: classic}
    notes:
      - "Make 1 Runed Copper Rod before the first enchant. It needs 1 Copper Rod from a Blacksmith and 1 Mote of Magic."
      - "Enchant Bracer - Minor Deflect is an alternative for skill 20 to 80. The client gives learn skill 1 for it, and it is orange until 80."
      - "Each craft of Enchant Bracer - Minor Deflect uses 1 Lesser Magic Essence. Use it when you have more essences than dust."
      - "Train Journeyman at an Enchanting trainer before skill 75. In Classic, the trainer asks for skill 50."
  - bracket: "Journeyman (75–150)"
    intro: |
      You need Strange Dust, Lesser Magic Essence, Lesser Astral Essence and Soul Dust. In Classic, Soul Dust comes from green items of item level 21 to 30. In Classic, the essences come mostly from green weapons, and the dusts from green armor. These are Classic-era values. They are not confirmed for Forever.
    steps:
      - {from: 75, to: 110, craft: "Enchant Bracer - Minor Stamina", learn: 50, learn_basis: classic, note: "Yellow from 100"}
      - {from: 110, to: 120, craft: "Enchant Bracer - Minor Agility", learn: 80, learn_basis: classic, note: "Yellow from 115"}
      - {from: 120, to: 130, craft: "Enchant Chest - Stamina", learn: 120, learn_basis: estimate, note: "Needs 1 Lesser Astral Essence for each craft"}
      - {from: 130, to: 150, craft: "Enchant Bracer - Lesser Stamina", learn: 130, learn_basis: classic, note: "1 Soul Dust for each craft"}
    notes:
      - "Make the Runed Silver Rod when the trainer teaches it. In Classic, that is skill 100. A Blacksmith makes the Silver Rod."
      - "The Runed Silver Rod needs 1 Silver Rod, 3 Strange Dust, 4 Lesser Magic Essence and 1 Shadowgem."
      - "In Classic, a higher enchant needs a higher rod. The client data does not give the rod for each enchant."
      - "Train Expert before skill 150. In Classic, the trainer asks for skill 125."
  - bracket: "Expert (150–225)"
    intro: |
      You need Soul Dust and Vision Dust. In Classic, Vision Dust comes from green items of item level 31 to 40. This is a Classic-era value. It is not confirmed for Forever.
    steps:
      - {from: 150, to: 160, craft: "Enchant Bracer - Lesser Stamina", learn: 130, learn_basis: classic, note: "Yellow from 155"}
      - {from: 160, to: 180, craft: "Enchant Boots - Lesser Agility", learn: 160, learn_basis: classic, note: "1 Soul Dust for each craft"}
      - {from: 180, to: 205, craft: "Enchant Bracer - Strength", learn: 180, learn_basis: classic, note: "1 Vision Dust for each craft. Yellow from 200"}
      - {from: 205, to: 225, craft: "Enchant Cloak - Greater Defense", learn: 205, learn_basis: classic, note: "1 Vision Dust for each craft"}
    notes:
      - "Make the Runed Golden Rod when the trainer teaches it. In Classic, that is skill 150. It needs 1 Golden Rod, 1 Iridescent Pearl, 1 Greater Astral Essence and 1 Soul Dust."
      - "Make the Runed Truesilver Rod when the trainer teaches it. In Classic, that is skill 200. It needs 1 Truesilver Rod, 1 Black Pearl, 1 Greater Mystic Essence and 1 Vision Dust."
      - "Train Artisan before skill 225. In Classic, the trainer asks for skill 200. It is not confirmed for Forever."
  - bracket: "Artisan (225–300)"
    intro: |
      You need Vision Dust, Dream Dust, Lesser Nether Essence and Illusion Dust. In Classic, Dream Dust comes from green items of item level 41 to 50, and Illusion Dust from item level 51 to 60. These are Classic-era values. They are not confirmed for Forever.
    steps:
      - {from: 225, to: 250, craft: "Enchant Gloves - Agility", learn: 210, learn_basis: classic, note: "1 Vision Dust for each craft. Yellow from 230"}
      - {from: 250, to: 270, craft: "Enchant Bracer - Greater Strength", learn: 240, learn_basis: classic, note: "Yellow from 260"}
      - {from: 270, to: 290, craft: "Enchant Boots - Greater Stamina", note: "A recipe item teaches it. No trainer recipe is orange here. Yellow from 280"}
      - {from: 290, to: 300, craft: "Enchant Cloak - Superior Defense", note: "A recipe item teaches it. The trainer recipes are green here. Orange for the full step"}
    notes:
      - "Without a recipe item, stay on Enchant Bracer - Greater Strength until 280. It is yellow until 280."
      - "The trainer alternatives after 280 are Enchant Weapon - Greater Striking, Enchant Chest - Stats and Enchant Gloves - Minor Haste. They are yellow until 285, 285 and 290. Each craft uses 1 Large Radiant Shard."
      - "3 other recipes from recipe items are orange in this bracket. Enchant Gloves - Greater Agility is orange from 270 to 290. Enchant Chest - Major Stamina is orange from 275 to 295. Enchant Shield - Superior Spirit is orange from 280 to 300."
      - "The recipe items of these 3 recipes do not bind on pickup, so other players can sell them to you."
      - "If you do not have Enchant Cloak - Superior Defense, continue Enchant Boots - Greater Stamina to 300. It is yellow until 300."
      - "In Classic, Enchant Cloak - Superior Defense needs a Runed Arcanite Rod. This is not confirmed for Forever. If you do not have the rod, also continue Enchant Boots - Greater Stamina."
      - "The recipe item for Runed Arcanite Rod binds when you pick it up. The client gives learn skill 290 for it."
      - "The Runed Arcanite Rod needs 1 Arcanite Rod, 1 Golden Pearl, 10 Illusion Dust, 4 Greater Eternal Essence, 4 Small Brilliant Shard and 2 Large Brilliant Shard."
      - "The client does not say where the 2 recipe items for this bracket come from."

picks_intro: |
  These recipes are not necessary for the path, but they are useful. An enchant makes no item, so the client data gives no effect for it. The name of an enchant gives the slot and the statistic.

picks:
  - title: "Rods and reagents"
    intro: |
      You need the rods to enchant. The 2 reagent recipes make materials for other professions in Classic.
    items:
      - {recipe: "Runed Copper Rod", why: "The first rod. Make it before the first enchant"}
      - {recipe: "Runed Silver Rod", why: "The second rod. It also needs 1 Shadowgem"}
      - {recipe: "Runed Golden Rod", why: "The third rod"}
      - {recipe: "Runed Truesilver Rod", why: "The fourth rod"}
      - {recipe: "Runed Arcanite Rod", why: "The last rod. In Classic, the best enchants need it"}
      - {recipe: "Dust to Motes", why: "New. It makes Mote of Magic for the first recipes"}
      - {recipe: "Enchanted Thorium", why: "Not changed from Classic. In Classic, Blacksmithing uses it"}
      - {recipe: "Enchanted Leather", why: "Not changed from Classic. In Classic, Leatherworking and Tailoring use it"}
  - title: "Wands"
    intro: |
      A wand is useful for a Mage, a Priest or a Warlock at a low level. The client data does not give the damage of the new wands.
    items:
      - {recipe: "Novice's Practice Wand", why: "New. The first wand, before Lesser Magic Wand"}
      - {recipe: "Lesser Magic Wand", why: "Not changed from Classic. In Classic, the trainer teaches it at skill 10"}
      - {recipe: "Greater Magic Wand", why: "In Classic, the trainer teaches it at skill 70"}
      - {recipe: "Lesser Mystic Wand", why: "The first wand that uses Star Wood"}
      - {recipe: "Greater Mystic Wand", why: "The last wand from a trainer"}
      - {recipe: "Twisted Nether Wand", why: "New. The first of 6 new wands with a recipe item that binds on pickup. 1 of the 6 costs Merchant's Favor"}
      - {recipe: "Greater Eternal Wand", why: "New. Item level 60 and uncommon quality"}
      - {recipe: "Torch of Light", why: "New. Epic quality and item level 65. It uses 2 Malleable Essence of Nature"}
  - title: "Enchants for leveling"
    intro: |
      A trainer teaches all of these. Each one uses 1 to 3 materials. Some use a shard.
    items:
      - {recipe: "Enchant Chest - Inferior Stamina", why: "The first chest enchant. It uses only 1 dust"}
      - {recipe: "Enchant Weapon - Minor Striking", why: "The first weapon enchant from a trainer"}
      - {recipe: "Enchant 2H Weapon - Minor Impact", why: "The first trainer enchant for a 2-handed weapon"}
      - {recipe: "Enchant Chest - Minor Stats", why: "The first chest enchant with the name Stats"}
      - {recipe: "Enchant Boots - Minor Speed", why: "In Classic, Minor Speed increases the run speed. The effect in Forever is not confirmed"}
      - {recipe: "Enchant Weapon - Striking", why: "The middle weapon enchant from a trainer"}
      - {recipe: "Enchant 2H Weapon - Greater Impact", why: "The trainer enchant with the highest skill for 2-handed weapons"}
      - {recipe: "Enchant Chest - Stats", why: "The trainer enchant with the highest skill for the chest"}
  - title: "Level 60 enchants from Classic"
    intro: |
      A recipe item teaches each one. 9 of these 10 recipes are not changed from Classic Era in the client data. The recipes with learn skill 300 give no skill points, because the skill cap is 300.
    items:
      - {recipe: "Enchant Weapon - Crusader", why: "The standard melee weapon enchant in Classic. It uses 2 Righteous Orb"}
      - {recipe: "Enchant Weapon - Fiery Weapon", why: "Changed from Classic: the reagents are different. It is orange until skill 285 and yellow until 305"}
      - {recipe: "Enchant Weapon - Lifestealing", why: "Not changed from Classic"}
      - {recipe: "Enchant Weapon - Agility", why: "Not changed from Classic. The recipe item binds on pickup"}
      - {recipe: "Enchant Weapon - Mighty Intellect", why: "Not changed from Classic. It uses 15 Large Brilliant Shard"}
      - {recipe: "Enchant Chest - Greater Stats", why: "The top chest enchant in the list"}
      - {recipe: "Enchant Boots - Greater Agility", why: "Not changed from Classic"}
      - {recipe: "Enchant Gloves - Threat", why: "A tank enchant in Classic. Not changed"}
      - {recipe: "Enchant Cloak - Subtlety", why: "In Classic, it decreases threat. Not changed"}
