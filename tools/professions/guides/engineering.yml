    intro: |
      These recipes are new. Each one adds a SAF-T or EZ-Thro part to a Classic explosive. The client data does not give the effects, so read the tooltip in the game. Recipe items teach SAF-T Casing, EZ-Thro Tru-Trigger, SAF-T Tube and EZ-Thro Shell. The client does not say where these items come from.
