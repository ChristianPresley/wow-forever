sources_note: |
  A trainer teaches 71 of the 247 recipes. The client does not hold the skill that the trainer asks for, so the guide uses Classic-era values. Recipe items teach the other 176 recipes, and the client does not say where these items come from. 97 of the recipe items bind when you get them, so you cannot buy them from other players.

  Fritz Fizzle at Three Corners in Redridge Mountains sells 28 schematics for Merchant's Favor. Three Corners is the Alliance camp of the Azeroth Commerce Authority. The Horde camp of Durotar Supply and Logistics is west of the Crossroads in the Barrens. The data does not name the Horde merchant. You get Merchant's Favor when you turn in crates. The wiki says that high-end recipes also need reputation. See the Economy page. In the beta, the schematics cost 45, 180, 270 or 360 Favor. The price increases with the skill of the recipe.

  8 of the 28 Favor schematics do not bind, so you can buy them from other players. These include SAF-T Tabs, EZ-Thro Wrap, No Slip SAF-T Padding, SAF-T Bell and EZ-Thro Fireproof Fuse.

  The client also holds 28 Engineering recipes from Season of Discovery. No merchant sells them in the beta data, so this guide does not list them.

specializations_intro: |
  The client has 2 specializations. It does not say which recipes each one needs, or how you select one. In Classic, you select one at skill 200 with a quest, and the recipes with Gnomish or Goblin in the name follow that selection. This is not confirmed for Forever.

specializations:
  - name: "Gnomish Engineer"
    text: "The client text says that it lets an engineer make \"fantastic, yet unreliable gnomish devices\". The Gnomish recipes are gadgets, such as Gnomish Shrink Ray, Gnomish Cloaking Device, Gnomish Mind Control Cap and Gnomish Battle Chicken. In Classic, Ultrasafe Transporter - Gadgetzan is also Gnomish. New recipes with Gnomish in the name are Gnomish Army Knife, Gnomish Poultryizer and Gnomish Weather Machine. The client does not say that they need the specialization."
  - name: "Goblin Engineer"
    text: "The client text says that it lets an engineer make \"lethal goblin devices\". The Goblin recipes are mostly explosives, such as Goblin Sapper Charge, The Big One, Goblin Mortar and Goblin Bomb Dispenser. In Classic, Dimensional Ripper - Everlook is also Goblin. Ultralight Goblin Glider is a new recipe with Goblin in the name. The client does not say that it needs the specialization."

camp_note: |
  A trainer teaches the Reagent Bot, and it uses 1 Handful of Copper Bolts and 1 Copper Tube. The Camping page says that a "Camping 101" quest gives the Tier 1 feature of each profession. The Repair Bot blueprint drops from Sneed in The Deadmines and needs skill 140. The Repair Bot uses 2 Whirring Bronze Gizmos, 1 Bronze Tube and 1 Heavy Leather. A blueprint teaches Anarchist's Workbench at skill 300, and it uses 1 Essence of Anarchy and 2 Thorium Widgets. Tier 3 blueprints drop from dungeon and raid bosses. The boss for Anarchist's Workbench is not known. A higher tier includes the features of the lower tiers. The Legacy talent Reagent Economy removes the reagents of Tier 1 features. The client data does not give the effects of the 3 features.

tips:
  - "Mine and smelt your own bars. The path uses bars of each tier, and stone for all blasting powder."
  - "Keep the stone that you mine. Each tier of blasting powder uses a different stone."
  - "Make the parts for a step before you start it. Explosive Sheep and Hi-Explosive Bomb each use 3 different parts."
  - "Keep spare Silver Contacts and Gold Power Cores. 1 bar now makes many of them."
  - "Gnomes have Engineering Specialization. It gives 20% fewer device failures."
  - "Engineering gives Legacy Points at skill 150, 225 and 300."
  - "Many recipes need skill 300 and turn yellow at 320. The skill cap is 300, so they give no skill point that you can use."
  - "The Mortar: Reloaded has no skill colours in the client. The client data does not show if it gives skill points."
  - "Goblin Jumper Cables asks for skill 165, but it is yellow at 160. It is never orange."
  - "Serrated Strap makes an item that has no name in the launch client."

faq:
  - q: "Do I need Mining for Engineering?"
    a: "No, but Mining saves much gold. Most recipes use bars, and all blasting powder uses stone from mining nodes."
  - q: "Where do I get the Thorium Widget and Thorium Shells recipes?"
    a: "Ask the trainer first. In Classic, a trainer teaches the 2 recipes, but this is not confirmed for Forever. The client data shows recipe items for them, and it does not say where the items come from. The 2 recipe items do not bind, so you can buy them from other players."
  - q: "What do the SAF-T and EZ-Thro items do?"
    a: "The client data does not give the effects. Each item is a Classic explosive or device with a new part added. Read the tooltip in the game."
  - q: "Gnomish or Goblin Engineering?"
    a: "In Classic, Gnomish gives gadgets and Goblin gives explosives, such as Goblin Sapper Charge. The client does not confirm that Forever uses the same rules."
  - q: "At what skill do I learn each trainer recipe?"
    a: "The client does not hold the trainer skill. The path uses the Classic-era values, and it marks them as Classic values."
  - q: "Can I level to 300 with trainer recipes only?"
    a: "The client data does not confirm it. The trainer recipes above 260 are Salt Shaker, the 2 transporters and Tranquil Mechanical Yeti. Salt Shaker is orange to 270 and yellow to 280. In Classic, each transporter needs a different specialization. All of these recipes use many costly reagents, so the path uses Thorium Widget and Thorium Shells."

