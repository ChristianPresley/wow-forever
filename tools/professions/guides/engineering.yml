    intro: |
      Many recipes use these parts. Make them when you have spare bars.
    items:
      - {recipe: "Handful of Copper Bolts", why: "A reagent of many copper and bronze recipes, and of the Reagent Bot"}
      - {recipe: "Silver Contact", why: "Makes 5. Each bomb from Large Copper Bomb to Big Iron Bomb uses 1"}
      - {recipe: "Gold Power Core", why: "Makes 3. A reagent of Gyrochronatom and of many devices"}
      - {recipe: "Gyrochronatom", why: "A reagent of Mechanical Dragonling, Advanced Target Dummy and the Favor goggles"}
      - {recipe: "Unstable Trigger", why: "A reagent of most mithril bombs, guns and devices"}
      - {recipe: "Thorium Widget", why: "A reagent of many recipes from skill 260"}
      - {recipe: "Sandpaper", why: "New trainer recipe. It uses Bauxite. SAF-T Bell uses it"}
  - title: "Explosives"
    intro: |
      The Classic explosives are in the game, and most of them make 2 to 4 for each craft.
    items:
      - {recipe: "Heavy Dynamite", why: "Makes 3 from cheap stone and Wool Cloth"}
      - {recipe: "Iron Grenade", why: "Makes 3 from 1 Iron Bar, 1 Heavy Blasting Powder and 1 Silk Cloth"}
      - {recipe: "Big Iron Bomb", why: "Makes 2. Satchel of Iron Bombs and Pet Bombling use it"}
      - {recipe: "Hi-Explosive Bomb", why: "Makes 4. A trainer teaches it"}
      - {recipe: "Thorium Grenade", why: "Makes 3. The last grenade of the Classic list"}
      - {recipe: "Dense Dynamite", why: "Makes 2. A trainer teaches it"}
      - {recipe: "Goblin Sapper Charge", why: "In Classic it is a strong area explosive for PvP and raids"}
      - {recipe: "Dark Iron Bomb", why: "Makes 3. Orange from 285 to the skill cap, but the reagents are costly. Satchel of Dark Iron Bombs uses 20"}
