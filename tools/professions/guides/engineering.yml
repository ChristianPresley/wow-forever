profession: Engineering
kind: crafting
icon: material-cog
description: "Engineering guide for WoW: Forever, with a path from skill 1 to 300, the new SAF-T and EZ-Thro lines, the specializations and all 247 recipes."

intro: |
  Engineering changes metal bars, stone and cloth into explosives, guns, scopes, ammunition, goggles and devices. In Forever it also makes 3 camp features and 2 new lines of parts with the names **SAF-T** and **EZ-Thro**. Most Classic explosives and all ammunition now make more items for each craft. The profession uses many bars and stones, so Mining is the usual second profession.

card:
  use: "Explosives, guns, scopes, ammunition, goggles and devices from bars, stone and cloth. Makes the Reagent Bot and the Repair Bot for a camp."
  pairs: "Mining, for the bars and the stone."

glance:
  - ["Best for", "Hunters, for guns, scopes and ammunition. In the class guides, Hunter, Paladin, Rogue, Warlock and Warrior give it rank A. No class gives it rank S"]
  - ["Main materials", "Copper, Bronze, Iron, Mithril and Thorium Bars. Rough to Dense Stone. Linen to Runecloth"]
  - ["Skill cap", "300"]
  - ["Specializations", "Gnomish Engineer, Goblin Engineer"]
  - ["Camp features", "Reagent Bot, Repair Bot, Anarchist's Workbench"]
  - ["Merchant's Favor", "Fritz Fizzle at Three Corners, Redridge Mountains. This is the Alliance camp of the Azeroth Commerce Authority"]

new:
  - "**More items for each craft.** Rough Dynamite, Coarse Dynamite and Solid Dynamite make 2. Heavy Dynamite, Large Copper Bomb, Big Bronze Bomb and Iron Grenade make 3. Hi-Explosive Bomb makes 4."
  - "**Ammunition makes 200 for each craft.** Explosive Arrow makes 100 from 100 Razor Arrows."
  - "**Silver Contact makes 5 and Gold Power Core makes 3** from 1 bar."
  - "**SAF-T and EZ-Thro lines.** New parts, such as SAF-T Tabs, EZ-Thro Wrap, SAF-T Casing and EZ-Thro Shell, go into new versions of the Classic explosives. The client data does not give their effects."
  - "**Satchels of bombs.** 4 new recipes each use 20 bombs of 1 type. The client puts them under the Ranged Weapons heading."
  - "**Field devices at skill 300.** 6 new consumable devices use a transporter or a \"Schematic: Tinker\" item as a reagent, together with SAF-T Tube or EZ-Thro Shell."
  - "**New items at skill 300:** Hyper Deluxe Sniper Rifle Mk XVII, SAF-T Ultra Precision Scope, Swiftfeather Arrow, Swiftstrike Shot, Dimensional Transporter - Mt. Hyjal and Gnomish Weather Machine."
  - "**New materials:** Legionite Bar, Azerothium Bar, Heavy Thorium Bar, Bauxite, Pyrite, Pitchblende, Torbernite and Death Lotus are reagents in the new recipes."
  - "**New headgear.** Merchant's Favor schematics teach 4 goggles, 1 for each armor type. They also teach Clanking Cord, Gizmo Girdle and Whimsical Waistwrap. The names suggest belts."
  - "**New devices from recipe items that bind:** Harvester Override Signalcaster, 9-60 Battery Pack, Hoof-Shaped Foot Pedal and Centaur Banner Deployment Device. Shredder Autosalvage Unit is also new, and its recipe item does not bind. The client data does not give their effects or their sources."
  - "**New Merchant's Favor gadgets:** Compact Critter Carrier, Emergency Field Cloak and SAF-T Disposable Parachute. The client data does not give their effects."
  - "**3 camp features:** Reagent Bot, Repair Bot and Anarchist's Workbench."
  - "**Purple, white and yellow fireworks** are new for each rocket size."
  - "**Recipe items at high skill.** The client data shows recipe items for Thorium Widget, Thorium Grenade and Thorium Shells. In Classic, a trainer also teaches them. This is not confirmed for Forever."
  - "The client data removes no Classic recipe. Forever does not change 120 recipes."

path_intro: |
  This path uses trainer recipes to skill 260. Above 260, the client data shows recipe items for the 2 best recipes. In Classic, a trainer also teaches them, so ask the trainer first. This is not confirmed for Forever. The trainer skills are Classic-era values, because the client does not hold them.

path:
  - bracket: "Apprentice (1–75)"
    intro: |
      You need Copper Bars, Rough Stone and some Linen Cloth. Buy Weak Flux from a trade vendor. In Classic, Copper Veins give Copper Ore and Rough Stone, and humanoids of low level drop Linen Cloth. These sources are not confirmed for Forever.
    steps:
      - {from: 1, to: 30, craft: "Rough Blasting Powder", note: "Yellow from 20. Keep the powder for Rough Copper Bomb"}
      - {from: 30, to: 50, craft: "Handful of Copper Bolts", learn: 30, learn_basis: classic, note: "Keep these. Many later recipes use them"}
      - {from: 50, to: 51, craft: "Arclight Spanner", learn: 50, learn_basis: classic, note: "Make 1. In Classic it is a necessary tool. This is not confirmed for Forever"}
      - {from: 51, to: 60, craft: "Rough Copper Bomb", learn: 30, learn_basis: classic, note: "Uses the powder and the bolts from the first steps. Makes 2"}
      - {from: 60, to: 75, craft: "Copper Tube", learn: 50, learn_basis: classic, note: "Keep 1 for the Reagent Bot"}
    notes:
      - "At skill 50, train Journeyman at an Engineering trainer. This is the Classic-era value."
      - "A trainer teaches the Reagent Bot. It is grey at skill 25, so make it for the camp, not for skill points."
  - bracket: "Journeyman (75–150)"
    intro: |
      You need Coarse and Heavy Stone, Copper, Bronze and Silver Bars, Linen and Wool Cloth, and Weak Flux. In Classic, Tin Veins give Coarse Stone and Iron Deposits give Heavy Stone. A miner smelts Copper Bars and Tin Bars into Bronze Bars. These are Classic-era values.
    steps:
      - {from: 75, to: 85, craft: "Coarse Blasting Powder", learn: 75, learn_basis: classic, note: "No later step of the path uses the powder. Sell it, or make Crafted Heavy Shot for a Hunter"}
      - {from: 85, to: 95, craft: "Copper Modulator", learn: 65, learn_basis: classic, note: "Uses 2 Handful of Copper Bolts for each craft"}
      - {from: 95, to: 105, craft: "Silver Contact", learn: 90, learn_basis: classic, note: "Makes 5. Keep some, because Big Iron Bomb uses 1 for each craft. If you have no Silver Bars, continue Copper Modulator to 100 and then make Practice Lock"}
      - {from: 105, to: 115, craft: "Practice Lock", learn: 100, learn_basis: classic, note: "Orange for the full step"}
      - {from: 115, to: 125, craft: "Bronze Tube", learn: 105, learn_basis: classic, note: "Yellow. Keep 1 for the Repair Bot"}
      - {from: 125, to: 135, craft: "Heavy Blasting Powder", learn: 125, learn_basis: classic, note: "Yellow. Keep all of it and make more. Explosive Sheep, Iron Grenade and Big Iron Bomb use it"}
      - {from: 135, to: 150, craft: "Whirring Bronze Gizmo", learn: 125, learn_basis: classic, note: "Yellow. Keep these for Explosive Sheep and the Repair Bot"}
    notes:
      - "At skill 125, train Expert. This is the Classic-era value, and it is not confirmed for Forever."
      - "The Repair Bot blueprint needs skill 140. The recipe is grey at 145."
  - bracket: "Expert (150–225)"
    intro: |
      You need Bronze, Iron and Mithril Bars, Heavy and Solid Stone, Wool, Silk and Mageweave Cloth, and some Medium Leather. The Gyromatic Micro-Adjustor uses 4 Steel Bars. In Classic, Iron Deposits give Heavy Stone and Mithril Deposits give Solid Stone. A miner smelts Steel Bars from Iron Bars and Coal. These are Classic-era values.
    steps:
      - {from: 150, to: 160, craft: "Bronze Framework", learn: 145, learn_basis: classic, note: "Yellow. Keep these for Explosive Sheep"}
      - {from: 160, to: 175, craft: "Explosive Sheep", learn: 150, learn_basis: classic, note: "Orange for the full step. Uses the frameworks, the gizmos and the Heavy Blasting Powder"}
      - {from: 175, to: 176, craft: "Gyromatic Micro-Adjustor", learn: 175, learn_basis: classic, note: "Yellow. Make 1 for the tool. If it gives no point, make 1 Solid Blasting Powder more. In Classic it is a necessary tool. This is not confirmed for Forever"}
      - {from: 176, to: 185, craft: "Solid Blasting Powder", learn: 175, learn_basis: classic, note: "Yellow. Keep all of it and make more. Unstable Trigger, Hi-Explosive Bomb and Mithril Gyro-Shot use it"}
      - {from: 185, to: 190, craft: "Iron Grenade", learn: 175, learn_basis: classic, note: "Yellow. Makes 3"}
      - {from: 190, to: 200, craft: "Big Iron Bomb", learn: 190, learn_basis: classic, note: "Yellow. Uses 1 Silver Contact. Makes 2"}
      - {from: 200, to: 215, craft: "Unstable Trigger", learn: 200, learn_basis: classic, note: "Yellow. Keep these for Hi-Explosive Bomb"}
      - {from: 215, to: 225, craft: "Mithril Casing", learn: 215, learn_basis: classic, note: "Yellow. Keep these. Each Hi-Explosive Bomb uses 2"}
    notes:
      - "In Classic, you train Artisan at skill 200 and level 35. This is not confirmed for Forever."
      - "In Classic, you select Gnomish or Goblin Engineering at skill 200. See the Specializations section."
  - bracket: "Artisan (225–300)"
    intro: |
      You need Mithril and Thorium Bars, Solid and Dense Stone, and Runecloth. In Classic, Thorium Veins give Dense Stone, and humanoids of level 51 and above drop Runecloth. These values are not confirmed for Forever. The client data shows recipe items for the last 2 steps.
    steps:
      - {from: 225, to: 235, craft: "Mithril Casing", learn: 215, learn_basis: classic, note: "Yellow, then green at 235. Each Hi-Explosive Bomb uses 2 casings"}
      - {from: 235, to: 245, craft: "Hi-Explosive Bomb", learn: 235, learn_basis: classic, note: "Yellow. Uses 2 Mithril Casings, 1 Unstable Trigger and 2 Solid Blasting Powder. Makes 4"}
      - {from: 245, to: 260, craft: "Mithril Gyro-Shot", learn: 245, learn_basis: classic, note: "Yellow. Makes 200. It uses fewer Mithril Bars than Hi-Explosive Bomb. Sell it to Hunters"}
      - {from: 260, to: 285, craft: "Thorium Widget", note: "The client holds a recipe item for it. In Classic a trainer teaches it at 260, so ask the trainer first. Orange to 280. Keep 2 widgets for Anarchist's Workbench"}
      - {from: 285, to: 300, craft: "Thorium Shells", note: "The client holds a recipe item for it. In Classic a trainer teaches it at 285, so ask the trainer first. Orange for the full step. Makes 200"}
    notes:
      - "The recipe items for Thorium Widget and Thorium Shells do not bind, so you can buy them from other players."
      - "If you cannot get the Thorium Widget recipe, a trainer teaches Salt Shaker. It is orange to 270, but it uses 4 Unstable Triggers for each craft."
      - "If you cannot get the Thorium Shells recipe, continue with Thorium Widget. It is yellow from 280 and green from 290, so the last points are slow."
      - "Dense Dynamite is a trainer recipe at skill 250 in Classic. It is green from 260, so it is not a good step."

picks_intro: |
  These recipes are not necessary for the path. The client data does not give the effect of an item. For a recipe that is not changed from Classic, the text gives the Classic-era use.

picks:
