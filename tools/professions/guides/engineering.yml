      - {recipe: "SAF-T Bronze Bomb", why: "Needs No Slip SAF-T Padding"}
      - {recipe: "Shafety Sheep", why: "Explosive Sheep with a SAF-T Bell"}
      - {recipe: "EZ-Thro Grenade", why: "Iron Grenade with an EZ-Thro Fireproof Fuse"}
      - {recipe: "SAF-T Casing", why: "A part for SAF-T Bomb, Emergency Field Cloak and SAF-T Disposable Parachute"}
      - {recipe: "Tru-Trigger Frag Bomb", why: "Mithril Frag Bomb with an EZ-Thro Tru-Trigger"}
      - {recipe: "SAF-T Tube", why: "A part for SAF-T Clever Dynamite and the SAF-T field devices. It uses 1 Azerothium Bar"}
      - {recipe: "EZ-Thro Shell", why: "A part for EZ-Thro Thorium Grenade and the EZ-Thro field devices"}
      - {recipe: "EZ-Thro Thorium Grenade", why: "Thorium Grenade with an EZ-Thro Shell. It makes 1, not 3"}
