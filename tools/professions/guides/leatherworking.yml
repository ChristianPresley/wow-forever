profession: Leatherworking
kind: crafting
icon: material-bag-personal
description: "Leatherworking guide for WoW: Forever: a path from skill 1 to 300, the new sets, the Merchant's Favor recipes and the 3 specializations."

intro: |
  Leatherworking changes leather, hides and scales into leather armor, mail armor, armor kits, quivers and bags. It is the largest profession in Forever, with 512 recipes in the launch client. Druids, Rogues, Hunters and Shamans wear most of its armor. Skinning supplies almost all of its materials.

card:
  use: "Leather armor, mail armor, armor kits, quivers and a reagent bag. The Camp Tent gives rested XP."
  pairs: "Skinning. It supplies the leather and the hides."

glance:
  - ["Best for", "Druids, Rogues, Hunters and Shamans"]
  - ["Main materials", "Light, Medium, Heavy, Thick and Rugged Leather, hides, scales, thread and salt"]
  - ["Skill cap", "300"]
  - ["Specializations", "Dragonscale, Elemental, Tribal"]
  - ["Camp features", "Camp Tent, Tanning Rack, Sewing Machine"]
  - ["Merchant's Favor merchant", "On the beta, Daniel Stitchsong at Three Corners, Redridge Mountains. This is the Alliance camp of the Azeroth Commerce Authority"]

new:
  - "**277 of the 512 recipes are new.** 199 Classic recipes changed, and 36 are the same as in Classic Era. The client removed no Classic recipe."
  - "**Lower skill values.** Most Classic recipes need less skill than in Classic Era. Example: Wicked Leather Bracers needs skill 240. The Classic-era value is 265."
  - "**81 Merchant's Favor recipes.** On the beta, Daniel Stitchsong sold 6 sets for skill 60 to 125 and 7 sets for skill 175 to 250. All of the armor pieces are Rare. The 2 armor kits are Uncommon."
  - "**More pieces for the Favor sets.** Each set has 3 more pieces from recipe items that are not Favor recipes. Examples: Brawler's Leather Armor, Mender's Leather Belt, Stalker's Mail Gauntlets."
  - "**4 new sets from BoP recipe items:** Azure Gustwoven, Azure Windraveled, Cloudy Gustwoven and Cloudy Windraveled. Most pieces need skill 50 to 60. The helmets and shoulders need skill 175."
  - "**New sets for level 60:** Tooled Leather and Blue Suede for leather, Supple Scorpid and Charged Scorpid for mail. The Wicked Leather set has 2 new pieces."
  - "**New Epic armor at skill 300:** the Grovekeeper, Grimstitch, Spiritcaller and Wildstalker's pieces. They use Fel Leather and Malleable Essence of Nature."
  - "**Forceful and Mystic armor kits.** Each uses a standard armor kit, enchanting dust and an elixir or a mana potion."
  - "**6 recipes moved from Blacksmithing:** Wildthorn Mail, Storm Gauntlets, Helm of the Great Chief, Invulnerable Mail, Heavy Timbermaw Belt and Heavy Timbermaw Boots."
  - "**Light Leather Reagent Bag** is a new bag for the reagent bag slot. A BoP recipe item teaches it at skill 30."
  - "**3 camp features.** The Camp Tent gives rested XP at a camp, up to 5% of a level."

path_intro: |
  The path uses trainer recipes to skill 235. After that, the trainer has no cheap recipe, so the path uses 3 recipe items from vendors. The client does not hold the skill that a trainer asks for. Each learn value of a trainer recipe in this path is a Codex estimate. The estimate is 20 to 30 points below the yellow skill. Many Classic recipe items in the client have this interval. If the trainer does not offer a recipe at the start of a step, continue with the recipe of the step before. It gives points until it is grey. The sources list 2 published Forever guides. For each step, at least 1 of them uses the recipe at the same skill or earlier. The Heavy Armor Kit step is the exception. It comes from the client data only.

path:
  - bracket: "Apprentice (1–75)"
    intro: |
      Get Light Leather from beasts of level 1 to 20. This is the Classic-era range. Buy Coarse Thread from a trade supplies vendor.
    steps:
      - {from: 1, to: 45, craft: "Light Armor Kit", note: "1 Light Leather for each kit. Yellow from 30, but no other recipe uses less leather"}
      - {from: 45, to: 75, craft: "Embossed Leather Gloves", learn: 40, learn_basis: estimate, note: "Yellow from 70"}
    notes:
      - "wow-professions.com says that Journeyman needs skill 50 and level 10."
      - "The Camp Tent is a trainer recipe that is grey at skill 25. Learn it early for the rested XP."
      - "Handstitched Leather Vest is a trainer recipe at skill 1 that is yellow from 40 to 55. Use it if the trainer does not have Embossed Leather Gloves at 45."
      - "If you have Ruined Leather Scraps, make Light Leather first. 3 scraps make 1 Light Leather, and the recipe is orange to skill 20."
  - bracket: "Journeyman (75–150)"
    intro: |
      Get Medium Leather from beasts of level 15 to 30, and Heavy Leather from beasts of level 25 to 40. These are Classic-era ranges. Buy Fine Thread, Gray Dye and Salt from a trade supplies vendor. The Dark Leather Belt needs Cured Medium Hide, which you make from 1 Medium Hide and 1 Salt.
    steps:
      - {from: 75, to: 80, craft: "Embossed Leather Gloves", learn: 40, learn_basis: estimate}
      - {from: 80, to: 100, craft: "Fine Leather Belt", learn: 60, learn_basis: estimate, note: "Yellow from 85. Keep all the belts. The Dark Leather Belt uses 1 for each craft"}
      - {from: 100, to: 115, craft: "Dark Leather Cloak", learn: 85, learn_basis: estimate, note: "Yellow from 110"}
      - {from: 115, to: 135, craft: "Dark Leather Belt", learn: 100, learn_basis: estimate, note: "Each craft uses 1 Fine Leather Belt and 1 Cured Medium Hide. Yellow from 125"}
      - {from: 135, to: 150, craft: "Heavy Armor Kit", learn: 125, learn_basis: estimate, note: "5 Heavy Leather for each kit. Yellow from 145. Keep the kits for the Forceful and Mystic Heavy Armor Kit recipes"}
    notes:
      - "wow-professions.com says that Expert needs skill 125 and level 20. It names Una in Thunder Bluff (Horde) and Telonis in Darnassus (Alliance) as the trainers."
      - "If you have much Medium Leather and no Heavy Leather, use Hillman's Leather Gloves from 135. It is a trainer recipe that is yellow from 145 and uses 14 Medium Leather."
      - "The trainer recipes Medium Leather, Cured Medium Hide and Heavy Leather also give points for a short time. Use them if you need these materials."
      - "If you have no Medium Hide, replace the Dark Leather Belt with Dark Leather Pants. It is a trainer recipe that is yellow from 115."
  - bracket: "Expert (150–225)"
    intro: |
      Heavy Leather comes from beasts of level 25 to 40, and Thick Leather from level 35 to 50. These are Classic-era ranges. Buy Fine Thread and Silken Thread from a trade supplies vendor. Barbaric Shoulders and Guardian Gloves each need 1 Cured Heavy Hide. You make it from 1 Heavy Hide and 3 Salt. Nightscape Pants needs 14 Thick Leather for each craft.
    steps:
      - {from: 150, to: 155, craft: "Heavy Armor Kit", learn: 125, learn_basis: estimate, note: "Green from 155, so the step stops there"}
      - {from: 155, to: 170, craft: "Barbaric Shoulders", learn: 150, learn_basis: estimate}
      - {from: 170, to: 195, craft: "Guardian Gloves", learn: 165, learn_basis: estimate, note: "4 Heavy Leather for each craft. Yellow from 185"}
      - {from: 195, to: 210, craft: "Nightscape Headband", learn: 180, learn_basis: estimate, note: "Yellow from 200"}
      - {from: 210, to: 225, craft: "Nightscape Pants", learn: 205, learn_basis: estimate, note: "wow-professions.com says that only the Artisan trainers teach it"}
    notes:
      - "wow-professions.com says that Artisan needs skill 200 and level 35. The trainers are Hahrana Ironhide in Camp Mojache, Feralas (Horde), and Drakk Stonehand in Aerie Peak, The Hinterlands (Alliance)."
      - "Thick Armor Kit is a trainer recipe that is orange to skill 195. If your trainer has it before 195, use it. It needs no hide."
      - "If Heavy Hide is expensive, wow-professions.com uses Barbaric Leggings and Barbaric Harness from 155 to 175. Barbaric Leggings comes from a BoP recipe item."
  - bracket: "Artisan (225–300)"
    intro: |
      Rugged Leather comes from beasts of level 45 to 60. This is the Classic-era range. Above skill 235 the trainer recipes are too expensive, so the path uses 3 vendor recipe items. All 3 bind when you pick them up. The client does not hold their vendors. The vendor names come from the 2 published guides in the sources. The path uses these 3 because the published guides name a vendor for each. Recipe items that do not bind teach equal recipes, but they have no known source. If you have one, use it.

      Buy Black Dye and Rune Thread from a trade supplies vendor. In Classic, Runecloth drops from humanoids of level 51 and above. In Classic, you skin Heavy Scorpid Scale from scorpids of level 40 to 60. These values are not confirmed for Forever. The Heavy Scorpid Helm also needs 1 Cured Rugged Hide. Each craft of Cured Rugged Hide uses 1 Rugged Hide and 1 Refined Deeprock Salt.
    steps:
      - {from: 225, to: 235, craft: "Nightscape Pants", learn: 205, learn_basis: estimate, note: "Yellow in this range"}
      - {from: 235, to: 265, craft: "Wicked Leather Gauntlets", note: "No trainer alternative. The recipe item binds, but a vendor sells it. The published guides name Leonard Porter in Western Plaguelands (Alliance) and Werg Thickblade in Tirisfal Glades (Horde). Yellow from 255"}
      - {from: 265, to: 290, craft: "Runic Leather Headband", note: "No trainer alternative. The recipe item binds, but wow-professions.com says that Jase Farlane at Light's Hope Chapel sells it. It needs 10 Runecloth for each craft. Yellow from 285"}
      - {from: 290, to: 300, craft: "Heavy Scorpid Helm", note: "Yellow in this range. It needs 12 Heavy Scorpid Scale for each craft. The recipe item binds, but Wowhead says that Zannok Hidepiercer sells it. If you have the Blue Suede Hat recipe, use it. It is orange to 300"}
    notes:
      - "If you do not have the recipe for Heavy Scorpid Helm, continue with Runic Leather Headband. It is green from 295."
      - "Recipe items that do not bind teach recipes with the same skill colours. Tooled Leather Belt and Blue Suede Shoes replace Wicked Leather Gauntlets from 235, with the same quantity of leather. Tooled Leather Crown replaces Runic Leather Headband from 265 and needs no Runecloth. Blue Suede Hat is orange from 280 to 300. The client does not say where these recipe items come from. Look for them at the auction house."
      - "If you have no recipe item at 235, continue with trainer recipes. Rugged Armor Kit uses 5 Rugged Leather and is grey at 245. Nightscape Boots is green from 240 and grey at 250. Above that, each recipe with a low material cost comes from a recipe item."
      - "Blue Dragonscale Leggings is a trainer recipe that is yellow from 310 in the client, so it is orange to skill 300. It needs 28 Rugged Leather and 36 Blue Dragonscale for each craft."
      - "wow-professions.com says that its path from 225 to 300 is not tested."

picks_intro: |
  These recipes are not necessary for the path. The source column shows where each recipe comes from. For most new items, the client data does not give the stats. Read the tooltip in the game before you buy a recipe.

picks:
  - title: "Leveling gear from skill 1 to 150"
    intro: |
      These recipes make armor for a character below level 30.
    items:
      - {recipe: "Embossed Leather Gloves", why: "Uncommon gloves that the leveling path makes"}
      - {recipe: "Moonglow Boots", why: "New Rare boots at skill 35. The same tier has Black Whelp Slippers, Dark Leather Boots and Murloc Scale Shoes"}
      - {recipe: "Brawler's Leather Armor", why: "New Rare chest at skill 75. Each of the 6 low sets has a chest of this type, and it is not a Favor recipe"}
      - {recipe: "Hillman's Shoulders", why: "A trainer recipe for shoulders with a low material cost"}
      - {recipe: "Toughened Leather Gloves", why: "Rare gloves from the trainer"}
      - {recipe: "Azure Gustwoven Bracers", why: "New. The first piece of 4 sets from BoP recipe items: Azure Gustwoven, Azure Windraveled, Cloudy Gustwoven and Cloudy Windraveled. The client data does not say where the recipe items come from"}
      - {recipe: "Trapper's Leather Helm", why: "New Rare helmet at skill 125. Each of the 6 low sets has a helmet of this type"}
  - title: "Merchant's Favor recipes to buy first"
    intro: |
      On the beta, Daniel Stitchsong sold 36 recipes for 30 Favor, 17 for 60 Favor and 28 for 90 Favor. The Mender's and Skycaller's lists show 60 Favor to skill 210 and 90 Favor from skill 225. All Favor armor needs Pristine Leather, and the high sets also need Pristine Hide. The client data does not say where Pristine Leather, Pristine Hide and Pristine Scale come from. Select 1 set for your class and buy its pieces in skill sequence. The client data does not give the stats of the sets.
    items:
      - {recipe: "Brawler's Leather Belt", why: "The first piece of a low set, at 30 Favor. The sets are Brawler's, Defender's, Stormrider's, Totemic, Trapper's and Wisdom's"}
      - {recipe: "Wisdom's Leather Tunic", why: "The chest of a low set. 1 material is different for each set. This set uses Small Lustrous Pearl"}
      - {recipe: "Forceful Thick Armor Kit", why: "1 of the 2 Favor recipes that are not armor. Each character with armor can use an armor kit"}
      - {recipe: "Mystic Rugged Armor Kit", why: "The armor kit of the highest tier on the merchant. It needs Pristine Scale and Fel Hide"}
      - {recipe: "Prowler's Leather Gloves", why: "The first piece of a high leather set, at 60 Favor. The leather sets are Mender's, Skycaller's, Prowler's, Skulker's and Warden's"}
      - {recipe: "Stalker's Mail Shoulders", why: "A piece of a high mail set. The mail sets are Mender's, Skycaller's, Skirmisher's and Stalker's. The gloves and the belt of the Skirmisher's and Stalker's sets are leather"}
      - {recipe: "Mender's Leather Waistguard", why: "The last piece of a high set, at skill 250 and 90 Favor"}
  - title: "Armor kits"
    intro: |
      In Classic, an armor kit adds armor to a chest, legs, hands or feet item. The client data does not give the effects of the new Forceful and Mystic kits.
    items:
      - {recipe: "Medium Armor Kit", why: "A trainer recipe. The Forceful and Mystic kits of this tier use 1"}
      - {recipe: "Heavy Armor Kit", why: "A trainer recipe with a low material cost"}
      - {recipe: "Thick Armor Kit", why: "A trainer recipe. The 2 enhanced kits of this tier use 1"}
      - {recipe: "Rugged Armor Kit", why: "The standard kit for level 60 in Classic"}
      - {recipe: "Forceful Heavy Armor Kit", why: "New. Its recipe item does not bind. It uses Elixir of Giant Growth. The client data does not give the effect"}
