      - {recipe: "Kodo Hide Bag", why: "A bag for a new character. It needs Thin Kodo Leather"}
      - {recipe: "Light Leather Quiver", why: "The first quiver. A trainer teaches it"}
      - {recipe: "Small Leather Ammo Pouch", why: "The first ammo pouch. A trainer teaches it"}
      - {recipe: "Quickdraw Quiver", why: "The best quiver from the trainer"}
      - {recipe: "Thick Leather Ammo Pouch", why: "The best ammo pouch from the trainer"}
  - title: "Mail for Hunters and Shamans"
