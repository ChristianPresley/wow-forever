profession: Skinning
kind: gathering
icon: material-knife
description: "Skinning guide for WoW: Forever. A path from skill 1 to 300 by creature level, the leather tiers, and the 3 Tanning camp features."

intro: |
  Skinning is a primary gathering profession. You skin dead beasts and get leather and hides. It has no nodes, so you level it while you kill creatures for quests. In Forever it also has **Tanning**, an ability that makes 3 camp features. Skinning gives the materials for Leatherworking.

card:
  use: "Leather and hides from dead beasts. Tanning adds 3 camp features."
  pairs: "Leatherworking uses the leather. Mining or Herbalism adds a second gathering profession."

glance:
  - ["Best for", "Druids, Hunters and Rogues with Leatherworking. A strong alternative for Shamans"]
  - ["Main materials", "Light, Medium, Heavy, Thick and Rugged Leather"]
  - ["Skill cap", "300"]
  - ["Skill rule (Classic)", "From skill 100, skill / 5 = the highest creature level"]
  - ["Camp features", "Camp Chair, Field Guide, Trapper's Workbench"]

new:
  - "**Tanning is new.** The ability lets a skinner add features to a wilderness camp. All 3 Skinning recipes are camp features, and all 3 are new."
  - "**Camp Chair** is the Tier 1 feature. A trainer teaches it. It gives +2% critical strike chance at a camp, and it does not stack with Moonkin Aura."
  - "**Field Guide** is the Tier 2 feature at skill 140. The Camping page lists Track Beasts for it. The client data does not give the exact effect."
  - "The Field Guide camp feature is not the Legacy talent with the same name."
  - "**Trapper's Workbench** is the Tier 3 feature at skill 300. The client data does not give its effect."
  - "**Scarce materials** come from gathering. The Legacy talent Bountiful Harvest gives +20% Scarce materials from Skinning."
  - "A starter quest lets you select a gathering profession, and it gives +2 skill."
  - "The client has no removed Skinning recipes. Classic Skinning had no recipes at all."

path_intro: |
  You level Skinning with creatures, not with recipes. The client data does not give the skill for each creature level. This path uses the Classic-era rule. Skill 1 lets you skin creatures up to level 10. Each level from 11 to 20 needs 10 more skill. From skill 100, your skill divided by 5 is the highest creature level. The zone lists are Classic-era zone levels. The rule and the zone levels are not confirmed for Forever.

path:
  - bracket: "Apprentice (1–75)"
    intro: |
      In Classic, you need a Skinning Knife. Trade supplies vendors sell it. Skin each beast that you kill in your first zones. In Classic, these creatures give Ruined Leather Scraps and Light Leather. In Classic, Light Leather comes from creatures of level 1 to 20. Keep 3 Light Leather for the Camp Chair.
    steps:
      - {from: 1, to: 50, gather: "Beasts of level 1 to 15", where: "The starting zones, then Westfall, Loch Modan, Darkshore, The Barrens and Silverpine Forest", basis: classic, note: "Skill 1 lets you skin creatures up to level 10. Level 15 needs skill 50"}
      - {from: 50, to: 75, gather: "Beasts of level 13 to 17", where: "Westfall, Loch Modan, Darkshore, The Barrens and Silverpine Forest", basis: classic, note: "Level 17 needs skill 70"}
    notes:
      - "Your skill stops at 75 until a trainer teaches Journeyman Skinning. In Classic, the trainer asks for skill 50. This is not confirmed for Forever."
      - "A trainer teaches the Camp Chair. The recipe is yellow at skill 20. The client does not hold the skill that the trainer asks for."
      - "Zephras Isle is a new zone for levels 1 to 12. Its beasts are not known."
  - bracket: "Journeyman (75–150)"
    intro: |
      In Classic, creatures of level 15 to 30 give Medium Leather, and Heavy Leather starts at level 25. Keep 3 Medium Leather for the Field Guide.
    steps:
      - {from: 75, to: 100, gather: "Beasts of level 16 to 20", where: "Redridge Mountains, Ashenvale, Stonetalon Mountains and the north of The Barrens", basis: classic, note: "Level 20 needs skill 100"}
      - {from: 100, to: 150, gather: "Beasts of level 20 to 30", where: "Ashenvale, Duskwood, Wetlands, Hillsbrad Foothills and Thousand Needles", basis: classic, note: "From here, the Classic rule is skill / 5 = the highest creature level"}
    notes:
      - "Your skill stops at 150 until a trainer teaches Expert Skinning. In Classic, the trainer asks for skill 125. This is not confirmed for Forever."
      - "At skill 140 you can learn the Field Guide from its recipe item."
  - bracket: "Expert (150–225)"
    intro: |
      In Classic, creatures of level 25 to 40 give Heavy Leather, and creatures of level 35 to 50 give Thick Leather. Keep 4 Heavy Leather for the Trapper's Workbench. You make it at skill 300.
    steps:
      - {from: 150, to: 200, gather: "Beasts of level 30 to 40", where: "Stranglethorn Vale, Arathi Highlands, Desolace, Badlands and Swamp of Sorrows", basis: classic, note: "Level 40 needs skill 200"}
      - {from: 200, to: 225, gather: "Beasts of level 40 to 45", where: "Tanaris, Feralas, The Hinterlands and the south of Stranglethorn Vale", basis: classic, note: "Level 45 needs skill 225"}
    notes:
      - "Your skill stops at 225 until a trainer teaches Artisan Skinning. In Classic, the trainer asks for skill 200. This is not confirmed for Forever."
      - "Riverglades is a new zone for levels 35 to 45. Its beasts are not known."
  - bracket: "Artisan (225–300)"
    intro: |
      In Classic, creatures of level 45 to 60 give Rugged Leather.
    steps:
      - {from: 225, to: 250, gather: "Beasts of level 45 to 50", where: "Feralas, Tanaris, The Hinterlands and Un'Goro Crater", basis: classic, note: "Level 50 needs skill 250"}
      - {from: 250, to: 275, gather: "Beasts of level 50 to 55", where: "Un'Goro Crater, Felwood, Western Plaguelands and Burning Steppes", basis: classic, note: "Level 55 needs skill 275"}
      - {from: 275, to: 300, gather: "Beasts of level 55 to 60", where: "Winterspring, Eastern Plaguelands and Silithus", basis: classic, note: "Level 60 needs skill 300"}
    notes:
      - "Mount Hyjal is a new zone for level 60. Its beasts are not known."

picks_intro: |
  Skinning has only 3 recipes, and all 3 are camp features. They give almost no skill points, so make them for their camp effect.

picks:
  - title: "Camp features"
    intro: |
      Each player can add 1 feature to a camp. Higher tiers include the features of the lower tiers.
    items:
      - {recipe: "Camp Chair", why: "Tier 1. It gives +2% critical strike chance at a camp. It does not stack with Moonkin Aura"}
      - {recipe: "Field Guide", why: "Tier 2. The Camping page lists Track Beasts for it. The client data does not give the exact effect"}
      - {recipe: "Trapper's Workbench", why: "Tier 3. The client data does not give its effect. It gives no skill points"}

sources_note: |
  A trainer teaches the Camp Chair. The client does not hold the skill that the trainer asks for. The recipe turns yellow at skill 20, and camp utility starts at skill 20. Each profession gives a "Camping 101" quest for its Tier 1 feature. First do the quest The Great Outdoors and make a Basic Campfire with Cooking. Recipe items teach the Field Guide at skill 140 and the Trapper's Workbench at skill 300. Tier 2 and Tier 3 blueprints drop from dungeon and raid bosses. The known blueprint drops do not include the 2 Skinning blueprints. No Skinning recipe needs Merchant's Favor, and no Merchant's Favor merchant sells Skinning recipes. No recipe item binds when you pick it up.

camp_note: |
  Camping starts with the quest The Great Outdoors at about level 5. You need Cooking and a Basic Campfire. Then a "Camping 101" quest for Skinning leads to the Camp Chair. The Camp Chair needs Light Leather and Simple Wood. The Field Guide needs Medium Leather, Slimy Murloc Scale and Fine Thread. The Trapper's Workbench needs Heavy Leather, Simple Wood and an Iron Bar. In Classic, trade supplies vendors sell Simple Wood, Star Wood and Fine Thread. In Classic, murlocs drop Slimy Murloc Scale, and a miner smelts Iron Bar from Iron Ore. These sources are Classic-era values. They are not confirmed for Forever. The Legacy talent Reagent Economy removes the reagents of Tier 1 camp features.

tips:
  - "A camp accepts 1 feature from each player. Higher tiers include the features of the lower tiers."
  - "If you cannot skin a creature, use the Classic rule. From skill 100, your skill divided by 5 is the highest creature level."
  - "A creature that is far below your skill gives no skill point. This is the Classic-era rule."
  - "In Classic, you can skin a beast that a different player killed and looted. This is not confirmed for Forever."
  - "Keep Light Leather, Medium Leather and Heavy Leather for the 3 camp features."
  - "The Camp Chair is grey at skill 25 and the Field Guide is grey at skill 145. Do not use them to level."
  - "The Trapper's Workbench is yellow, green and grey at skill 300 in the client. It gives no skill points."
  - "Bountiful Harvest in the Legacy tree gives +20% Scarce materials from Skinning."

faq:
  - q: "What creature level can I skin?"
    a: "The client data does not give this. In Classic, from skill 100, divide your skill by 5. Below skill 100, skill 1 lets you skin up to level 10. Each level above 10 needs 10 more skill. This is not confirmed for Forever."
  - q: "Do I need a tool?"
    a: "Yes. In Classic you need a Skinning Knife in your bags. Trade supplies vendors sell it. This is not confirmed for Forever."
  - q: "What is Tanning?"
    a: "Tanning is the Skinning ability that makes camp features. It has 3 recipes: Camp Chair, Field Guide and Trapper's Workbench."
  - q: "Is the Field Guide camp feature the same as the Field Guide Legacy talent?"
    a: "No. The Legacy talent Field Guide decreases camp cooldowns. The Skinning Field Guide is a Tier 2 camp feature."
  - q: "Which leather comes from which creatures?"
    a: "The client data does not give this. In Classic, the leather tier follows the creature level, from Light Leather to Rugged Leather. In Classic, creatures also give a hide of the same tier at a low rate."
  - q: "Does Skinning give Legacy Points?"
    a: "No. Legacy Points come from skill 150, 225 and 300 in the 6 crafting professions. Gathering professions do not count."
  - q: "Where do Pristine Leather and Fel Leather come from?"
    a: "The client data does not say. Leatherworking, Blacksmithing and Tailoring recipes use Pristine Leather, and Leatherworking recipes use Fel Leather. The wiki says that gathering gives Scarce materials, but it does not name them."

