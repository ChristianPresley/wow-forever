faq:
  - q: "Is it a good idea to level with Lone Wolf?"
    a: "No. Warcraft Tavern and Method recommend Beast Mastery for leveling, because the pet tanks for you. Lone Wolf opens at 10 Marksmanship points and is a raid talent."
  - q: "Where is Trueshot Aura in the tree?"
    a: "In the launch client, Trueshot Aura is in Marksmanship row 4 and needs 15 points. Beta-era information called it a 21-point talent. It gives 20 Ranged Attack Power, and Sniper Shot needs it."
  - q: "How does Rapid Recuperation work?"
    a: "In the launch client, it starts when you apply Serpent Sting and lasts 15 s. During that time, 25/50% of your mana regeneration continues while you cast. The value is 50/100% after you use the Rapid Killing bonus. Beta-era information gave a constant 50% while Serpent Sting is on the target."
  - q: "Does Improved Arcane Shot make Summon Hawk faster?"
    a: "No. Summon Hawk and Arcane Shot share a cooldown, but the tooltip says that Improved Arcane Shot does not change abilities that share the cooldown. Thus, Beast Mastery builds do not take it."
  - q: "What does Deadly Aspects do?"
    a: "It does not increase the Attack Power of your aspects. In the launch client it gives a 2–10% chance for 30% attack speed for 12 s. Auto Shot procs it with Aspect of the Hawk, and melee auto attacks proc it with Aspect of the Beast."

