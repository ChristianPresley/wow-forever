class: Hunter
badges: [dps]
description: "Hunter talent guide for WoW: Forever: all 52 talents in Beast Mastery, Marksmanship and Survival with a rating, a talent for each level from 10 to 60, and level 60 builds for raids and PvP."

intro: |
  Each Hunter tree is a damage spec in Forever. **Beast Mastery** is the pet tree and the tree for leveling. **Marksmanship** is the ranged tree that players expect in raids, and it can play with no pet. **Survival** is the melee and trap tree, and it is strong in PvP. All level 60 builds on this page are theory until the raids open.

card:
  leveling: "Beast Mastery. The pet tanks while you shoot"
  pve: "Marksmanship with Lone Wolf. Beast Mastery if you keep the pet"
  pvp: "Survival for traps and roots, or Marksmanship with Scatter Shot"

quick:
  - stage: "Level 10–39"
    build: bm-leveling
    why: "Summon Hawk at level 25. Intimidation at 30. The pet holds aggro and you have little downtime."
  - stage: "Level 40–59"
    build: bm-leveling
    why: "Bestial Wrath at 40. Then crit and Attack Power talents from Marksmanship."
  - stage: "Level 10–59, mostly dungeons"
    build: mm-leveling
    why: "Your shots do the damage, and the pet does not have to tank. Sniper Shot at 40."
  - stage: "Level 10–59, melee"
    build: sv-leveling
    why: "For players who want the melee Hunter. It is slower than Beast Mastery for quests."
  - stage: "Level 60: dungeons"
    build: bm-raid
    why: "The pet and the hawks do stable damage, and the pet can hold a loose mob."
  - stage: "Level 60: raids"
    build: mm-raid
    why: "The spec that players expect in raids. Lone Wolf gives 20% damage with no pet."
  - stage: "Level 60: PvP"
    build: sv-pvp
    why: "A 5 s root from each trap, traps each 18 s, and Counterattack against melee classes."
  - stage: "Hardcore"
    build: bm-leveling
    why: "The safest route. A pet with Endurance Training takes the hits, and Intimidation stops a dangerous mob."

trees:
  Beast Mastery:
    summary: |
      Beast Mastery makes the pet stronger and adds hawks. **Summon Hawk** opens at 15 points, and **Unleashed Fury** and **Ferocity** apply to the hawks also. **Deadly Aspects** in row 1 helps each spec, so most builds from other trees take it.
    talents:
      Deadly Aspects:
        {does: "With Aspect of the Hawk, Auto Shot has a 2–10% chance to give +30% ranged attack speed for 12 s. With Aspect of the Beast, melee auto attacks give the same bonus to melee attack speed", lvl: S, pve: S, pvp: B, note: "The first 5 points of most builds. It works for ranged and melee Hunters."}
      Endurance Training:
        {does: "Health and armor of your pets +3–15%", lvl: B, pve: C, pvp: B, note: "Take 3 points to open row 3. Take 5/5 if your pet dies often."}
      Focused Fire:
        {does: "All damage from you and your pet +1/2% while your pet is active", lvl: A, pve: A, pvp: B, note: "A small bonus for each build that keeps the pet. It does nothing with Lone Wolf."}
      Improved Aspect of the Monkey:
        {does: "Dodge bonus of Aspect of the Monkey +2/4/6%. Your pet gets 50% of the effect of Aspect of the Monkey", lvl: C, pve: D, pvp: C, note: "You lose Aspect of the Hawk while you use it. Filler only."}
      Improved Revive Pet:
        {does: "Revive Pet cast time −3/6 s and mana cost −20/40%. The pet returns with 15/30% more health", lvl: C, pve: D, pvp: C, note: "Useful only when the pet dies often."}
      Pathfinding:
        {does: "Speed bonus of Aspect of the Cheetah and Aspect of the Pack +3/6%", lvl: C, pve: D, pvp: C, note: "A travel talent. It gives no damage."}
      Bestial Swiftness:
        {does: "Movement speed of your pets +30%", lvl: A, pve: B, pvp: A, note: "The pet gets to targets faster. Intimidation needs it."}
      Unleashed Fury:
        {does: "Damage of your pets and hawks +3–15%", lvl: S, pve: S, pvp: A, note: "The largest pet damage talent. It applies to the hawks from Summon Hawk also."}
      Improved Mend Pet:
        {does: "Each heal of Mend Pet has a 15/50% chance to remove 1 Curse, Disease, Magic or Poison effect from the pet. Mana cost −10/20%", lvl: C, pve: C, pvp: B, note: "Filler. It helps against slows and roots on the pet in PvP."}
      Ferocity:
        {does: "Crit chance of your pets and hawks +2–10%", lvl: S, pve: S, pvp: A, note: "Frenzy needs 5/5."}
      Summon Hawk:
        {does: "An instant ability with a 6 s cooldown that it shares with Arcane Shot. A hawk hits for 32 + 5% of your Ranged Attack Power and attacks for 18 s. Maximum 2 hawks", lvl: S, pve: S, pvp: A, note: "Available at level 25. Keep 2 hawks active, then use Arcane Shot."}
      Spirit Bond:
        {does: "While your pet is active, you and your pet regenerate 1% of total health each 10/5 s", lvl: B, pve: C, pvp: B, note: "Less time to eat when you level. Good for Hardcore."}
      Intimidation:
        {does: "The next attack of your pet stuns the target for 3 s and has +100% crit chance. It makes high threat. 1 min cooldown", lvl: A, pve: B, pvp: S, note: "A stun and a threat tool in one. Bestial Wrath needs it. Raid bosses are usually immune to stuns."}
      Bestial Discipline:
        {does: "Focus regeneration of your pets +10/20%. 25/50% of your mana regeneration continues while you cast", lvl: A, pve: A, pvp: B, note: "More pet attacks and more mana. Take it if you are often out of mana."}
      Frenzy:
        {does: "After a crit, your pet has a 20–100% chance to get +30% attack speed for 8 s", lvl: A, pve: S, pvp: A, note: "Pets get your crit chance and Ferocity. Thus, the bonus is active most of the time."}
      Bestial Wrath:
        {does: "Your pet does 50% more damage for 18 s, and nothing can stop it. 2 min cooldown", lvl: A, pve: S, pvp: S, note: "The burst cooldown of the tree. Available at level 40."}
  Marksmanship:
    summary: |
      Marksmanship increases the damage of your shots. **Careful Aim** changes Intellect into Attack Power, and **Sniper Shot** is the 4 s cast at the end of the tree. **Lone Wolf** at 10 points gives 20% damage if you have no pet. **Lethal Attacks** and Careful Aim are also good for Beast Mastery and Survival builds.
    talents:
      Hawk Eye:
        {does: "Range of your ranged weapons +2/4/6 yd", lvl: C, pve: B, pvp: A, note: "No damage, but more range helps with boss mechanics and in PvP. A personal preference in raids."}
      Improved Concussive Shot:
        {does: "Concussive Shot has a 4–20% chance to stun the target for 3 s", lvl: C, pve: D, pvp: C, note: "5 points for a proc that you cannot control."}
      Lethal Attacks:
        {does: "Crit chance of all attacks +1–5%", lvl: A, pve: S, pvp: A, note: "It applies to ranged and melee attacks. Each build takes 5/5."}
      Improved Stings:
        {does: "Serpent Sting damage +6% to +20%. Viper Sting cooldown −2 to −6 s. Scorpid Sting lasts 15 to 45 s longer", lvl: B, pve: A, pvp: A, note: "The Serpent Sting bonus is the PvE value. Viper Sting is the PvP value."}
      Efficiency:
        {does: "Mana cost of Shots, Stings and melee abilities −3–15%", lvl: A, pve: B, pvp: A, note: "Take it when mana is your limit. It gives no damage."}
      Careful Aim:
        {does: "Attack Power equal to 20–100% of your Intellect", lvl: A, pve: S, pvp: A, note: "It makes Intellect a damage stat. Mortal Shots needs 5/5."}
      Rapid Killing:
        {does: "Rapid Fire cooldown −1/2 min. When you kill a non-trivial enemy, or it dies with your Serpent Sting on it, your next Shot within 20 s does 10/20% more damage", lvl: A, pve: A, pvp: B, note: "On a boss, only the shorter Rapid Fire cooldown is reliable. Rapid Recuperation needs 2/2."}
      Improved Arcane Shot:
        {does: "Arcane Shot cooldown −0.3 to −1.5 s. No effect on Summon Hawk", lvl: B, pve: A, pvp: A, note: "More instant damage, at a higher mana cost. Low value for Beast Mastery, because Summon Hawk uses the same cooldown."}
      Lone Wolf:
        {does: "All your attacks do 20% more damage while you have no active pet", lvl: C, pve: S, pvp: B, note: "1 point for 20% damage in raids. Do not use it to level, because the pet tanks for you."}
      Trueshot Aura:
        {does: "Party and raid members within 45 yd get +20 Ranged Attack Power", lvl: B, pve: A, pvp: B, note: "The bonus is small in the launch client. Sniper Shot needs it."}
      Mortal Shots:
        {does: "Crit damage bonus of all ranged abilities +6–30%", lvl: A, pve: S, pvp: A, note: "Core for each build with 15 or more Marksmanship points."}
      Improved Serpent Sting:
        {does: "Serpent Sting damage +2–10%", lvl: C, pve: B, pvp: C, note: "5 points for 10% on 1 ability. Take it after the other damage talents."}
      Rapid Recuperation:
        {does: "After you apply Serpent Sting, 25/50% of your mana regeneration continues while you cast for 15 s. This increases to 50/100% when you use the Rapid Killing bonus", lvl: B, pve: A, pvp: C, note: "The mana talent for long fights. Keep Serpent Sting on the target."}
      Barrage:
        {does: "Damage of Multi-Shot, Aimed Shot and Volley +5/10/15%", lvl: A, pve: S, pvp: A, note: "Aimed Shot is baseline at level 20, so each build with 20 Marksmanship points can use it."}
      Scatter Shot:
        {does: "A shot with a 15 yd range and a 30 s cooldown. It does 50% weapon damage and disorients the target for 4 s. Damage removes the effect", lvl: B, pve: C, pvp: S, note: "The reason to put 21 points in Marksmanship for PvP. It also gives you time to put a trap."}
      Ranged Weapon Specialization:
        {does: "Damage with ranged weapons +1–5%", lvl: A, pve: S, pvp: A, note: "A direct damage bonus. It also opens row 7."}
      Sniper Shot:
        {does: "A 4 s cast with a 15 s cooldown and a 45 yd range. It does ranged damage plus 320. Your next 3 Shots get +10 yd range for 10 s", lvl: A, pve: S, pvp: B, note: "Start the pull with it and use it on cooldown. The long cast is difficult to complete in PvP."}
  Survival:
    summary: |
      Survival is the melee and trap tree. **Expose Prey** lets you use Mongoose Bite more often, and **Lacerating Strikes** adds a bleed to it. **Entrapment** and **Survivalist's Discipline** make traps a strong control tool in PvP. The PvE ratings in this tree are for a melee Survival build, or for all specs when the note says so.
    talents:
      Improved Tracking:
        {does: "All damage +1–5% to the creature type that you track", lvl: A, pve: S, pvp: A, note: "It works for all specs, if you track the correct type. Track Humanoids applies to players."}
      Deflection:
        {does: "Parry chance +1–5%", lvl: C, pve: D, pvp: B, note: "For PvP against melee classes. Each parry lets you use Counterattack."}
      Entrapment:
        {does: "When a trap triggers, all affected targets cannot move for 1–5 s", lvl: B, pve: C, pvp: S, note: "A guaranteed root from each trap. Proc roots share diminishing returns."}
      Savage Strikes:
        {does: "Crit chance of all melee abilities +2/4%", lvl: B, pve: A, pvp: B, note: "For melee builds only. It does nothing for ranged attacks."}
      Survivalist:
        {does: "Total health +2–10%", lvl: B, pve: C, pvp: A, note: "The usual way to open rows 3 and 4. Good for PvP and Hardcore."}
      Improved Wing Clip:
        {does: "Wing Clip has a 7% to 20% chance to immobilize the target for 5 s", lvl: C, pve: D, pvp: B, note: "It helps you to get out of melee range. The root shares diminishing returns with Entrapment."}
      Clever Traps:
        {does: "Freezing Trap and Frost Trap effects last 15/30% longer. Immolation Trap and Explosive Trap do 15/30% more damage", lvl: B, pve: B, pvp: A, note: "Traps work in combat in Forever. Thus, this talent has value for damage and for control."}
      Surefooted:
        {does: "Hit chance +1/2/3%. Movement impairing effects on you last 10/20/30% less", lvl: B, pve: S, pvp: A, note: "The only hit talent of the class. It costs 13 Survival points, so ranged raid builds get hit from gear."}
      Deterrence:
        {does: "Dodge and parry chance +25% for 10 s. 5 min cooldown", lvl: A, pve: C, pvp: A, note: "An emergency button against melee enemies. Counterattack needs it."}
      Survival Tactics:
        {does: "Hit chance of your Trap and Feign Death abilities +5/10%", lvl: C, pve: C, pvp: B, note: "Fewer resists on Freezing Trap and Feign Death. Filler."}
      "Predator's Edge":
        {does: "Crit damage of melee abilities +6–30%. Off Hand weapon damage +10–50%", lvl: A, pve: S, pvp: B, note: "Core for melee builds, with 2 weapons or with a two-hand weapon. No value for ranged builds."}
      Counterattack:
        {does: "A melee strike with a 5 s cooldown that you can use after you parry. It does 50% weapon damage plus 26 and immobilizes the target for 5 s", lvl: B, pve: C, pvp: A, note: "You must parry to use it. Bosses do not attack you in a raid, so it has little PvE value."}
      Resourcefulness:
        {does: "Mana cost of Trap and melee abilities −30/60%. Your crits have a 50/100% chance to let 50% of your mana regeneration continue while you cast for 30 s", lvl: A, pve: A, pvp: B, note: "The mana talent for melee builds. Players reported a bug with the crit effect in the beta. It is not confirmed that the bug is fixed."}
      Expose Prey:
        {does: "Your melee and ranged attacks against a target with Hunter's Mark have a 5/10% chance to let you use Mongoose Bite. The effect lasts 10 s", lvl: A, pve: S, pvp: A, note: "In Classic, Mongoose Bite needs a dodge. This talent gives you more uses. Lacerating Strikes needs 2/2."}
      "Survivalist's Discipline":
        {does: "Cooldown of your Trap and Deterrence abilities −20/40%", lvl: B, pve: A, pvp: S, note: "The trap cooldown decreases from 30 s to 18 s. More Immolation Traps in PvE and more roots in PvP."}
      Strider Kick:
        {does: "A melee attack with an 8 s cooldown. It does 100% melee weapon damage and gives you +30% movement speed for 3 s", lvl: A, pve: S, pvp: A, note: "A strong melee button. The speed bonus helps you to go into or out of melee range."}
      Lightning Reflexes:
        {does: "Agility +3–15%", lvl: A, pve: S, pvp: S, note: "Agility gives Attack Power, crit, dodge and armor. It is good for melee and ranged attacks."}
      Lacerating Strikes:
        {does: "Mongoose Bite also makes the target bleed for 40% of its damage during 21 s", lvl: A, pve: S, pvp: A, note: "Available at level 40. Its value depends on Expose Prey procs."}

builds:
  - id: bm-leveling
    name: "Beast Mastery (leveling)"
    kind: leveling
    role: "Leveling"
    summary: |
      The route that Method, Mobalytics and Warcraft Tavern recommend for 1–60. The pet tanks and you shoot. The order follows their milestones: Summon Hawk at 25, Intimidation at 30 with 21 points, then Bestial Wrath at 40.
    steps:
      - [Deadly Aspects, 5, "Faster Auto Shot from the first point"]
      - [Focused Fire, 2, "2% damage for you and the pet"]
      - [Endurance Training, 3, "A pet that lives longer. Opens row 3"]
      - [Bestial Swiftness, 1, "The pet gets to the target faster"]
      - [Unleashed Fury, 4, "Pet damage. Opens row 4"]
      - [Summon Hawk, 1, "Your new main ability at level 25"]
      - [Unleashed Fury, 1, "15% damage for the pet and the hawks"]
      - [Ferocity, 3, "Crit for the pet and the hawks. Opens row 5"]
      - [Intimidation, 1, "A 3 s stun and a threat tool at level 30"]
      - [Ferocity, 2, "Frenzy needs 5/5"]
      - [Bestial Discipline, 2, "More pet attacks and more mana"]
      - [Frenzy, 5, "30% attack speed for the pet after a crit"]
      - [Bestial Wrath, 1, "The burst cooldown at level 40"]
      - [Lethal Attacks, 5, "5% crit. The pet gets your crit chance"]
      - [Careful Aim, 5, "Attack Power from Intellect"]
      - [Efficiency, 5, "Cheaper shots. Opens Marksmanship row 4"]
      - [Mortal Shots, 5, "Larger crits with shots"]
    notes:
      - "If your pet dies often, move the 2 points from Focused Fire to Endurance Training until level 40."
      - "For Hardcore, take Spirit Bond 2/2 in place of 2 points of Efficiency."
      - "At level 60 this is the same layout as the Beast Mastery level 60 build."

  - id: mm-leveling
    name: "Marksmanship (leveling)"
    kind: leveling
    role: "Leveling"
    summary: |
      A ranged build that keeps the pet. It is good if you level mostly in dungeons, where a tank holds the mobs. No source recommends it for quests. This order is a Codex order from the client data.
    steps:
      - [Lethal Attacks, 5, "5% crit for all attacks"]
      - [Careful Aim, 5, "Attack Power from Intellect"]
      - [Rapid Killing, 2, "Each kill makes your next Shot 20% stronger"]
      - [Improved Arcane Shot, 3, "More Arcane Shots. Opens row 4"]
      - [Trueshot Aura, 1, "A small Ranged Attack Power bonus. Sniper Shot needs it"]
      - [Mortal Shots, 5, "Larger crits. Opens row 5"]
      - [Rapid Recuperation, 2, "Mana regeneration while Serpent Sting is active"]
      - [Barrage, 2, "More damage for Aimed Shot and Multi-Shot. Opens row 6"]
      - [Ranged Weapon Specialization, 5, "5% ranged damage"]
      - [Sniper Shot, 1, "A large shot to start each pull at level 40"]
      - [Barrage, 1, "15% for Aimed Shot and Multi-Shot"]
      - [Efficiency, 5, "Cheaper Shots and Stings"]
      - [Improved Arcane Shot, 2, "A 4.5 s Arcane Shot cooldown"]
      - [Improved Stings, 3, "20% Serpent Sting damage"]
      - [Scatter Shot, 1, "An emergency button when a mob gets to you"]
      - [Deadly Aspects, 5, "30% ranged attack speed procs"]
      - [Hawk Eye, 3, "More range for pulls"]
    notes:
      - "Do not take Lone Wolf while you level. The pet decreases the damage that you take."
      - "For raids at 60, move the point from Scatter Shot to Lone Wolf, and move Efficiency to Improved Serpent Sting."

  - id: sv-leveling
    name: "Survival (melee)"
    kind: leveling
    role: "Leveling"
    summary: |
      The melee Hunter. The class guide says that it is weaker than Beast Mastery for quests, and no source has published an order. This is a Codex order from the client data. Use Aspect of the Beast, shoot while the target comes to you, then fight in melee with the pet.
    steps:
      - [Improved Tracking, 5, "5% damage to the creature type that you track"]
      - [Savage Strikes, 2, "Crit for Raptor Strike and Mongoose Bite"]
      - [Survivalist, 3, "Health for melee fights. Opens row 3"]
      - [Deterrence, 1, "An emergency button. Counterattack needs it"]
      - [Surefooted, 3, "3% hit"]
      - [Survivalist, 1, "Opens row 4"]
      - [Counterattack, 1, "A strike and a root after each parry"]
      - ["Predator's Edge", 4, "Larger melee crits. Opens row 5"]
      - [Strider Kick, 1, "A melee attack each 8 s at level 30"]
      - ["Predator's Edge", 1, "30% crit damage for melee abilities"]
      - [Expose Prey, 2, "More Mongoose Bites. Lacerating Strikes needs 2/2"]
      - [Resourcefulness, 1, "Cheaper melee abilities and traps. Opens row 6"]
      - [Lightning Reflexes, 5, "15% Agility"]
      - [Lacerating Strikes, 1, "A bleed from Mongoose Bite at level 40"]
      - [Resourcefulness, 1, "60% lower cost for melee abilities and traps"]
      - [Survivalist, 1, "10% health"]
      - [Clever Traps, 2, "30% more Immolation Trap damage"]
      - ["Survivalist's Discipline", 1, "Traps more often"]
      - [Lethal Attacks, 5, "5% crit for all attacks"]
      - [Careful Aim, 5, "Attack Power from Intellect"]
      - [Deadly Aspects, 5, "30% melee attack speed procs with Aspect of the Beast"]
    notes:
      - "Keep Hunter's Mark on the target. Expose Prey works only against a target with Hunter's Mark."
      - "If you get dual spec at 40, keep Beast Mastery as your second spec for difficult quests."

  - id: mm-raid
    name: "Marksmanship (raid)"
    kind: endgame
    role: "Raid DPS"
    summary: |
      The 5/46/0 split that Warcraft Tavern gives for raids, built from the launch client. It takes all damage talents in Marksmanship and plays with no pet for Lone Wolf. It has no hit talent, so get hit from gear.
    steps:
      - [Lethal Attacks, 5]
      - [Careful Aim, 5]
      - [Improved Stings, 3, "20% Serpent Sting damage"]
      - [Rapid Killing, 2, "A shorter Rapid Fire cooldown. Rapid Recuperation needs it"]
      - [Improved Arcane Shot, 5]
      - [Lone Wolf, 1, "20% damage with no pet. If you keep the pet, move this point to Improved Tracking"]
      - [Trueshot Aura, 1]
      - [Mortal Shots, 5]
      - [Rapid Recuperation, 2, "Your mana talent. Keep Serpent Sting on the boss"]
      - [Barrage, 3]
      - [Ranged Weapon Specialization, 5]
      - [Sniper Shot, 1]
      - [Improved Serpent Sting, 5, "The weakest 5 points of the build. You can move them to Efficiency if you have no mana"]
      - [Hawk Eye, 3, "A personal preference. You can move these points to Efficiency"]
      - [Deadly Aspects, 5, "30% ranged attack speed procs"]
    notes:
      - "It is not confirmed how much damage a pet does in raids. If the pet does more than 20% of your damage, a build with a pet is better."
      - "Keep a pet in the stable for fights where its utility helps."

  - id: bm-raid
    name: "Beast Mastery (dungeons and raids)"
    kind: endgame
    role: "Raid DPS"
    summary: |
      A deep Beast Mastery build with all pet and hawk damage talents and Bestial Wrath. The other 20 points get crit and Attack Power from Marksmanship. Use it in dungeons and for solo play. In raids it is an alternative to Marksmanship.
    steps:
      - [Deadly Aspects, 5]
      - [Focused Fire, 2]
      - [Endurance Training, 3, "Filler to open row 3. It helps the pet against AoE damage"]
      - [Bestial Swiftness, 1]
      - [Unleashed Fury, 5]
      - [Ferocity, 5]
      - [Summon Hawk, 1]
      - [Intimidation, 1, "Bestial Wrath needs it"]
      - [Bestial Discipline, 2, "Mana for long fights"]
      - [Frenzy, 5]
      - [Bestial Wrath, 1]
      - [Lethal Attacks, 5]
      - [Careful Aim, 5]
      - [Efficiency, 5, "Opens Marksmanship row 4. You can move 3 points to Improved Stings"]
      - [Mortal Shots, 5]
    notes:
      - "It is not confirmed how well pets live through boss AoE in raids."

  - id: sv-melee
    name: "Survival (melee)"
    kind: endgame
    role: "Melee DPS"
    summary: |
      A melee build with all melee damage talents and faster traps. No source has published a point split or a complete priority for melee Survival. This is a Codex build from the client data, and nobody tested it in raids.
    steps:
      - [Improved Tracking, 5]
      - [Savage Strikes, 2]
      - [Survivalist, 4, "Filler to open rows 3 and 4"]
      - [Surefooted, 3, "3% hit"]
      - [Deterrence, 1]
      - [Clever Traps, 2, "30% more Immolation Trap damage"]
      - ["Predator's Edge", 5]
      - [Counterattack, 1, "A personal preference. Useful in dungeons and when you play solo"]
      - [Resourcefulness, 2]
      - [Expose Prey, 2]
      - ["Survivalist's Discipline", 2, "An Immolation Trap each 18 s"]
      - [Strider Kick, 1]
      - [Lightning Reflexes, 5]
      - [Lacerating Strikes, 1]
      - [Lethal Attacks, 5]
      - [Careful Aim, 5]
      - [Deadly Aspects, 5, "30% melee attack speed procs with Aspect of the Beast"]

  - id: sv-pvp
    name: "Survival (PvP)"
    kind: endgame
    role: "PvP"
    summary: |
      The control build for battlegrounds and world PvP. The class guide names the core: Lacerating Strikes, Counterattack and Strider Kick, with Improved Stings and Efficiency from Marksmanship. Nobody has published a point split, so this is a Codex split.
    steps:
      - [Deflection, 5, "More parries for Counterattack"]
      - [Entrapment, 5, "A 5 s root from each trap"]
      - [Survivalist, 5]
      - [Surefooted, 3, "Slows on you are 30% shorter"]
      - [Deterrence, 1]
      - [Clever Traps, 2, "A longer Freezing Trap"]
      - [Counterattack, 1]
      - [Improved Wing Clip, 3, "It shares diminishing returns with the other roots. You can move these points to Predator's Edge"]
      - [Savage Strikes, 2]
      - ["Survivalist's Discipline", 2, "A trap each 18 s"]
      - [Strider Kick, 1]
      - [Expose Prey, 2]
      - [Lightning Reflexes, 5]
      - [Lacerating Strikes, 1]
      - [Lethal Attacks, 5]
      - [Improved Stings, 3, "A shorter Viper Sting cooldown against casters"]
      - [Efficiency, 5]

  - id: mm-pvp
