faq:
  - q: "Is Malediction in the Affliction tree?"
    a: "No. Blizzard's deep dive from the beta listed Malediction with +5% periodic damage. The launch client has no talent with that name. Do not plan points for it."
  - q: "Is Grim Reach removed?"
    a: "No. The deep dive listed Grim Reach as removed, but the launch client has it in Affliction row 2 with 2 ranks. It gives +20% range to Affliction spells."
  - q: "Does Improved Drains make Wrack stronger?"
    a: "The launch tooltip lists only Drain Life, Drain Soul and Drain Mana. Soul Siphon and Fel Concentration do list Wrack. Thus, the Wrack raid build takes Soul Siphon and not Improved Drains."
  - q: "Do I take Improved Shadow Bolt in a Destruction build?"
    a: "Only if you cast Shadow Bolt. The effect comes only from Shadow Bolt crits and helps only your own Shadow damage. At 60, Destruction uses Incinerate, so the raid build does not take it."
  - q: "Can a Warlock tank with these talents?"
    a: "Demonic Brand gives a Voidwalker high threat, so pet tanking is an option in dungeons. Blizzard announced a Voidwalker hotfix for 10 November. Pet tanking in raids is not confirmed."

